name: VCAM PRO Photo Geometry Camera Critical Path Remediation 003

on:
  push:
    branches:
      - builder/canonical-hook-continuation-001
    paths:
      - "src/product/CameraConsumerAdapter.*"
      - "src/product/MediaserverdRuntime.*"
      - "src/product/ReferenceCameraHook.*"
      - "src/media_engine/InternalGalleryMediaSession.*"
      - "tests/product/photo_geometry_working_set_tests.mm"
      - "tests/product/camera_consumer_adapter_tests.cpp"
      - "product/photo_geometry_working_set_002/**"
      - "docs/research/PHOTO_GEOMETRY_WORKING_SET_RENDER_PARITY_002.md"
      - "docs/CANONICAL_PROJECT_STATE.md"
      - ".github/workflows/photo-geometry-working-set-001-ci.yml"
      - ".github/workflows/ios15-central-motioncam-gallery-e2e-convergence-001-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcampro-photo-geometry-camera-critical-path-003
  cancel-in-progress: true

jobs:
  exact-head-remediation:
    name: Exact-head working set and reachable callback audit
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Source scope and direct-render removal
        shell: bash
        run: |
          set -euo pipefail
          START=d71c3ecdf2860ed078d1c7a42a020a366c7b0328
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$START" HEAD
          git diff --exit-code "$START" HEAD -- src/media_engine/LocalPhotoReader.mm
          git diff --exit-code "$START" HEAD -- src/media_engine/LocalVideoReader.mm
          git diff --exit-code "$START" HEAD -- src/frame_engine/ReadyFrameQueue.cpp src/frame_engine/ReadyFrameQueue.h
          git diff --exit-code "$START" HEAD -- src/media_engine/FrameTransformer.mm src/media_engine/FrameTransformer.h
          git diff --exit-code "$START" HEAD -- product/VCAMPro.plist

          ! grep -R -F 'DirectRenderedPhoto' src/product src/media_engine/InternalGalleryMediaSession.*
          ! grep -R -F 'renderDirectPhotoIntoOriginalLocked' src/product
          ! grep -R -F 'bindDirectPhotoSource' src/product
          ! grep -R -F 'prepareDirectPhotoGeometry' src/product
          ! grep -R -F 'directPhotoSourceY_' src/product
          ! grep -R -F 'directPhotoPlans_' src/product
          ! grep -R -F 'photoSourcePixelBuffer' src/product src/media_engine/InternalGalleryMediaSession.*

          echo 'CALLBACK_DIRECT_RENDER_REMOVED=PASS'
          echo 'DIRECT_RENDER_SOURCE_BYTES=0'
          echo 'DIRECT_RENDER_MAPPING_BYTES=0'

      - name: Adaptive working-set and over-budget ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/geomws3
          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread \
            -Wno-deprecated-declarations -Wno-unused-function \
            -DVCAM_TESTING=1 \
            -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/FrameEngineState.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/frame_engine/FrameTimelineScheduler.cpp \
            src/frame_engine/MonotonicHostClock.cpp \
            src/media_engine/LocalVideoReader.mm \
            src/media_engine/LocalPhotoReader.mm \
            src/media_engine/FrameNormalizer.cpp \
            src/media_engine/FrameTransformer.mm \
            src/media_engine/FramePipelinePump.cpp \
            src/media_engine/FramePipelinePumpTimed.cpp \
            src/media_engine/ProducerWakeupController.cpp \
            src/media_engine/ProducerWakeupDriver.mm \
            src/media_engine/InternalGalleryMediaSession.mm \
            src/product/ControlStateCache.cpp \
            src/product/VirtualBlackFrame.mm \
            src/product/CameraConsumerAdapter.cpp \
            src/product/SharedControlStore.mm \
            src/product/SharedMediaStager.mm \
            src/product/ProductControlOwner.mm \
            src/product/MediaserverdRuntime.mm \
            tests/product/photo_geometry_working_set_tests.mm \
            -framework Accelerate -framework Foundation -framework AVFoundation \
            -framework CoreFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework ImageIO \
            -o build/geomws3/working-set

          build/geomws3/working-set | tee build/geomws3/working-set.txt

          for marker in \
            A_B_C_D_WITHIN_CACHE=PASS \
            FIFTH_GEOMETRY_BEHAVIOR=PASS \
            FIVE_GEOMETRY_CONTINUOUS_CYCLE=PASS \
            NO_REPEATED_BLACK_AFTER_GEOMETRY_WARMUP=PASS \
            PHOTO_ACTIVE_WORKING_SET_RETAINED=PASS \
            PHOTO_VARIANT_MEMORY_BOUNDED=PASS \
            PHOTO_VARIANT_STRUCTURAL_BOUND=PASS \
            PHOTO_SOURCE_DECODE_COUNT=1 \
            PHOTO_LOGICAL_SESSION_CREATION_COUNT=1 \
            NO_GEOMETRY_EVENT_ALIASING=PASS \
            OVER_BUDGET_SAFE_VIRTUAL_OWNERSHIP=PASS \
            OVER_BUDGET_ORIGINAL_DECISIONS=ZERO \
            OVER_BUDGET_CALLBACK_SCALING=ZERO \
            OVER_BUDGET_CALLBACK_TRANSFORM=ZERO \
            OVER_BUDGET_MAY_USE_BLACK_WHILE_PREPARING=PASS \
            OVER_BUDGET_PRODUCER_REPREPARATION_OUTSIDE_CALLBACK=PASS \
            VCAM_ON_SUPPORTED_ORIGINAL_DECISIONS=ZERO \
            DIRECT_RENDER_SOURCE_BYTES=0 \
            DIRECT_RENDER_MAPPING_BYTES=0; do
            grep -Fq "$marker" build/geomws3/working-set.txt
          done

          grep -Eq 'PHOTO_VARIANT_PEAK_RETAINED_BYTES=[1-9][0-9]*' build/geomws3/working-set.txt
          grep -Fq 'PHOTO_VARIANT_MEMORY_BUDGET=33554432' build/geomws3/working-set.txt

      - name: CameraConsumerAdapter regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Isrc/frame_engine -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/product/ControlStateCache.cpp \
            src/product/CameraConsumerAdapter.cpp \
            tests/product/camera_consumer_adapter_tests.cpp \
            -framework CoreFoundation -framework CoreMedia -framework CoreVideo \
            -o build/geomws3/camera-consumer
          build/geomws3/camera-consumer | tee build/geomws3/camera-consumer.txt
          grep -Fq 'failures: 0' build/geomws3/camera-consumer.txt

      - name: Reachable camera callback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def between(text, start, end):
              a = text.index(start)
              b = text.index(end, a + len(start))
              return text[a:b]

          hook = Path('src/product/ReferenceCameraHook.mm').read_text()
          runtime = Path('src/product/MediaserverdRuntime.mm').read_text()
          adapter = Path('src/product/CameraConsumerAdapter.cpp').read_text()
          header = Path('src/product/CameraConsumerAdapter.h').read_text()

          hook_callback = between(hook, 'CVImageBufferRef HookedCMSampleBufferGetImageBuffer', 'bool InstallReferenceCameraHook')
          runtime_impl = between(runtime, '    CameraDecision decide(', '    void prepareBlackFallbackForGeometry(')
          runtime_wrapper = between(runtime, 'CameraDecision MediaserverdRuntime::', 'CameraConsumerAdapter&')
          adapter_decide = between(adapter, 'CameraDecision CameraConsumerAdapter::decide(', 'CameraDecision\nCameraConsumerAdapter::\nblackOrEmergencyOriginal')
          adapter_black = between(adapter, 'CameraDecision\nCameraConsumerAdapter::\nblackOrEmergencyOriginal', 'std::size_t\nCameraConsumerAdapter::pinnedLeaseCount')

          assert 'runtime.decideCameraBuffer' in hook_callback
          assert 'impl_->decide' in runtime_wrapper
          assert 'adapter_.decide' in runtime_impl
          assert 'blackOrEmergencyOriginal' in adapter_decide

          reachable = '\n'.join([hook_callback, runtime_wrapper, runtime_impl, adapter_decide, adapter_black])
          forbidden = [
              'AVAssetReader', 'CGImageSource', 'FrameTransformer', 'vImage', 'CIContext',
              'CVPixelBufferCreate(', 'dispatch_sync', 'sleep(', 'wait(', 'loadFile',
              'contentsOfFile', 'readData', 'DirectRenderedPhoto',
              'renderDirectPhotoIntoOriginalLocked', 'bindDirectPhotoSource',
              'prepareDirectPhotoGeometry', 'ySourceColumns', 'cbCrSourceByteColumns',
              'yValueMap', 'cbCrValueMap',
          ]
          bad = [x for x in forbidden if x in reachable]
          if bad:
              raise SystemExit(f'camera-critical reachable path contains {bad}')

          removed = [
              'DirectRenderedPhoto', 'DirectPhotoPlan', 'renderDirectPhotoIntoOriginalLocked',
              'bindDirectPhotoSource', 'prepareDirectPhotoGeometry', 'directPhotoSourceY_',
              'directPhotoSourceCbCr_', 'directPhotoPlans_', 'ySourceColumns', 'ySourceRows',
              'cbCrSourceByteColumns', 'cbCrSourceRows', 'yValueMap', 'cbCrValueMap', 'std::llround',
          ]
          bad = [x for x in removed if x in adapter or x in header]
          if bad:
              raise SystemExit(f'removed direct-render machinery remains: {bad}')

          markers = [
              'CAMERA_CALLBACK_REACHABLE_PATH_AUDITED=PASS',
              'NO_CALLBACK_FILE_IO=PASS',
              'NO_CALLBACK_DECODE=PASS',
              'NO_CALLBACK_SCALE=PASS',
              'NO_CALLBACK_TRANSFORM=PASS',
              'NO_CALLBACK_COLOR_CONVERSION=PASS',
              'NO_CALLBACK_MEDIA_ALLOCATION=PASS',
              'NO_CALLBACK_SYNCHRONOUS_WAIT=PASS',
              'NO_CALLBACK_DIRECT_PHOTO_RENDER=PASS',
              'NO_BLOCKING_CAMERA_CALLBACK_WORK=PASS',
          ]
          path = Path('build/geomws3/callback-contract.txt')
          path.write_text('\n'.join(markers) + '\n')
          print(path.read_text(), end='')
          PY

      - name: Upload remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: photo-geometry-camera-critical-path-003-evidence
          path: build/geomws3/**
          if-no-files-found: error
          retention-days: 14

  package:
    name: RootHide corrected product candidate
    needs: exact-head-remediation
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout RootHidePatcher exact pin
        uses: actions/checkout@v4
        with:
          repository: roothide/RootHidePatcher
          ref: 80c16e08da33fecd27c0ff35777f37afd171868b
          path: reference/RootHidePatcher
          persist-credentials: false
          fetch-depth: 1

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus
          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          echo "$GNU_PATH" >> "$GITHUB_PATH"

      - name: Build and audit RootHide candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "d476caacc4f557843f9551533c2fcbe7c5d40baa"
          ROOTHIDE_PATCHER_DIR="$PWD/reference/RootHidePatcher" sh product/photo_geometry_working_set_002/ci_build_package_and_audit.sh
          REPORT=build/photo-geometry-working-set-002/evidence/validation-report.txt
          for marker in PHOTO_GEOMETRY_WORKING_SET_PACKAGE=PASS ARM64=PASS MINIMUM_IOS_15=PASS ROOTHIDE_PACKAGE=PASS ROOT_HIDE_PATCHER_PINNED=PASS VALID_CODE_SIGNATURE=PASS MAIN_UNCHANGED=PASS READ_ONLY_REPOS_UNCHANGED=PASS DEVICE_ACTION=NO; do
            grep -Fq "$marker" "$REPORT"
          done

      - name: Upload corrected product candidate
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-photo-geometry-working-set-002
          path: |
            build/photo-geometry-working-set-002/final/VCAM-PRO-RootHide-Photo-Geometry-Working-Set-002.deb
            build/photo-geometry-working-set-002/final/VCAM-PRO-RootHide-Photo-Geometry-Working-Set-002.deb.sha256
            build/photo-geometry-working-set-002/evidence/**
          if-no-files-found: error
          retention-days: 14
