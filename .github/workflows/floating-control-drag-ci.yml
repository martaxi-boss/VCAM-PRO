name: VCAM PRO Floating Control Drag CI

on:
  push:
    branches:
      - builder/floating-control-drag-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Floating control drag and RootHide package
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base and narrow drag scope
        shell: bash
        run: |
          set -euo pipefail

          BASE=bd3d6d99275d6a94aa0eaa949534ca2b7268717a

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/builder/roothide-product-packaging-integration-001 | awk '{print $1}')" = "$BASE"

          changed="$(git diff --name-only "$BASE"..HEAD)"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              src/product/SpringBoardControlHost.mm|\
              src/product/SpringBoardFloatingButtonGeometry.h|\
              tests/product/floating_control_drag_geometry_tests.cpp|\
              product/roothide_integration/DEBIAN/control|\
              product/build_roothide_integration_input.sh|\
              .github/workflows/floating-control-drag-ci.yml)
                ;;
              *)
                echo "Unauthorized changed file: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

          git diff --quiet "$BASE"..HEAD -- \
            src/product/ReferenceCameraHook.mm \
            src/product/ReferenceCameraHook.h \
            src/product/MediaserverdRuntime.mm \
            src/product/MediaserverdRuntime.h \
            src/product/CameraConsumerAdapter.cpp \
            src/product/CameraConsumerAdapter.h \
            src/product/ProductControlOwner.mm \
            src/product/ProductControlOwner.h \
            src/product/SharedControlStore.mm \
            src/product/SharedControlStore.h \
            src/product/SharedMediaStager.mm \
            src/product/SharedMediaStager.h \
            src/product/JailbreakRootResolver.h \
            src/frame_engine \
            src/media_engine \
            src/control/InternalGalleryViewController.mm \
            product/VCAMPro.RootHideIntegration.plist \
            product/roothide_integration/DEBIAN/postinst

          test "$(git ls-remote https://github.com/martaxi-boss/MotionCam-iOS.git refs/heads/main | awk '{print $1}')" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-15-USB.git refs/heads/main | awk '{print $1}')" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-16-USB-4k.git refs/heads/main | awk '{print $1}')" = "cc20d787070c67565173d4a46c218e2549cecc93"

          echo "EXACT_BASE=PASS"
          echo "PR19_EXPECTED_UNTOUCHED=PASS"
          echo "CAMERA_ARCHITECTURE_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"
          echo "REFERENCE_REPOS_UNCHANGED=PASS"

      - name: Run jailbreak root resolver tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/root-resolver
          xcrun --sdk macosx clang++ \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic \
            -Isrc/product \
            tests/product/jailbreak_root_resolver_tests.cpp \
            -o build/root-resolver/tests

          build/root-resolver/tests | tee build/root-resolver/results.txt
          grep -q 'Jailbreak root resolver tests run: 4, failures: 0' build/root-resolver/results.txt
          grep -q 'SHARED_CONTROL_ROOT_RESOLUTION=PASS' build/root-resolver/results.txt
          grep -q 'SHARED_MEDIA_ROOT_RESOLUTION=PASS' build/root-resolver/results.txt
          grep -q 'ROOT_RESOLUTION_FAILURE_FAIL_OPEN=PASS' build/root-resolver/results.txt
          grep -q 'CONVENTIONAL_ROOTLESS_PATH_COMPAT=PASS' build/root-resolver/results.txt

          grep -q 'controlPath ==' src/product/SharedControlStore.mm
          grep -q 'kDefaultControlPath' src/product/SharedControlStore.mm
          grep -q 'ResolvePathInJailbreakRoot' src/product/SharedControlStore.mm
          grep -q 'mediaDirectory ==' src/product/SharedMediaStager.mm
          grep -q 'kDefaultMediaDirectory' src/product/SharedMediaStager.mm
          grep -q 'ResolvePathInJailbreakRoot' src/product/SharedMediaStager.mm

          echo "SHARED_CONTROL_ROOT_RESOLUTION=PASS"
          echo "SHARED_MEDIA_ROOT_RESOLUTION=PASS"

      - name: Run deterministic floating control geometry tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/floating-control-drag

          xcrun --sdk macosx clang++ \
            -std=c++17 \
            -Wall -Wextra -Werror -pedantic \
            -Isrc/product \
            tests/product/floating_control_drag_geometry_tests.cpp \
            -o build/floating-control-drag/geometry-tests

          build/floating-control-drag/geometry-tests |
            tee build/floating-control-drag/geometry-results.txt

          grep -q 'Floating button geometry tests run: 6, failures: 0' build/floating-control-drag/geometry-results.txt
          grep -q 'SAFE_SCREEN_BOUNDS=PASS' build/floating-control-drag/geometry-results.txt
          grep -q 'EDGE_SNAP=PASS' build/floating-control-drag/geometry-results.txt

          echo "SAFE_SCREEN_BOUNDS=PASS"
          echo "EDGE_SNAP=PASS"

      - name: Verify floating gesture and preserved tap-owner contracts
        shell: bash
        run: |
          set -euo pipefail

          BASE=bd3d6d99275d6a94aa0eaa949534ca2b7268717a
          HOST=src/product/SpringBoardControlHost.mm

          grep -Fq 'UIPanGestureRecognizer* pan' "$HOST"
          grep -Fq '@selector(' "$HOST"
          grep -Fq 'handleFloatingButtonPan:' "$HOST"
          grep -Fq 'pan.cancelsTouchesInView = YES' "$HOST"
          grep -Fq 'pan.maximumNumberOfTouches = 1' "$HOST"
          grep -Fq 'UIControlEventTouchUpInside' "$HOST"
          grep -Fq '@selector(openControl)' "$HOST"
          grep -Fq '_floatingButtonCenterXConstraint' "$HOST"
          grep -Fq '_floatingButtonCenterYConstraint' "$HOST"
          grep -Fq 'ClampFloatingButtonCenter' "$HOST"
          grep -Fq 'SnapFloatingButtonCenterToNearestEdge' "$HOST"
          grep -Fq 'animateWithDuration:0.2' "$HOST"

          python3 - <<'PY'
          import pathlib
          import subprocess

          base = "bd3d6d99275d6a94aa0eaa949534ca2b7268717a"
          path = "src/product/SpringBoardControlHost.mm"
          before = subprocess.check_output(
              ["git", "show", f"{base}:{path}"],
              text=True,
          )
          after = pathlib.Path(path).read_text()

          def between(text, start, end):
              first = text.index(start)
              last = text.index(end, first)
              return text[first:last]

          owner_start = "- (void)viewDidAppear:(BOOL)animated {"
          owner_end = "- (void)openControl {"
          if between(before, owner_start, owner_end) != between(after, owner_start, owner_end):
              raise SystemExit("Product owner async initialization changed")

          control_start = "- (void)openControl {"
          control_end = "\n@end"
          if between(before, control_start, control_end) != between(after, control_start, control_end):
              raise SystemExit("Existing openControl flow changed")
          PY

          echo "FLOATING_BUTTON_PAN_GESTURE=PASS"
          echo "TAP_ACTION_PRESERVED=PASS"
          echo "DRAG_TAP_DISAMBIGUATION=PASS"
          echo "PRODUCT_OWNER_ASYNC_INIT_UNCHANGED=PASS"

      - name: Run shared media root containment suite
        run: |
          set -euo pipefail

          mkdir -p build/media-root-containment

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedMediaStager.mm             tests/product/shared_media_root_containment_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/media-root-containment/tests

          build/media-root-containment/tests             | tee build/media-root-containment/results.txt

          grep -q 'Media root containment tests run: 4, failures: 0'             build/media-root-containment/results.txt
          grep -q 'PASS symlink root blocks staging'             build/media-root-containment/results.txt
          grep -q 'PASS symlink root blocks recovery and deletion'             build/media-root-containment/results.txt
          grep -q 'PASS valid media root operations'             build/media-root-containment/results.txt
          grep -q 'PASS ancestor symlink remains compatible'             build/media-root-containment/results.txt

          echo "MEDIA_ROOT_SYMLINK_REJECTED=PASS"
          echo "STAGING_THROUGH_MEDIA_ROOT_SYMLINK=BLOCKED"
          echo "RECONCILIATION_THROUGH_MEDIA_ROOT_SYMLINK=BLOCKED"
          echo "SYMLINK_ROOT_DELETE_AUTHORITY=DENIED"
          echo "EXTERNAL_SYMLINK_TARGET_PRESERVED=PASS"
          echo "ROOTLESS_STYLE_ANCESTOR_SYMLINK_COMPAT=PASS"
          echo "VALID_MEDIA_ROOT_OPERATIONS=PASS"

      - name: Run shared media root TOCTOU suite
        run: |
          set -euo pipefail

          mkdir -p build/media-root-toctou

          xcrun --sdk macosx clang++             -std=c++17             -DVCAM_TESTING=1             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedMediaStager.mm             tests/product/shared_media_root_toctou_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/media-root-toctou/tests

          build/media-root-toctou/tests             | tee build/media-root-toctou/results.txt

          grep -q 'Media root TOCTOU tests run: 4, failures: 0'             build/media-root-toctou/results.txt
          grep -q 'PASS staging swap before create blocked'             build/media-root-toctou/results.txt
          grep -q 'PASS staging publication identity verified'             build/media-root-toctou/results.txt
          grep -q 'PASS delete swap cannot redirect'             build/media-root-toctou/results.txt
          grep -q 'PASS reconciliation swap cannot redirect'             build/media-root-toctou/results.txt

          echo "MEDIA_ROOT_TOCTOU_REDIRECTION=BLOCKED"
          echo "STAGING_ROOT_SWAP_REDIRECTION=BLOCKED"
          echo "FAILED_STAGING_PINNED_CLEANUP=PASS"
          echo "DELETE_ROOT_SWAP_REDIRECTION=BLOCKED"
          echo "RECONCILIATION_ROOT_SWAP_REDIRECTION=BLOCKED"
          echo "RECONCILIATION_DIRECTORY_IDENTITY_PINNED=PASS"
          echo "MEDIA_ROOT_OBJECT_IDENTITY_VERIFIED=PASS"
          echo "PINNED_ROOT_FAILURE_CLEANUP=PASS"

      - name: Run Shared Control Store fail-open suite
        run: |
          set -euo pipefail

          mkdir -p build/shared-control-store-hardening

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Isrc/product             src/product/SharedControlStore.mm             tests/product/shared_control_store_fail_open_tests.mm             -framework Foundation             -o build/shared-control-store-hardening/tests

          build/shared-control-store-hardening/tests             | tee build/shared-control-store-hardening/results.txt

          grep -q 'Shared control store hardening tests run: 16, failures: 0'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS absent plist safe default'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS malformed bytes safe default'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong root safe default'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong enabled type safe'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong media kind type safe'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong media path type safe'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong generation type safe'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong loop type safe'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS wrong playback type safe'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS unknown media kind normalized'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS unknown playback normalized'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS incomplete media identity normalized'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS photo forces loop false'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS no media forces playback stopped'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS valid snapshot round trip'             build/shared-control-store-hardening/results.txt
          grep -q 'PASS observer corruption fail open'             build/shared-control-store-hardening/results.txt

          echo "MALFORMED_CONTROL_PLIST_FAIL_OPEN=PASS"
          echo "CONTROL_PLIST_TYPE_CONFUSION_SAFE=PASS"
          echo "CONTROL_SNAPSHOT_NORMALIZATION=PASS"
          echo "CORRUPT_CONTROL_OBSERVER_FAIL_OPEN=PASS"
          echo "ABSENT_CONTROL_STORE_DEFAULT_SAFE=PASS"
          echo "VALID_CONTROL_SNAPSHOT_ROUNDTRIP=PASS"

      - name: Run control-store provenance recovery suite
        run: |
          set -euo pipefail

          mkdir -p build/control-store-provenance

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/shared_control_store_recovery_provenance_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/control-store-provenance/tests

          build/control-store-provenance/tests             | tee build/control-store-provenance/results.txt

          grep -q 'Control provenance recovery tests run: 4, failures: 0'             build/control-store-provenance/results.txt
          grep -q 'PASS corrupt control preserves generated media'             build/control-store-provenance/results.txt
          grep -q 'PASS type confused control preserves generated media'             build/control-store-provenance/results.txt
          grep -q 'PASS absent control allows recovery'             build/control-store-provenance/results.txt
          grep -q 'PASS valid control allows recovery'             build/control-store-provenance/results.txt

          echo "CORRUPT_CONTROL_DESTRUCTIVE_RECOVERY_BLOCKED=PASS"
          echo "CORRUPT_CONTROL_MEDIA_PRESERVED=PASS"
          echo "TYPE_CONFUSED_CONTROL_MEDIA_PRESERVED=PASS"
          echo "ABSENT_CONTROL_RECOVERY_ALLOWED=PASS"
          echo "VALID_CONTROL_RECOVERY_ALLOWED=PASS"

      - name: Prove SpringBoard storage recovery decoupling
        run: |
          set -euo pipefail

          python3 tests/product/springboard_storage_recovery_decoupling_tests.py

      - name: Run storage ownership and startup recovery tests
        run: |
          set -euo pipefail

          mkdir -p build/storage-recovery

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/local_media_storage_recovery_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/storage-recovery/tests

          build/storage-recovery/tests             | tee build/storage-recovery/results.txt

          grep -q 'Storage recovery tests run: 15, failures: 0'             build/storage-recovery/results.txt

          echo "OWNED_PATH_CONTAINMENT=PASS"
          echo "FOREIGN_MEDIA_FILE_PRESERVED=PASS"
          echo "PRE_COMMIT_ORPHAN_RECOVERY=PASS"
          echo "POST_COMMIT_ORPHAN_RECOVERY=PASS"
          echo "MISSING_OR_INVALID_ACTIVE_MEDIA_FAIL_OPEN=PASS"
          echo "STARTUP_MEDIA_RECOVERY_IDEMPOTENT=PASS"

      - name: Run existing 10 selection race tests
        run: |
          set -euo pipefail

          mkdir -p build/selection-race

          xcrun --sdk macosx clang++             -std=c++17             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Isrc/control             tests/control/selection_completion_race_tests.cpp             -o build/selection-race/selection-race-tests

          build/selection-race/selection-race-tests             | tee build/selection-race/results.txt

          grep -q 'Selection race tests run: 10, failures: 0'             build/selection-race/results.txt

          echo "PRE_STAGING_STALE_REJECTION=PASS"

      - name: Run existing 4 post-claim race tests
        run: |
          set -euo pipefail

          mkdir -p build/post-claim

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/selection_post_claim_commit_race_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/post-claim/tests

          build/post-claim/tests             | tee build/post-claim/results.txt

          grep -q 'Post-claim commit race tests run: 4, failures: 0'             build/post-claim/results.txt

          echo "POST_CLAIM_PRE_COMMIT_STALE_REJECTION=PASS"
          echo "LATEST_SELECTION_REQUEST_WINS=PASS"
          echo "REJECTED_STAGED_MEDIA_CLEANUP=PASS"

      - name: Run existing Product Control lost-update 5-case suite
        run: |
          set -euo pipefail

          mkdir -p build/product-control-lost-update

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/product_control_lost_update_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/product-control-lost-update/tests

          build/product-control-lost-update/tests             | tee build/product-control-lost-update/results.txt

          grep -q 'Product control lost-update tests run: 5, failures: 0'             build/product-control-lost-update/results.txt

          echo "PRODUCT_CONTROL_LOST_UPDATE_BLOCKED=PASS"
          echo "CLEAR_INVALIDATES_INFLIGHT_SELECTION=PASS"
          echo "LATEST_ENABLED_STATE_PRESERVED=PASS"
          echo "LATEST_PLAYBACK_INTENT_PRESERVED=PASS"
          echo "LATEST_LOOP_STATE_PRESERVED=PASS"

      - name: Run existing Product Control status 2-case suite
        run: |
          set -euo pipefail

          mkdir -p build/product-control-status

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/product_control_status_thread_safety_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/product-control-status/tests

          build/product-control-status/tests             | tee build/product-control-status/results.txt

          grep -q 'Product control status tests run: 2, failures: 0'             build/product-control-status/results.txt

          echo "PRODUCT_CONTROL_STATUS_THREAD_SAFE=PASS"

      - name: Frame Engine A through F2 regressions
        run: |
          set -euo pipefail

          tools/run_frame_regressions.sh

          echo "FRAME_ENGINE_A_F2=PASS"

      - name: Internal Gallery 20-case regression
        run: |
          set -euo pipefail

          mkdir -p build/store-hardening-regressions

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/internal_gallery_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/store-hardening-regressions/internal-gallery

          build/store-hardening-regressions/internal-gallery             | tee build/store-hardening-regressions/internal-gallery.txt

          grep -q 'Internal gallery tests run: 20, failures: 0'             build/store-hardening-regressions/internal-gallery.txt

          echo "INTERNAL_GALLERY=PASS"

      - name: Existing safe Product Integration regression
        run: |
          set -euo pipefail

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/full_product_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/store-hardening-regressions/product-integration

          build/store-hardening-regressions/product-integration             | tee build/store-hardening-regressions/product-integration.txt

          grep -q 'Product integration tests run: 8, failures: 0'             build/store-hardening-regressions/product-integration.txt

          echo "PRODUCT_INTEGRATION=PASS"


      - name: Compile changed SpringBoard control for iOS 15 arm64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/floating-control-ios
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"

          "$CXX" \
            -std=c++17 \
            -fobjc-arc \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=15.0 \
            -Wall -Wextra -Werror \
            -Werror=unguarded-availability-new \
            -pedantic \
            -Wno-deprecated-declarations \
            -Isrc/frame_engine \
            -Isrc/media_engine \
            -Isrc/control \
            -Isrc/product \
            -c src/product/SpringBoardControlHost.mm \
            -o build/floating-control-ios/SpringBoardControlHost.o

          xcrun lipo -info build/floating-control-ios/SpringBoardControlHost.o |
            tee build/floating-control-ios/arch.txt
          grep -q 'arm64' build/floating-control-ios/arch.txt

          echo "IOS15_ARM64_SPRINGBOARD_CONTROL=PASS"

      - name: Install RootHide packaging tools
        shell: bash
        run: |
          set -euo pipefail

          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus

          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          export PATH="$GNU_PATH:$PATH"
          echo "$GNU_PATH" >> "$GITHUB_PATH"

          command -v ldid
          dpkg-deb --version

      - name: Build full rootless input package
        shell: bash
        run: |
          set -euo pipefail

          sh product/build_roothide_integration_input.sh

          INPUT_DEB="build/roothide-product-integration/input/com.vcampro.camera_0.1.0+roothide2_iphoneos-arm64.deb"
          test -f "$INPUT_DEB"
          test "$(dpkg-deb -f "$INPUT_DEB" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$INPUT_DEB" Version)" = "0.1.0+roothide2"

          mkdir -p build/roothide-product-integration/evidence
          dpkg-deb -f "$INPUT_DEB" > build/roothide-product-integration/evidence/input-control.txt
          dpkg-deb -c "$INPUT_DEB" > build/roothide-product-integration/evidence/input-inventory.txt

          grep -q './var/jb/usr/lib/TweakInject/VCAMPro.dylib' build/roothide-product-integration/evidence/input-inventory.txt
          grep -q './var/jb/usr/lib/TweakInject/VCAMPro.plist' build/roothide-product-integration/evidence/input-inventory.txt

      - name: Fetch pinned official RootHidePatcher
        shell: bash
        run: |
          set -euo pipefail

          PATCHER_SHA=80c16e08da33fecd27c0ff35777f37afd171868b
          git clone --quiet https://github.com/roothide/RootHidePatcher.git build/roothide-product-integration/RootHidePatcher
          git -C build/roothide-product-integration/RootHidePatcher checkout --quiet "$PATCHER_SHA"
          test "$(git -C build/roothide-product-integration/RootHidePatcher rev-parse HEAD)" = "$PATCHER_SHA"
          echo "ROOTHIDE_PATCHER_SHA=$PATCHER_SHA" |
            tee build/roothide-product-integration/evidence/roothide-patcher.txt

      - name: Convert to final RootHide integration package
        shell: bash
        run: |
          set -euo pipefail

          INPUT_DEB="$PWD/build/roothide-product-integration/input/com.vcampro.camera_0.1.0+roothide2_iphoneos-arm64.deb"
          FINAL_DIR="$PWD/build/roothide-product-integration/final"
          FINAL_DEB="$FINAL_DIR/VCAM-PRO-Floating-Control-Drag-001.deb"
          PATCHER="$PWD/build/roothide-product-integration/RootHidePatcher/patch.sh"

          mkdir -p "$FINAL_DIR"
          sudo env "PATH=$PATH" bash "$PATCHER" "$INPUT_DEB" "$FINAL_DEB"
          test -f "$FINAL_DEB"
          shasum -a 256 "$FINAL_DEB" | tee "$FINAL_DEB.sha256"

      - name: Inspect final RootHide package
        shell: bash
        run: |
          set -euo pipefail

          FINAL_DEB="build/roothide-product-integration/final/VCAM-PRO-Floating-Control-Drag-001.deb"
          EVIDENCE="build/roothide-product-integration/evidence"
          EXTRACTED="build/roothide-product-integration/extracted-final"
          DYLIB="$EXTRACTED/usr/lib/TweakInject/VCAMPro.dylib"
          PLIST="$EXTRACTED/usr/lib/TweakInject/VCAMPro.plist"

          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED" "$EVIDENCE"
          dpkg-deb -R "$FINAL_DEB" "$EXTRACTED"
          dpkg-deb -f "$FINAL_DEB" | tee "$EVIDENCE/final-control.txt"
          dpkg-deb -c "$FINAL_DEB" | tee "$EVIDENCE/final-inventory.txt"

          test "$(dpkg-deb -f "$FINAL_DEB" Package)" = "com.vcampro.camera"
          test "$(dpkg-deb -f "$FINAL_DEB" Version)" = "0.1.0+roothide2"
          test "$(dpkg-deb -f "$FINAL_DEB" Architecture)" = "iphoneos-arm64e"
          test "$(dpkg-deb -f "$FINAL_DEB" Depends)" = "mobilesubstrate, firmware (>= 15.0)"

          test -f "$DYLIB"
          test -f "$PLIST"
          test ! -e "$EXTRACTED/var/jb"
          test ! -e "$EXTRACTED/Library/MobileSubstrate/DynamicLibraries/VCAMPro.dylib"
          test ! -e "$EXTRACTED/Library/MobileSubstrate/DynamicLibraries/VCAMPro.plist"

          /usr/bin/stat -f '%Sp %Su/%Sg %N' "$DYLIB" "$PLIST" |
            tee "$EVIDENCE/final-payload-modes.txt"

          grep -F -- '-rwxr-xr-x root/wheel' "$EVIDENCE/final-inventory.txt" |
            grep -Fq './usr/lib/TweakInject/VCAMPro.dylib'
          grep -F -- '-rw-r--r-- root/wheel' "$EVIDENCE/final-inventory.txt" |
            grep -Fq './usr/lib/TweakInject/VCAMPro.plist'

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/dylib-arch.txt"
          grep -q 'arm64' "$EVIDENCE/dylib-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/dylib-arch.txt"; then
            echo "A9 artifact must contain arm64 code only."
            exit 1
          fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/dylib-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/dylib-install-name.txt"
          xcrun otool -L "$DYLIB" > "$EVIDENCE/dylib-linked-libraries.txt"

          grep -q 'minos 15.0' "$EVIDENCE/dylib-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/dylib-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/dylib-load-commands.txt"
          if grep -q 'path /var/jb' "$EVIDENCE/dylib-load-commands.txt"; then
            echo "Fixed /var/jb RPATH remains."
            exit 1
          fi
          grep -q '@loader_path/VCAMPro.dylib' "$EVIDENCE/dylib-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/dylib-entitlements.txt"

          plutil -lint "$PLIST"
          plutil -p "$PLIST" | tee "$EVIDENCE/final-filter.txt"
          grep -q 'com.apple.springboard' "$EVIDENCE/final-filter.txt"
          grep -q '"SpringBoard"' "$EVIDENCE/final-filter.txt"
          if grep -qi 'mediaserverd' "$EVIDENCE/final-filter.txt"; then
            echo "Controlled RootHide integration artifact activates mediaserverd."
            exit 1
          fi

          SCRIPT="$EXTRACTED/DEBIAN/postinst"
          test -f "$SCRIPT"
          cat "$SCRIPT" | tee "$EVIDENCE/postinst.txt"
          if grep -E '/var/jb|sudo|NewTerm|password|RootHidePatcher|killall|ldrestart|respring|mediaserverd' "$SCRIPT"; then
            echo "Maintainer script is not RootHide-safe."
            exit 1
          fi

          if find "$EXTRACTED" -type f | grep -E 'com\.vcampro\.control\.plist|/VCAMPro/Media/'; then
            echo "Controlled integration package must start with no selected media/control state."
            exit 1
          fi

          echo "ROOTHIDE_PACKAGE_ARCH=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ELLEKIT_TWEAKINJECT_DISCOVERY_PATH=PASS"
          echo "ROOTHIDE_RPATHS=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"
          echo "MAINTAINER_SCRIPTS_ROOTSAFE=PASS"
          echo "SPRINGBOARD_ONLY_INTEGRATION_FILTER=PASS"
          echo "NO_MEDIASERVERD_ACTIVATION=PASS"
          echo "INITIAL_STATE_VCAM_OFF_NO_MEDIA=PASS"

      - name: Final acceptance and frozen architecture proof
        shell: bash
        run: |
          set -euo pipefail

          BASE=bd3d6d99275d6a94aa0eaa949534ca2b7268717a
          FINAL_DEB="build/roothide-product-integration/final/VCAM-PRO-Floating-Control-Drag-001.deb"
          EVIDENCE="build/roothide-product-integration/evidence"

          git diff --quiet "$BASE"..HEAD -- \
            src/product/ReferenceCameraHook.mm \
            src/product/ReferenceCameraHook.h \
            src/product/MediaserverdRuntime.mm \
            src/product/MediaserverdRuntime.h \
            src/product/CameraConsumerAdapter.cpp \
            src/product/CameraConsumerAdapter.h \
            src/frame_engine \
            src/media_engine \
            src/control/InternalGalleryViewController.mm \
            src/product/ProductControlOwner.mm \
            src/product/ProductControlOwner.h \
            src/product/SharedControlStore.mm \
            src/product/SharedMediaStager.mm \
            src/product/JailbreakRootResolver.h

          cat "$FINAL_DEB.sha256" | tee "$EVIDENCE/final-sha256.txt"
          git rev-parse HEAD | tee "$EVIDENCE/exact-head.txt"

          echo "FLOATING_BUTTON_PAN_GESTURE=PASS"
          echo "TAP_ACTION_PRESERVED=PASS"
          echo "DRAG_TAP_DISAMBIGUATION=PASS"
          echo "SAFE_SCREEN_BOUNDS=PASS"
          echo "EDGE_SNAP=PASS"
          echo "PRODUCT_OWNER_ASYNC_INIT_UNCHANGED=PASS"
          echo "ROOT_HIDE_PACKAGING_UNCHANGED=PASS"
          echo "NO_MEDIASERVERD_ACTIVATION=PASS"
          echo "CAMERA_ARCHITECTURE_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"
          echo "PR19_MODIFIED=NO"
          echo "REFERENCE_REPOS_MODIFIED=NO"
          echo "MERGE_PERFORMED=NO"
          echo "RELEASE_PERFORMED=NO"
          echo "DEPLOY_PERFORMED=NO"
          echo "DEVICE_ACTION=NO"

      - name: Upload floating control drag artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-floating-control-drag-001
          path: |
            build/roothide-product-integration/final/VCAM-PRO-Floating-Control-Drag-001.deb
            build/roothide-product-integration/final/VCAM-PRO-Floating-Control-Drag-001.deb.sha256
            build/roothide-product-integration/evidence/
            build/floating-control-drag/geometry-results.txt
            build/root-resolver/results.txt
            build/media-root-containment/results.txt
            build/media-root-toctou/results.txt
          if-no-files-found: error
          retention-days: 14
