name: VCAM PRO Activation Parity Device Remediation 001

on:
  push:
    branches:
      - builder/canonical-hook-continuation-001
    paths:
      - "product/activation_parity_device_remediation_001/**"
      - "product/VCAMPro.plist"
      - "docs/research/IOS15_USB_STILL_CAPTURE_PARITY_001.md"
      - "docs/CANONICAL_PROJECT_STATE.md"
      - "src/product/MediaserverdRuntime.mm"
      - "src/product/CameraConsumerAdapter.h"
      - "src/product/CameraConsumerAdapter.cpp"
      - "src/product/ReferenceCameraHook.mm"
      - "src/product/VirtualBlackFrame.h"
      - "src/product/VirtualBlackFrame.mm"
      - "src/media_engine/**"
      - "src/frame_engine/**"
      - "tests/**"
      - "tools/run_frame_regressions.sh"
      - ".github/workflows/activation-parity-device-remediation-001-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcampro-activation-parity-device-remediation-001
  cancel-in-progress: true

jobs:
  reference-forensics:
    name: iOS15 USB still-capture forensics
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout exact VCAM PRO head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout IOS-15-USB exact read-only reference
        uses: actions/checkout@v4
        with:
          repository: martaxi-boss/IOS-15-USB
          ref: a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d
          path: reference/IOS-15-USB
          persist-credentials: false
          fetch-depth: 1

      - name: Disassemble and assert still-capture reference evidence
        shell: bash
        run: |
          set -euo pipefail
          sh product/activation_parity_device_remediation_001/reference_forensics.sh
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re

          with Path("product/VCAMPro.plist").open("rb") as f:
              canonical = plistlib.load(f)

          reference_text = Path(
              "reference/IOS-15-USB/recovered/VCamRecovered.plist"
          ).read_text()

          def parse_array(key):
              match = re.search(rf"{key}\s*=\s*\((.*?)\);", reference_text, re.S)
              if not match:
                  raise SystemExit(f"Missing {key} in IOS-15-USB filter")
              return re.findall(r'"([^"]+)"', match.group(1))

          reference = {
              "Filter": {
                  "Bundles": parse_array("Bundles"),
                  "Executables": parse_array("Executables"),
              }
          }
          if canonical["Filter"]["Bundles"] != reference["Filter"]["Bundles"]:
              raise SystemExit("IOS-15-USB Bundles mismatch")
          if canonical["Filter"]["Executables"] != reference["Filter"]["Executables"]:
              raise SystemExit("IOS-15-USB Executables mismatch")
          if canonical != reference:
              raise SystemExit("Canonical VCAMPro filter differs from IOS-15-USB")
          PY
          cat >> build/activation-parity-device-remediation-001/reference-forensics/markers.txt <<'EOF'
          IOS15_USB_FILTER_BUNDLES_MATCH=PASS
          IOS15_USB_FILTER_EXECUTABLES_MATCH=PASS
          VCAMPRO_CANONICAL_FILTER_PARITY=PASS
          CANONICAL_FILTER_MATCHES_IOS15_USB=YES
          EOF
          for marker in \
            IOS15_REFERENCE_INSPECTED=YES \
            IOS15_STILL_BINARY_DISASSEMBLED=PASS \
            IOS15_REPLACEMENT_ADDRESS_175D4=PASS \
            IOS15_REPLACEMENT_IS_CMSAMPLEBUFFERGETIMAGEBUFFER_HOOK=PASS \
            IOS15_REPLACEMENT_FRAMEQUEUE_ACCESS=PASS \
            IOS15_REPLACEMENT_LASTOBJECT_ACCESS=PASS \
            IOS15_REPLACEMENT_STILLIMAGEKEY_CHECK=PASS \
            IOS15_REPLACEMENT_CMGETATTACHMENT_CALL=PASS \
            IOS15_STILLIMAGEKEY_BOOLEAN_TRUE_TEST=PASS \
            IOS15_CI_RENDER_HELPER_AUDITED=PASS \
            IOS15_CMSAMPLEBUFFERCREATEREADY_XREF_AUDITED=PASS \
            IOS15_CMSAMPLEBUFFERCREATEREADY_STILL_ROLE=UNRESOLVED \
            IOS15_USB_FILTER_BUNDLES_MATCH=PASS \
            IOS15_USB_FILTER_EXECUTABLES_MATCH=PASS \
            VCAMPRO_CANONICAL_FILTER_PARITY=PASS \
            CANONICAL_FILTER_MATCHES_IOS15_USB=YES \
            RANGE_FILES_NONEMPTY=PASS; do
            grep -Fq "$marker" build/activation-parity-device-remediation-001/reference-forensics/markers.txt
          done

      - name: Upload reference-forensics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activation-parity-reference-forensics-001
          path: build/activation-parity-device-remediation-001/reference-forensics/**
          if-no-files-found: warn
          retention-days: 14

  remediation-diagnostic:
    name: Full remediation diagnostic candidate
    needs: reference-forensics
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus
          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          echo "$GNU_PATH" >> "$GITHUB_PATH"
          mkdir -p build/activation-remediation-tests

      - name: Static scope and evidence gate
        shell: bash
        run: |
          set -euo pipefail
          task_start=e1d5ec3e806be57f1081c938b4c912ed263c70a9
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$task_start" HEAD)" = "$task_start"

          git diff --quiet "$task_start"..HEAD -- \
            src/product/ReferenceCameraHook.mm \
            src/product/MediaserverdRuntime.mm \
            src/product/CameraConsumerAdapter.cpp \
            src/product/CameraConsumerAdapter.h \
            src/product/VirtualBlackFrame.h \
            src/product/VirtualBlackFrame.mm \
            src/media_engine \
            src/frame_engine \
            product/VCAMPro.plist

          changed="$(git diff --name-only "$task_start"..HEAD)"
          printf '%s\n' "$changed" | while IFS= read -r item; do
            test -n "$item" || continue
            case "$item" in
              .github/workflows/activation-parity-device-remediation-001-ci.yml|\
              docs/CANONICAL_PROJECT_STATE.md|\
              product/activation_parity_device_remediation_001/VCAMPro.ActivationParityDeviceRemediation.plist|\
              product/activation_parity_device_remediation_001/build_activation_parity_device_remediation_input.sh|\
              product/activation_parity_device_remediation_001/ci_build_package_and_audit.sh|\
              product/activation_parity_device_remediation_001/ci_static_validate.sh|\
              product/activation_parity_device_remediation_001/control)
                ;;
              *)
                echo "Unexpected topology-reconciliation mutation: $item"
                exit 1
                ;;
            esac
          done

          sh product/activation_parity_device_remediation_001/ci_static_validate.sh \
            | tee build/activation-remediation-tests/static-validation.txt
          grep -Fq 'HISTORICAL_DESTINATION_OWNERSHIP_ADAPTED=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'CMSAMPLEBUFFERCREATEREADY_NOT_INTRODUCED=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'NO_APP_SPECIFIC_HOOKS=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'STILL_GEOMETRY_RACE_STATUS=UNRESOLVED' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'PHOTO_RUNTIME_DIAGNOSTIC_CAPABILITIES=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'STILL_RUNTIME_DIAGNOSTIC_CAPABILITIES=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'DIAGNOSTIC_QUEUE_CONSUMPTION=NO' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'VCAMPRO_CANONICAL_FILTER_SHAPE=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'NO_DIAGNOSTIC_PRODUCT_FILTER_OVERRIDE=PASS' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'PHOTO_ROOT_CAUSE=UNRESOLVED_PENDING_DEVICE_DIAGNOSTIC' build/activation-remediation-tests/static-validation.txt
          grep -Fq 'DEVICE_ACTION=NO' build/activation-remediation-tests/static-validation.txt

      - name: Activation remediation state transport tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Iproduct/activation_parity_device_remediation_001 \
            product/activation_parity_device_remediation_001/activation_parity_remediation_state_tests.cpp \
            -o build/activation-remediation-tests/state-tests
          build/activation-remediation-tests/state-tests \
            | tee build/activation-remediation-tests/state-tests.txt
          for marker in \
            ACTIVATION_REMEDIATION_STATE_ENCODING=PASS \
            ACTIVATION_REMEDIATION_FRESHNESS=PASS \
            ACTIVATION_REMEDIATION_GENERATION_BINDING=PASS \
            ACTIVATION_REMEDIATION_SESSION_FIELDS=PASS \
            ACTIVATION_REMEDIATION_PRODUCER_FIELDS=PASS \
            ACTIVATION_REMEDIATION_PRODUCER_DIAGNOSTICS=PASS \
            ACTIVATION_REMEDIATION_STILL_DIAGNOSTICS=PASS; do
            grep -Fq "$marker" build/activation-remediation-tests/state-tests.txt
          done

      - name: Frame Engine A through F2 regression matrix
        shell: bash
        run: |
          set -euo pipefail
          tools/run_frame_regressions.sh
          echo "FRAME_ENGINE=PASS"

      - name: BLACK regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic \
            -Isrc/product \
            src/product/VirtualBlackFrame.mm \
            tests/product/virtual_black_frame_tests.mm \
            -framework CoreFoundation -framework CoreVideo \
            -o build/activation-remediation-tests/virtual-black
          build/activation-remediation-tests/virtual-black \
            | tee build/activation-remediation-tests/virtual-black.txt
          grep -Fq 'failures: 0' build/activation-remediation-tests/virtual-black.txt
          grep -Fq '[PASS] 420v black content' build/activation-remediation-tests/virtual-black.txt
          grep -Fq '[PASS] 420f black content' build/activation-remediation-tests/virtual-black.txt
          echo "VCAM_ON_NO_MEDIA_USES_BLACK_STATIC=PASS"

      - name: CameraConsumerAdapter queue and generation regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Isrc/frame_engine -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/product/ControlStateCache.cpp \
            src/product/CameraConsumerAdapter.cpp \
            tests/product/camera_consumer_adapter_tests.cpp \
            -framework CoreFoundation -framework CoreMedia -framework CoreVideo \
            -o build/activation-remediation-tests/camera-consumer
          build/activation-remediation-tests/camera-consumer \
            | tee build/activation-remediation-tests/camera-consumer.txt
          grep -Fq 'failures: 0' build/activation-remediation-tests/camera-consumer.txt
          grep -Fq '[PASS] eligible media replaces black' build/activation-remediation-tests/camera-consumer.txt
          grep -Fq '[PASS] stale generation uses black' build/activation-remediation-tests/camera-consumer.txt
          grep -Fq '[PASS] stale epoch uses black' build/activation-remediation-tests/camera-consumer.txt
          grep -Fq '[PASS] producer unavailable uses black' build/activation-remediation-tests/camera-consumer.txt
          echo "PHOTO_QUEUE_BINDING_STATIC=PASS"
          echo "PHOTO_GENERATION_MATCH_STATIC=PASS"
          echo "PHOTO_TIMELINE_MATCH_STATIC=PASS"

      - name: Internal Gallery LocalPhotoReader and LocalVideoReader regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic \
            -Wno-deprecated-declarations \
            -Isrc/frame_engine -Isrc/media_engine -Isrc/control \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/FrameEngineState.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/media_engine/LocalVideoReader.mm \
            src/media_engine/LocalPhotoReader.mm \
            src/media_engine/FrameNormalizer.cpp \
            src/media_engine/FrameTransformer.mm \
            src/media_engine/FramePipelinePump.cpp \
            tests/media_engine/internal_gallery_integration_tests.mm \
            -framework Accelerate -framework Foundation -framework AVFoundation \
            -framework CoreFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework ImageIO \
            -o build/activation-remediation-tests/internal-gallery
          build/activation-remediation-tests/internal-gallery \
            | tee build/activation-remediation-tests/internal-gallery.txt
          grep -Fq 'failures: 0' build/activation-remediation-tests/internal-gallery.txt
          echo "LOCAL_PHOTO_READER=PASS"
          echo "LOCAL_VIDEO_READER=PASS"
          echo "GALLERY=PASS"

      - name: Full product lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread \
            -Wno-deprecated-declarations \
            -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/FrameEngineState.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/frame_engine/FrameTimelineScheduler.cpp \
            src/frame_engine/MonotonicHostClock.cpp \
            src/media_engine/LocalVideoReader.mm \
            src/media_engine/LocalPhotoReader.mm \
            src/media_engine/FrameNormalizer.cpp \
            src/media_engine/FrameTransformer.mm \
            src/media_engine/FramePipelinePump.cpp \
            src/media_engine/FramePipelinePumpTimed.cpp \
            src/media_engine/ProducerWakeupController.cpp \
            src/media_engine/ProducerWakeupDriver.mm \
            src/media_engine/InternalGalleryMediaSession.mm \
            src/product/ControlStateCache.cpp \
            src/product/VirtualBlackFrame.mm \
            src/product/CameraConsumerAdapter.cpp \
            src/product/SharedControlStore.mm \
            src/product/SharedMediaStager.mm \
            src/product/ProductControlOwner.mm \
            tests/product/full_product_integration_tests.mm \
            -framework Accelerate -framework Foundation -framework AVFoundation \
            -framework CoreFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework ImageIO \
            -o build/activation-remediation-tests/full-product
          build/activation-remediation-tests/full-product \
            | tee build/activation-remediation-tests/full-product.txt
          grep -Fq 'failures: 0' build/activation-remediation-tests/full-product.txt
          grep -Fq '[PASS] activation parity black photo black original' build/activation-remediation-tests/full-product.txt
          echo "PHOTO_READY_REPLACES_BLACK_STATIC=PASS"
          echo "VCAM_OFF_RESTORES_ORIGINAL_STATIC=PASS"
          echo "FULL_PRODUCT_LIFECYCLE=PASS"

      - name: Reference hook output ownership regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic \
            -Wno-deprecated-declarations -Wno-unused-function \
            -DVCAM_REFERENCE_CAMERA_HOOK_OUTPUT_OWNERSHIP_TEST=1 \
            -Isrc/frame_engine -Isrc/product \
            src/product/ReferenceCameraHook.mm \
            tests/product/reference_camera_hook_output_ownership_tests.mm \
            -framework CoreFoundation -framework CoreMedia -framework CoreVideo \
            -o build/activation-remediation-tests/hook-ownership
          build/activation-remediation-tests/hook-ownership \
            | tee build/activation-remediation-tests/hook-ownership.txt
          grep -Fq 'failures: 0' build/activation-remediation-tests/hook-ownership.txt
          grep -Fq 'STILL_SAME_GEOMETRY_VIRTUAL_OWNERSHIP=PASS' build/activation-remediation-tests/hook-ownership.txt
          grep -Fq 'STILL_GEOMETRY_MISMATCH_PRESERVES_ORIGINAL=OBSERVED' build/activation-remediation-tests/hook-ownership.txt
          grep -Fq 'STILL_GEOMETRY_RACE_DEVICE_CLASSIFICATION=REQUIRED' build/activation-remediation-tests/hook-ownership.txt
          if grep -Fq 'FLASH_STILL_CAPTURE_DOES_NOT_EXPOSE_ORIGINAL=PASS' build/activation-remediation-tests/hook-ownership.txt; then
            echo "Host test must not claim unresolved flash/still device outcome"
            exit 1
          fi

      - name: Build RootHide diagnostic remediation package and audit
        shell: bash
        run: |
          set -euo pipefail
          sh product/activation_parity_device_remediation_001/ci_build_package_and_audit.sh

      - name: Diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          REPORT=build/activation-parity-device-remediation-001/evidence/validation-report.txt
          grep -Fq 'PACKAGE_ROLE=DIAGNOSTIC_REMEDIATION_CANDIDATE' "$REPORT"
          grep -Fq 'CANONICAL_FILTER_SOURCE=product/VCAMPro.plist' "$REPORT"
          grep -Fq 'PACKAGED_FILTER_SOURCE=product/VCAMPro.plist' "$REPORT"
          grep -Fq 'PACKAGED_VCAMPRO_PLIST_PRESENT=PASS' "$REPORT"
          grep -Fq 'PACKAGED_VCAMPRO_PLIST_CANONICAL_MATCH=PASS' "$REPORT"
          grep -Fq 'PACKAGED_FILTER_BUNDLES_MATCH=PASS' "$REPORT"
          grep -Fq 'PACKAGED_FILTER_EXECUTABLES_MATCH=PASS' "$REPORT"
          grep -Fq 'IOS15_USB_FILTER_PARITY=PASS' "$REPORT"
          grep -Fq 'NO_DIAGNOSTIC_PRODUCT_FILTER_OVERRIDE=PASS' "$REPORT"
          grep -Fq 'PACKAGED_PRODUCT_FILTER_HAS_SPRINGBOARD_EXECUTABLE_OVERRIDE=NO' "$REPORT"
          grep -Fq 'PHOTO_ROOT_CAUSE=UNRESOLVED_PENDING_DEVICE_DIAGNOSTIC' "$REPORT"
          grep -Fq 'ARM64=PASS' "$REPORT"
          grep -Fq 'MINIMUM_IOS_15=PASS' "$REPORT"
          grep -Fq 'ROOTHIDE_PACKAGE=PASS' "$REPORT"
          grep -Fq 'VALID_CODE_SIGNATURE=PASS' "$REPORT"
          grep -Fq 'PHOTO_RUNTIME_DIAGNOSTIC_CAPABILITIES=PASS' "$REPORT"
          grep -Fq 'STILL_RUNTIME_DIAGNOSTIC_CAPABILITIES=PASS' "$REPORT"
          grep -Fq 'VCAM_ON_NO_MEDIA_USES_BLACK=PASS' "$REPORT"
          grep -Fq 'STILL_GEOMETRY_RACE_STATUS=UNRESOLVED' "$REPORT"
          grep -Fq 'FLASH_STILL_CAPTURE_DOES_NOT_EXPOSE_ORIGINAL=UNRESOLVED' "$REPORT"
          grep -Fq 'STILL_CAPTURE_REMEDIATION=INCOMPLETE_EVIDENCE' "$REPORT"
          grep -Fq 'MAIN_UNCHANGED=PASS' "$REPORT"
          grep -Fq 'READ_ONLY_REPOS_UNCHANGED=PASS' "$REPORT"
          grep -Fq 'DEVICE_ACTION=NO' "$REPORT"
          echo "ACTIVATION_PARITY_DEVICE_REMEDIATION_DIAGNOSTIC_PACKAGE=PASS"
          echo "STILL_CAPTURE_REMEDIATION=INCOMPLETE_EVIDENCE"

      - name: Upload diagnostic remediation package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-activation-parity-device-remediation-002
          path: |
            build/activation-parity-device-remediation-001/final/VCAM-PRO-RootHide-Activation-Parity-Device-Remediation-002.deb
            build/activation-parity-device-remediation-001/final/VCAM-PRO-RootHide-Activation-Parity-Device-Remediation-002.deb.sha256
            build/activation-parity-device-remediation-001/evidence/**
            build/activation-remediation-tests/*.txt
            build/regressions/*.txt
          if-no-files-found: error
          retention-days: 14
