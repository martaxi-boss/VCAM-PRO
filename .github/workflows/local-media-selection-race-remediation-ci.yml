name: VCAM PRO Local Media Selection Race Remediation CI

on:
  push:
    branches:
      - builder/local-media-selection-race-remediation-001

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local gallery selection race remediation
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact ancestry and authorized diff
        run: |
          set -euo pipefail

          target=11ebb083280cd94813d570953fbfa4cadf033081

          git merge-base --is-ancestor "$target" HEAD

          source_sha="$(git ls-remote origin refs/heads/builder/full-camera-gallery-test-deb-001 | awk '{print $1}')"
          test "$source_sha" = "$target"

          changed="$(git diff --name-only "$target"..HEAD)"

          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              src/control/InternalGalleryViewController.mm|              src/control/SelectionCompletionGate.h|              src/product/ProductControlOwner.h|              src/product/ProductControlOwner.mm|              tests/control/selection_completion_race_tests.cpp|              tests/product/selection_post_claim_commit_race_tests.mm|              .github/workflows/local-media-selection-race-remediation-ci.yml)
                ;;
              *)
                echo "Unauthorized changed file: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

          test "$(git ls-remote https://github.com/martaxi-boss/MotionCam-iOS.git refs/heads/main | awk '{print $1}')" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-15-USB.git refs/heads/main | awk '{print $1}')" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-16-USB-4k.git refs/heads/main | awk '{print $1}')" = "cc20d787070c67565173d4a46c218e2549cecc93"

          echo "EXACT_ANCESTRY=PASS"
          echo "AUTHORIZED_DIFF=PASS"
          echo "REFERENCE_REPOS_UNCHANGED=PASS"

      - name: Prove pre-staging stale rejection ordering
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/control/InternalGalleryViewController.mm")
          text = path.read_text()

          claim = text.find(
              "claimFileCompletionForRequestToken:\n"
              "                        requestToken")
          mutation = text.find(
              "->selectFromTemporaryPath(")

          if claim < 0:
              raise SystemExit("freshness claim call not found")
          if mutation < 0:
              raise SystemExit("ProductControlOwner mutation call not found")
          if claim >= mutation:
              raise SystemExit(
                  "freshness claim does not precede ProductControlOwner mutation")

          gate = Path(
              "src/control/SelectionCompletionGate.h").read_text()

          required = [
              "claimFileCompletion",
              "commitIfCurrent",
              "std::lock_guard<std::mutex>",
              "requestToken != requestToken_",
              "!consumed_",
              "!fileCompletionClaimed_",
              "finalCommitClaimed_",
          ]

          for token in required:
              if token not in gate:
                  raise SystemExit(
                      f"missing gate invariant: {token}")

          print("PRE_STAGING_STALE_REJECTION=PASS")
          PY

      - name: Run existing 10 selection race tests
        run: |
          set -euo pipefail

          mkdir -p build/selection-race

          xcrun --sdk macosx clang++             -std=c++17             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Isrc/control             tests/control/selection_completion_race_tests.cpp             -o build/selection-race/selection-race-tests

          build/selection-race/selection-race-tests             | tee build/selection-race/results.txt

          grep -q 'Selection race tests run: 10, failures: 0'             build/selection-race/results.txt

          echo "PRE_STAGING_STALE_REJECTION=PASS"

      - name: Run deterministic post-claim pre-commit race tests
        run: |
          set -euo pipefail

          mkdir -p build/selection-race

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             -Isrc/product             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/selection_post_claim_commit_race_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/selection-race/post-claim-race-tests

          build/selection-race/post-claim-race-tests             | tee build/selection-race/post-claim-results.txt

          grep -q 'Post-claim commit race tests run: 4, failures: 0'             build/selection-race/post-claim-results.txt
          grep -q 'PASS B cancellation blocks A and cleans stage'             build/selection-race/post-claim-results.txt
          grep -q 'PASS failed B does not revive A'             build/selection-race/post-claim-results.txt
          grep -q 'PASS successful B is only winner'             build/selection-race/post-claim-results.txt
          grep -q 'PASS A commit before B start remains valid'             build/selection-race/post-claim-results.txt

          echo "POST_CLAIM_PRE_COMMIT_STALE_REJECTION=PASS"
          echo "LATEST_SELECTION_REQUEST_WINS=PASS"
          echo "REJECTED_STAGED_MEDIA_CLEANUP=PASS"

      - name: Frame Engine A through F2 regressions
        run: |
          set -euo pipefail

          tools/run_frame_regressions.sh

          echo "FRAME_ENGINE_A_F2=PASS"

      - name: Internal Gallery 20-case regression
        run: |
          set -euo pipefail

          mkdir -p build/gallery-race-remediation

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/internal_gallery_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/gallery-race-remediation/internal-gallery

          build/gallery-race-remediation/internal-gallery             | tee build/gallery-race-remediation/internal-gallery.txt

          grep -q 'Internal gallery tests run: 20, failures: 0'             build/gallery-race-remediation/internal-gallery.txt

          echo "INTERNAL_GALLERY=PASS"

      - name: Existing safe Product Integration regression
        run: |
          set -euo pipefail

          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall             -Wextra             -Werror             -pedantic             -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/full_product_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/gallery-race-remediation/product-integration

          build/gallery-race-remediation/product-integration             | tee build/gallery-race-remediation/product-integration.txt

          grep -q 'Product integration tests run: 8, failures: 0'             build/gallery-race-remediation/product-integration.txt

          echo "PRODUCT_INTEGRATION=PASS"

      - name: Compile changed production sources for iOS 15 arm64
        run: |
          set -euo pipefail

          mkdir -p build/gallery-race-remediation/ios

          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"

          common=(
            -std=c++17
            -fobjc-arc
            -arch arm64
            -isysroot "$SDKROOT"
            -miphoneos-version-min=15.0
            -Wall
            -Wextra
            -Werror
            -Werror=unguarded-availability-new
            -pedantic
            -Wno-deprecated-declarations
            -Isrc/frame_engine
            -Isrc/media_engine
            -Isrc/control
            -Isrc/product
          )

          "$CXX"             "${common[@]}"             -c src/control/InternalGalleryViewController.mm             -o build/gallery-race-remediation/ios/InternalGalleryViewController.o

          "$CXX"             "${common[@]}"             -c src/product/ProductControlOwner.mm             -o build/gallery-race-remediation/ios/ProductControlOwner.o

          for object in             InternalGalleryViewController.o             ProductControlOwner.o; do
            xcrun lipo -info               "build/gallery-race-remediation/ios/$object"               | tee "build/gallery-race-remediation/ios/$object.arch.txt"

            grep -q 'arm64'               "build/gallery-race-remediation/ios/$object.arch.txt"

            if grep -q 'arm64e'                 "build/gallery-race-remediation/ios/$object.arch.txt"; then
              exit 1
            fi

            xcrun otool -l               "build/gallery-race-remediation/ios/$object"               | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'               | tee "build/gallery-race-remediation/ios/$object.minos.txt"

            grep -q 'minos 15.0'               "build/gallery-race-remediation/ios/$object.minos.txt"
          done

          echo "IOS15_ARM64=PASS"

      - name: Confirm excluded subsystems untouched
        run: |
          set -euo pipefail

          target=11ebb083280cd94813d570953fbfa4cadf033081

          for path in             src/product/ReferenceCameraHook.h             src/product/ReferenceCameraHook.mm             src/product/MediaserverdRuntime.h             src/product/MediaserverdRuntime.mm             src/product/CameraConsumerAdapter.h             src/product/CameraConsumerAdapter.cpp; do
            test -z "$(git diff --name-only "$target"..HEAD -- "$path")"
          done

          test -z "$(git diff --name-only "$target"..HEAD -- 'src/controlled/**')"

          echo "GLOBAL_CAMERA_SUBSYSTEMS_UNTOUCHED=PASS"
          echo "CONTROLLED_PREVIEW_UNTOUCHED=PASS"
          echo "DEVICE_ACTION=NO"
          echo "MERGE_PERFORMED=NO"
