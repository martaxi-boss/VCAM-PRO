name: VCAM PRO Reference Camera Hook Reachability Gate 001

on:
  push:
    branches:
      - builder/reference-camera-hook-reachability-gate-001
    paths:
      - "product/hook_reachability_gate/**"
      - ".github/workflows/reference-camera-hook-reachability-gate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcampro-reference-hook-reachability-gate-001
  cancel-in-progress: true

jobs:
  validate:
    name: Reference hook reachability without hook activation
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout reachability gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base and mutation lock
        shell: bash
        run: |
          set -euo pipefail

          BASE=eb463efd7a01e9160b5acb0e3541f3e016f47015
          LOAD_PROBE=78b88bb36094ae1d0b4f6369e4d6ff03e9df9e67
          PR19=2475bd51953b536c32d12e37475fd32eaf7c4a67

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"

          changed="$(git diff --name-only "$BASE"..HEAD)"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              product/hook_reachability_gate/*|.github/workflows/reference-camera-hook-reachability-gate-ci.yml)
                ;;
              *)
                echo "Unauthorized changed file: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

          git diff --quiet "$BASE"..HEAD -- src
          git diff --quiet "$BASE"..HEAD -- product/runtime_gate
          git diff --quiet "$BASE"..HEAD -- proofs/mediaserverd_load_probe
          git diff --quiet "$BASE"..HEAD --             product/build_roothide_integration_input.sh             product/VCAMPro.RootHideIntegration.plist             product/roothide_integration

          test "$(git ls-remote origin refs/heads/builder/roothide-mediaserverd-runtime-gate-001 | awk '{print $1}')" = "$BASE"
          test "$(git ls-remote origin refs/heads/builder/roothide-mediaserverd-load-proof-002 | awk '{print $1}')" = "$LOAD_PROBE"
          test "$(git ls-remote origin refs/pull/19/head | awk '{print $1}')" = "$PR19"

          test "$(git ls-remote https://github.com/martaxi-boss/MotionCam-iOS.git refs/heads/main | awk '{print $1}')" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-15-USB.git refs/heads/main | awk '{print $1}')" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-16-USB-4k.git refs/heads/main | awk '{print $1}')" = "cc20d787070c67565173d4a46c218e2549cecc93"

          echo "REFERENCE_CAMERA_HOOK_SOURCE_UNCHANGED=PASS"
          echo "ROOT_HIDE_PACKAGING_UNCHANGED=PASS"
          echo "SPRINGBOARD_CONTROL_UNCHANGED=PASS"
          echo "FLOATING_CONTROL_UNCHANGED=PASS"
          echo "MEDIASERVERD_RUNTIME_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "SHARED_CONTROL_UNCHANGED=PASS"
          echo "SHARED_MEDIA_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"
          echo "PREVIOUS_GATES_MODIFIED=NO"
          echo "PR19_MODIFIED=NO"
          echo "REFERENCE_REPOS_MODIFIED=NO"

      - name: Validate hook reachability source semantics
        shell: bash
        run: |
          set -euo pipefail

          GATE=product/hook_reachability_gate
          BUILD="$GATE/build_hook_reachability_gate_input.sh"
          STUB="$GATE/ReferenceCameraHookReachabilityStub.mm"
          WITNESS="$GATE/HookReachabilityWitness.mm"
          STATE="$GATE/HookReachabilityProofState.h"

          for source in             src/product/VCAMProEntry.mm             src/product/MediaserverdRuntime.mm             src/product/CameraConsumerAdapter.cpp             src/product/ControlStateCache.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm; do
            grep -Fq "$source" "$BUILD"
          done

          if grep -Fq 'src/product/ReferenceCameraHook.mm' "$BUILD"; then
            echo "Real hook source must not be linked into the device dylib."
            exit 1
          fi
          grep -Fq 'product/hook_reachability_gate/ReferenceCameraHookReachabilityStub.mm' "$BUILD"

          grep -Fq 'ProcessIs("mediaserverd")' src/product/VCAMProEntry.mm
          grep -Fq 'MediaserverdRuntime::shared()' src/product/VCAMProEntry.mm
          grep -Fq 'if (runtime.start())' src/product/VCAMProEntry.mm
          grep -Fq 'InstallReferenceCameraHook()' src/product/VCAMProEntry.mm

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          entry = Path("src/product/VCAMProEntry.mm").read_text()
          start = entry.index("if (runtime.start())")
          call = entry.index("InstallReferenceCameraHook()", start)
          if call <= start:
              raise SystemExit("Production runtime.start -> hook call ordering changed")

          hook = Path("src/product/ReferenceCameraHook.mm").read_text()
          for token in (
              "MSHookFunction",
              "HookedCMSampleBufferGetImageBuffer",
              "CMSampleBufferGetImageBuffer",
              "observeRealCameraBuffer",
              "decideCameraBuffer",
          ):
              if token not in hook:
                  raise SystemExit(f"Frozen production hook token missing: {token}")

          build = Path("product/hook_reachability_gate/build_hook_reachability_gate_input.sh").read_text()
          if "src/product/ReferenceCameraHook.mm" in build:
              raise SystemExit("Real hook linked by gate build")
          if "ReferenceCameraHookReachabilityStub.mm" not in build:
              raise SystemExit("Gate stub missing from build")

          gate = Path("product/hook_reachability_gate")
          with (gate / "VCAMPro.HookReachabilityGate.plist").open("rb") as f:
              product_filter = plistlib.load(f)
          with (gate / "VCAMProHookReachabilityWitness.plist").open("rb") as f:
              witness_filter = plistlib.load(f)

          if product_filter != {"Filter": {"Executables": ["SpringBoard", "mediaserverd"]}}:
              raise SystemExit(f"Unexpected product filter: {product_filter!r}")
          if witness_filter != {"Filter": {"Executables": ["SpringBoard"]}}:
              raise SystemExit(f"Unexpected witness filter: {witness_filter!r}")

          stub = (gate / "ReferenceCameraHookReachabilityStub.mm").read_text()
          required = (
              'dlsym(',
              'RTLD_DEFAULT',
              '"CMSampleBufferGetImageBuffer"',
              '"mediaserverd"',
              'target-symbol=RESOLVED',
              'hook-install=DISABLED',
              'frame-access=INACTIVE',
              'frame-substitution=INACTIVE',
              'return false;',
          )
          for token in required:
              if token not in stub:
                  raise SystemExit(f"Reachability stub missing token: {token}")

          forbidden = (
              "MSHookFunction",
              "HookedCMSampleBufferGetImageBuffer",
              "observeRealCameraBuffer",
              "decideCameraBuffer",
              "CMSampleBufferRef",
              "CVPixelBufferRef",
              "CMSampleBufferGetImageBuffer(",
              "dlopen(",
          )
          for token in forbidden:
              if token in stub:
                  raise SystemExit(f"Forbidden active hook/frame token in stub: {token}")

          if stub.count("dlsym(") != 1:
              raise SystemExit("Symbol resolution probe must be single and bounded")

          witness = (gate / "HookReachabilityWitness.mm").read_text()
          for token in (
              '"SpringBoard"',
              "notify_register_dispatch",
              "notify_get_state",
              "VCAM REFERENCE HOOK REACHABILITY PASS",
              "runtime.start=PASS",
              "hook-call-path=REACHED",
              "target-symbol=RESOLVED",
              "hook-install=DISABLED",
              "frame-substitution=INACTIVE",
              "ValidateTokenState(token);",
          ):
              if token not in witness:
                  raise SystemExit(f"Witness contract missing: {token}")

          for token in (
              "MSHookFunction",
              "CMSampleBuffer",
              "CVPixelBuffer",
              "observeRealCameraBuffer",
              "decideCameraBuffer",
          ):
              if token in witness:
                  raise SystemExit(f"Camera/frame token leaked into witness: {token}")

          print("PRODUCTION_MEDIASERVERD_RUNTIME_COMPILED=PASS")
          print("PRODUCTION_VCAM_ENTRY_COMPILED=PASS")
          print("HOOK_CALL_PATH_REACHABILITY_PROOF=PASS")
          print("TARGET_SYMBOL_RESOLUTION_PROBE=PASS")
          print("TARGET_SYMBOL_NOT_INVOKED=PASS")
          print("HOOK_INSTALLATION_DISABLED=PASS")
          print("REAL_HOOK_NOT_LINKED=PASS")
          print("CAMERA_INTERCEPTION_INACTIVE=PASS")
          print("FRAME_CALLBACK_PATH_INACTIVE=PASS")
          print("FRAME_ACCESS_INACTIVE=PASS")
          print("FRAME_SUBSTITUTION_INACTIVE=PASS")
          PY

          external_calls="$(
            grep -RInE '\.(observeRealCameraBuffer|decideCameraBuffer)[[:space:]]*\(' src/product               --exclude=ReferenceCameraHook.mm               --exclude=MediaserverdRuntime.mm               --exclude=MediaserverdRuntime.h || true
          )"
          test -z "$external_calls"

          local_media_target_calls="$(
            grep -RIl 'CMSampleBufferGetImageBuffer(' src \
              --exclude=ReferenceCameraHook.mm || true
          )"
          test "$local_media_target_calls" = "src/media_engine/LocalVideoReader.mm"
          grep -Fq 'CMSampleBufferGetImageBuffer(sample)' src/media_engine/LocalVideoReader.mm

          if grep -RInE 'MSHookFunction|HookedCMSampleBufferGetImageBuffer|CMSampleBufferRef|CVPixelBufferRef|observeRealCameraBuffer|decideCameraBuffer'               "$GATE"; then
            echo "Active hook/camera/frame path leaked into gate-only files."
            exit 1
          fi

          if grep -Eqi 'killall|pkill|launchctl|ldrestart|sbreload|userspace|reboot|SpringBoard|mediaserverd|control\.plist|VCAMPro/Media|SharedControl|SharedMedia|select|enabled' "$GATE/postinst"; then
            echo "Forbidden maintainer-script effect."
            exit 1
          fi

          echo "MSHOOKFUNCTION_ABSENT=PASS"
          echo "CAMERA_INTERCEPTION_INACTIVE=PASS"
          echo "FRAME_CALLBACK_PATH_INACTIVE=PASS"
          echo "FRAME_ACCESS_INACTIVE=PASS"
          echo "FRAME_SUBSTITUTION_INACTIVE=PASS"

      - name: Run deterministic reachability state tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/hook-reachability-state
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Iproduct/hook_reachability_gate             product/hook_reachability_gate/hook_reachability_state_tests.cpp             -o build/hook-reachability-state/tests

          build/hook-reachability-state/tests |
            tee build/hook-reachability-state/results.txt

          grep -q 'HOOK_CALL_PATH_REACHABILITY_PROOF=PASS' build/hook-reachability-state/results.txt
          grep -q 'TARGET_SYMBOL_RESOLUTION_PROBE=PASS' build/hook-reachability-state/results.txt
          grep -q 'HOOK_INSTALLATION_DISABLED=PASS' build/hook-reachability-state/results.txt
          grep -q 'FRAME_ACCESS_INACTIVE=PASS' build/hook-reachability-state/results.txt
          grep -q 'FRAME_SUBSTITUTION_INACTIVE=PASS' build/hook-reachability-state/results.txt
          grep -q 'FRESHNESS_VALIDATION=PASS' build/hook-reachability-state/results.txt

      - name: Compile frozen ReferenceCameraHook source only
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/reference-hook-compile-only
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"

          "$CXX"             -std=c++17             -arch arm64             -isysroot "$SDKROOT"             -miphoneos-version-min=15.0             -Wall -Wextra -Werror             -Werror=unguarded-availability-new             -pedantic             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/product             -c src/product/ReferenceCameraHook.mm             -o build/reference-hook-compile-only/ReferenceCameraHook.compile-only.o

          xcrun lipo -info build/reference-hook-compile-only/ReferenceCameraHook.compile-only.o |
            tee build/reference-hook-compile-only/arch.txt
          grep -q 'arm64' build/reference-hook-compile-only/arch.txt

          xcrun nm -u build/reference-hook-compile-only/ReferenceCameraHook.compile-only.o |
            tee build/reference-hook-compile-only/undefined.txt
          grep -q '_MSHookFunction' build/reference-hook-compile-only/undefined.txt
          grep -q '_CMSampleBufferGetImageBuffer' build/reference-hook-compile-only/undefined.txt

          echo "REFERENCE_CAMERA_HOOK_SOURCE_UNCHANGED=PASS"
          echo "REFERENCE_CAMERA_HOOK_COMPILE_ONLY=PASS"

      - name: Run accepted production regression matrix
        shell: bash
        run: |
          set -euo pipefail
          sh product/runtime_gate/run_runtime_gate_regressions.sh

          echo "SHARED_CONTROL_UNCHANGED=PASS"
          echo "SHARED_MEDIA_UNCHANGED=PASS"
          echo "SPRINGBOARD_CONTROL_UNCHANGED=PASS"
          echo "FLOATING_CONTROL_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"

      - name: Install RootHide packaging tools
        shell: bash
        run: |
          set -euo pipefail

          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus

          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          export PATH="$GNU_PATH:$PATH"
          echo "$GNU_PATH" >> "$GITHUB_PATH"

          command -v ldid
          dpkg-deb --version

      - name: Build hook reachability RootHide input
        shell: bash
        run: |
          set -euo pipefail

          sh product/hook_reachability_gate/build_hook_reachability_gate_input.sh

          ROOT=build/reference-camera-hook-reachability-gate-001
          INPUT="$ROOT/input/com.vcampro.camera_0.1.0+roothide5~hookreach1_iphoneos-arm64.deb"

          test -f "$INPUT"
          test "$(dpkg-deb -f "$INPUT" Package)" = "com.vcampro.camera"
          test "$(dpkg-deb -f "$INPUT" Version)" = "0.1.0+roothide5~hookreach1"
          test "$(dpkg-deb -f "$INPUT" Architecture)" = "iphoneos-arm64"

          mkdir -p "$ROOT/evidence"
          dpkg-deb -c "$INPUT" | tee "$ROOT/evidence/input-inventory.txt"

          if grep -q 'ReferenceCameraHook.compile-only.o' "$ROOT/evidence/input-inventory.txt"; then
            echo "Compile-only hook object leaked into package input."
            exit 1
          fi

      - name: Fetch pinned official RootHidePatcher
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/build/reference-camera-hook-reachability-gate-001"
          PATCHER_SHA=80c16e08da33fecd27c0ff35777f37afd171868b

          git clone --quiet https://github.com/roothide/RootHidePatcher.git "$ROOT/RootHidePatcher"
          git -C "$ROOT/RootHidePatcher" checkout --quiet "$PATCHER_SHA"
          test "$(git -C "$ROOT/RootHidePatcher" rev-parse HEAD)" = "$PATCHER_SHA"

          echo "ROOTHIDE_PATCHER_SHA=$PATCHER_SHA" |
            tee "$ROOT/evidence/roothide-patcher.txt"

      - name: Convert to final RootHide package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/build/reference-camera-hook-reachability-gate-001"
          INPUT="$ROOT/input/com.vcampro.camera_0.1.0+roothide5~hookreach1_iphoneos-arm64.deb"
          FINAL_DIR="$ROOT/final"
          FINAL="$FINAL_DIR/VCAM-PRO-RootHide-Reference-Hook-Reachability-Gate-001.deb"

          mkdir -p "$FINAL_DIR"
          sudo env "PATH=$PATH" bash "$ROOT/RootHidePatcher/patch.sh" "$INPUT" "$FINAL"

          test -f "$FINAL"
          shasum -a 256 "$FINAL" | tee "$FINAL.sha256"

      - name: Inspect final RootHide package
        shell: bash
        run: |
          set -euo pipefail

          ROOT=build/reference-camera-hook-reachability-gate-001
          FINAL="$ROOT/final/VCAM-PRO-RootHide-Reference-Hook-Reachability-Gate-001.deb"
          EXTRACT="$ROOT/extracted-final"
          EVIDENCE="$ROOT/evidence"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT" "$EVIDENCE"
          dpkg-deb -R "$FINAL" "$EXTRACT"

          dpkg-deb -f "$FINAL" | tee "$EVIDENCE/final-control.txt"
          dpkg-deb -c "$FINAL" | tee "$EVIDENCE/final-inventory.txt"

          test "$(dpkg-deb -f "$FINAL" Package)" = "com.vcampro.camera"
          test "$(dpkg-deb -f "$FINAL" Version)" = "0.1.0+roothide5~hookreach1"
          test "$(dpkg-deb -f "$FINAL" Architecture)" = "iphoneos-arm64e"

          for file in             VCAMPro.dylib             VCAMPro.plist             VCAMProHookReachabilityWitness.dylib             VCAMProHookReachabilityWitness.plist; do
            test -f "$EXTRACT/usr/lib/TweakInject/$file"
          done

          test ! -e "$EXTRACT/var/jb"
          test ! -e "$EXTRACT/usr/lib/TweakInject/ReferenceCameraHook.compile-only.o"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          root = Path("build/reference-camera-hook-reachability-gate-001/extracted-final/usr/lib/TweakInject")
          with (root / "VCAMPro.plist").open("rb") as f:
              product = plistlib.load(f)
          with (root / "VCAMProHookReachabilityWitness.plist").open("rb") as f:
              witness = plistlib.load(f)

          if product != {"Filter": {"Executables": ["SpringBoard", "mediaserverd"]}}:
              raise SystemExit(f"Unexpected final product filter: {product!r}")
          if witness != {"Filter": {"Executables": ["SpringBoard"]}}:
              raise SystemExit(f"Unexpected final witness filter: {witness!r}")

          print("EXACT_HOOK_REACHABILITY_FILTER=PASS")
          PY

          if find "$EXTRACT" -type f | grep -E 'com\.vcampro\.control\.plist|/VCAMPro/Media/'; then
            echo "Gate package must not create control/media state."
            exit 1
          fi

          echo "ROOT_HIDE_PACKAGE_ARCH=PASS"
          echo "ELLEKIT_TWEAKINJECT_LAYOUT=PASS"

      - name: Audit final VCAMPro dylib
        shell: bash
        run: |
          set -euo pipefail

          ROOT=build/reference-camera-hook-reachability-gate-001
          DYLIB="$ROOT/extracted-final/usr/lib/TweakInject/VCAMPro.dylib"
          EVIDENCE="$ROOT/evidence"

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/product-arch.txt"
          grep -q 'architecture: arm64' "$EVIDENCE/product-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/product-arch.txt"; then
            echo "A9 artifact must contain arm64 code only."
            exit 1
          fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/product-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/product-install-name.txt"
          xcrun otool -L "$DYLIB" | tee "$EVIDENCE/product-linked-libraries.txt"
          xcrun nm "$DYLIB" | c++filt > "$EVIDENCE/product-symbols.txt" || true
          xcrun nm -u "$DYLIB" | tee "$EVIDENCE/product-undefined.txt" || true
          strings "$DYLIB" > "$EVIDENCE/product-strings.txt"

          grep -q 'minos 15.0' "$EVIDENCE/product-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/product-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/product-load-commands.txt"
          grep -q '@loader_path/VCAMPro.dylib' "$EVIDENCE/product-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/product-entitlements.txt"

          grep -Fq 'vcam::product::MediaserverdRuntime::start()' "$EVIDENCE/product-symbols.txt"
          grep -Fq 'VCAMProInitialize' "$EVIDENCE/product-symbols.txt"
          grep -Fq 'vcam::product::InstallReferenceCameraHook()' "$EVIDENCE/product-symbols.txt"

          grep -q '_dlsym' "$EVIDENCE/product-undefined.txt"
          grep -Fq 'CMSampleBufferGetImageBuffer' "$EVIDENCE/product-strings.txt"
          grep -Fq 'com.vcampro.gate.reference-hook-reachability.001' "$EVIDENCE/product-strings.txt"
          grep -Fq 'hook-call-path=REACHED' "$EVIDENCE/product-strings.txt"
          grep -Fq 'target-symbol=RESOLVED' "$EVIDENCE/product-strings.txt"
          grep -Fq 'hook-install=DISABLED' "$EVIDENCE/product-strings.txt"
          grep -Fq 'frame-access=INACTIVE' "$EVIDENCE/product-strings.txt"
          grep -Fq 'frame-substitution=INACTIVE' "$EVIDENCE/product-strings.txt"

          if grep -Eq '_MSHookFunction' "$EVIDENCE/product-undefined.txt"; then
            echo "Hooking function import found in final device dylib."
            exit 1
          fi

          grep -q '_CMSampleBufferGetImageBuffer' "$EVIDENCE/product-undefined.txt"
          echo "CMSAMPLEBUFFER_TARGET_IMPORT_SOURCE=FROZEN_LOCAL_VIDEO_READER"

          if grep -Eq 'HookedCMSampleBufferGetImageBuffer|Hooking CMSampleBufferGetImageBuffer'               "$EVIDENCE/product-symbols.txt" "$EVIDENCE/product-strings.txt"; then
            echo "Real hook implementation found in final device dylib."
            exit 1
          fi

          if grep -q 'CydiaSubstrate' "$EVIDENCE/product-linked-libraries.txt"; then
            echo "Hooking framework linked into reachability gate."
            exit 1
          fi

          echo "PRODUCTION_MEDIASERVERD_RUNTIME_COMPILED=PASS"
          echo "PRODUCTION_VCAM_ENTRY_COMPILED=PASS"
          echo "HOOK_CALL_PATH_REACHABILITY_PROOF=PASS"
          echo "TARGET_SYMBOL_RESOLUTION_PROBE=PASS"
          echo "TARGET_SYMBOL_NOT_INVOKED=PASS"
          echo "HOOK_INSTALLATION_DISABLED=PASS"
          echo "REAL_HOOK_NOT_LINKED=PASS"
          echo "MSHOOKFUNCTION_ABSENT=PASS"
          echo "REAL_HOOK_IMPLEMENTATION_ABSENT=PASS"
          echo "CAMERA_INTERCEPTION_INACTIVE=PASS"
          echo "FRAME_CALLBACK_PATH_INACTIVE=PASS"
          echo "FRAME_ACCESS_INACTIVE=PASS"
          echo "FRAME_SUBSTITUTION_INACTIVE=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ROOTHIDE_RPATH=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"

      - name: Audit final SpringBoard witness
        shell: bash
        run: |
          set -euo pipefail

          ROOT=build/reference-camera-hook-reachability-gate-001
          DYLIB="$ROOT/extracted-final/usr/lib/TweakInject/VCAMProHookReachabilityWitness.dylib"
          EVIDENCE="$ROOT/evidence"

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/witness-arch.txt"
          grep -q 'architecture: arm64' "$EVIDENCE/witness-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/witness-arch.txt"; then exit 1; fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/witness-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/witness-install-name.txt"
          xcrun otool -L "$DYLIB" | tee "$EVIDENCE/witness-linked-libraries.txt"
          strings "$DYLIB" > "$EVIDENCE/witness-strings.txt"

          grep -q 'minos 15.0' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/VCAMProHookReachabilityWitness.dylib' "$EVIDENCE/witness-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/witness-entitlements.txt"

          grep -Fq 'VCAM REFERENCE HOOK REACHABILITY PASS' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'runtime.start=PASS' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'hook-call-path=REACHED' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'target-symbol=RESOLVED' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'hook-install=DISABLED' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'frame-substitution=INACTIVE' "$EVIDENCE/witness-strings.txt"

          if grep -Ei 'AVFoundation|CoreMedia|CoreVideo|VideoToolbox|Photos' "$EVIDENCE/witness-linked-libraries.txt"; then
            echo "Witness linked camera/media framework."
            exit 1
          fi

          echo "HOOK_REACHABILITY_WITNESS=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "DYLIB_SIGNING=PASS"

      - name: Validate maintainer script and final freeze
        shell: bash
        run: |
          set -euo pipefail

          BASE=eb463efd7a01e9160b5acb0e3541f3e016f47015
          ROOT=build/reference-camera-hook-reachability-gate-001
          SCRIPT="$ROOT/extracted-final/DEBIAN/postinst"
          FINAL="$ROOT/final/VCAM-PRO-RootHide-Reference-Hook-Reachability-Gate-001.deb"

          test -f "$SCRIPT"
          cat "$SCRIPT" | tee "$ROOT/evidence/postinst.txt"

          if grep -Eqi 'killall|pkill|launchctl|ldrestart|sbreload|userspace|reboot|SpringBoard|mediaserverd|control\.plist|VCAMPro/Media|SharedControl|SharedMedia|select|enabled' "$SCRIPT"; then
            echo "Forbidden maintainer-script effect."
