name: VCAM PRO RootHide mediaserverd Load Proof 002 Remediation A

on:
  push:
    branches:
      - builder/roothide-mediaserverd-load-proof-002
    paths:
      - "proofs/mediaserverd_load_probe/**"
      - ".github/workflows/mediaserverd-load-probe-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stateful Darwin witness load proof
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact starting head ancestry and probe-only scope
        shell: bash
        run: |
          set -euo pipefail

          STARTING_HEAD=98d063af35cd7d50629b4442648f6416df50b0c0

          test "$(git merge-base "$STARTING_HEAD" HEAD)" = "$STARTING_HEAD"

          unexpected="$(
            git diff --name-only "$STARTING_HEAD"..HEAD |
              grep -Ev '^(proofs/mediaserverd_load_probe/|\.github/workflows/mediaserverd-load-probe-build\.yml$|docs/proofs/)' || true
          )"
          if [ -n "$unexpected" ]; then
            echo "Unexpected mutation outside Remediation A:"
            echo "$unexpected"
            exit 1
          fi

          test -z "$(git diff --name-only "$STARTING_HEAD"..HEAD -- src product)"

          test "$(git ls-remote https://github.com/martaxi-boss/MotionCam-iOS.git refs/heads/main | awk '{print $1}')" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-15-USB.git refs/heads/main | awk '{print $1}')" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-16-USB-4k.git refs/heads/main | awk '{print $1}')" = "cc20d787070c67565173d4a46c218e2549cecc93"

          echo "PRODUCTION_ARCHITECTURE_UNCHANGED=PASS"
          echo "FLOATING_CONTROL_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"
          echo "REFERENCE_REPOS_UNCHANGED=PASS"

      - name: Validate emitter, witness, filters and IPC boundary
        shell: bash
        run: |
          set -euo pipefail

          PROBE=proofs/mediaserverd_load_probe
          EMITTER="$PROBE/LoadProbe.c"
          WITNESS="$PROBE/LoadWitness.mm"
          STATE="$PROBE/DarwinProofState.h"

          grep -Fq '#define VCAM_PRO_LOAD_PROBE_VERSION "0.0.2~roothide2"' "$STATE"
          grep -Fq '"com.vcampro.probe.mediaserverd-load.002.roothide2"' "$STATE"
          grep -Fq 'VCAM_PRO_LOAD_PROBE_FRESHNESS_SECONDS 180U' "$STATE"
          grep -Fq 'vcam_pro_encode_load_state' "$STATE"
          grep -Fq 'vcam_pro_load_state_is_fresh' "$STATE"

          grep -Fq 'getprogname()' "$EMITTER"
          grep -Fq '"mediaserverd"' "$EMITTER"
          grep -Fq 'notify_register_check' "$EMITTER"
          grep -Fq 'notify_set_state' "$EMITTER"
          grep -Fq 'notify_post' "$EMITTER"
          grep -Fq 'notify_cancel' "$EMITTER"
          grep -Fq 'VCAM_PRO_LOAD_PROBE_NOTIFICATION' "$EMITTER"
          grep -Fq 'vcam_pro_encode_load_state' "$EMITTER"
          grep -Fq 'os_log_with_type' "$EMITTER"

          if grep -E '\b(mkdir|open|dprintf|fsync)\s*\(' "$EMITTER"; then
            echo "mediaserverd filesystem proof dependency remains."
            exit 1
          fi

          grep -Fq 'getprogname()' "$WITNESS"
          grep -Fq '"SpringBoard"' "$WITNESS"
          grep -Fq 'notify_register_dispatch' "$WITNESS"
          grep -Fq 'notify_get_state' "$WITNESS"
          grep -Fq 'VCAM_PRO_LOAD_PROBE_NOTIFICATION' "$WITNESS"
          grep -Fq 'vcam_pro_load_state_is_fresh' "$WITNESS"
          grep -Fq 'ValidateTokenState(token);' "$WITNESS"
          grep -Fq 'VCAM MEDIASERVERD LOAD PASS' "$WITNESS"
          grep -Fq 'constructor=PASS' "$WITNESS"
          grep -Fq 'process=mediaserverd' "$WITNESS"
          grep -Fq 'witness=SpringBoard' "$WITNESS"
          grep -Fq 'FindExistingSpringBoardWindow' "$WITNESS"
          grep -Fq '[window addSubview:banner]' "$WITNESS"
          grep -Fq 'kMaxPresentationAttempts = 60' "$WITNESS"
          grep -Fq 'kVisibleDurationNanoseconds' "$WITNESS"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          probe = Path("proofs/mediaserverd_load_probe")

          with (probe / "VCAMProLoadProbe.plist").open("rb") as f:
              emitter = plistlib.load(f)
          with (probe / "VCAMProLoadWitness.plist").open("rb") as f:
              witness = plistlib.load(f)

          expected_emitter = {"Filter": {"Executables": ["mediaserverd"]}}
          expected_witness = {"Filter": {"Executables": ["SpringBoard"]}}

          if emitter != expected_emitter:
              raise SystemExit(f"Unexpected emitter filter: {emitter!r}")
          if witness != expected_witness:
              raise SystemExit(f"Unexpected witness filter: {witness!r}")

          source = (probe / "LoadWitness.mm").read_text()
          registration = source.index("notify_register_dispatch")
          immediate_query = source.index("ValidateTokenState(token);", registration)
          live_callback = source.index("ValidateTokenState(", registration)
          if immediate_query <= registration:
              raise SystemExit("Immediate state query missing after registration")
          if live_callback < 0:
              raise SystemExit("Live notification callback missing")

          emitter_source = (probe / "LoadProbe.c").read_text()
          register = emitter_source.index("notify_register_check")
          set_state = emitter_source.index("notify_set_state", register)
          post = emitter_source.index("notify_post", set_state)
          retain = emitter_source.index("g_load_probe_state_token = token;", post)
          if not (register < set_state < post < retain):
              raise SystemExit("Emitter state publication/retention ordering invalid")
          if emitter_source.count("notify_cancel(token)") != 2:
              raise SystemExit("Emitter token must cancel only on the two notify failure paths")
          if "notify_cancel" in emitter_source[retain:]:
              raise SystemExit("Emitter cancels retained state token after successful publication")

          print("MEDIASERVERD_EMITTER_FILTER=PASS")
          print("SPRINGBOARD_WITNESS_FILTER=PASS")
          print("NO_BROAD_FILTER=PASS")
          print("STARTUP_ORDER_INDEPENDENT_PROOF=PASS")
          print("STARTUP_ORDER_STATE_RETAINED=PASS")
          PY

          if grep -RInE '%hook|MSHookFunction|MSHookMessageEx|method_exchangeImplementations|class_replaceMethod|class_addMethod|rebind_symbols|fishhook|AVCapture|CMSampleBuffer|CVPixelBuffer|VideoToolbox|IOSurface|ReadyFrameQueue|FramePipeline|ReferenceCameraHook|MediaserverdRuntime|CameraConsumerAdapter|frame replacement|frame substitution'               "$EMITTER" "$WITNESS" "$STATE"; then
            echo "Forbidden hook/camera/frame token found."
            exit 1
          fi

          if grep -RInE 'xpc_|mach_msg|CFMessagePort|socket[[:space:]]*\(|connect[[:space:]]*\(|send[[:space:]]*\(|recv[[:space:]]*\(|shm_open|mmap[[:space:]]*\('               "$EMITTER" "$WITNESS"; then
            echo "Forbidden IPC/network/shared-memory mechanism found."
            exit 1
          fi

          echo "PROCESS_GUARD=PASS"
          echo "STATEFUL_DARWIN_SIGNAL=PASS"
          echo "VERSIONED_SIGNAL=PASS"
          echo "FRESHNESS_VALIDATION=PASS"
          echo "STARTUP_ORDER_INDEPENDENT_PROOF=PASS"
          echo "WITNESS_PROCESS_GUARD=PASS"
          echo "WITNESS_VISIBLE_PROOF=PASS"
          echo "MEDIASERVERD_FILESYSTEM_PROOF_DEPENDENCY=REMOVED"
          echo "NO_HOOKS=PASS"
          echo "NO_CAMERA_APIS=PASS"
          echo "NO_FRAME_ACCESS=PASS"
          echo "NO_FRAME_SUBSTITUTION=PASS"

      - name: Run deterministic Darwin proof-state tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/roothide-mediaserverd-load-proof-002/evidence

          xcrun --sdk macosx clang++             -std=c++17             -Wall -Wextra -Werror -pedantic             -Iproofs/mediaserverd_load_probe             proofs/mediaserverd_load_probe/darwin_proof_state_tests.cpp             -o build/roothide-mediaserverd-load-proof-002/state-tests

          build/roothide-mediaserverd-load-proof-002/state-tests |
            tee build/roothide-mediaserverd-load-proof-002/evidence/state-tests.txt

          grep -q 'STATEFUL_DARWIN_SIGNAL=PASS' build/roothide-mediaserverd-load-proof-002/evidence/state-tests.txt
          grep -q 'VERSIONED_SIGNAL=PASS' build/roothide-mediaserverd-load-proof-002/evidence/state-tests.txt
          grep -q 'FRESHNESS_VALIDATION=PASS' build/roothide-mediaserverd-load-proof-002/evidence/state-tests.txt

      - name: Install RootHide packaging tools
        shell: bash
        run: |
          set -euo pipefail

          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus

          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          export PATH="$GNU_PATH:$PATH"
          echo "$GNU_PATH" >> "$GITHUB_PATH"

          command -v ldid
          dpkg-deb --version

      - name: Build arm64 rootless input package
        shell: bash
        run: |
          set -euo pipefail

          sh proofs/mediaserverd_load_probe/build_roothide_input.sh

          ROOT="build/roothide-mediaserverd-load-proof-002"
          INPUT_DEB="$ROOT/input/com.vcampro.loadprobe_0.0.2~roothide2_iphoneos-arm64.deb"
          EVIDENCE="$ROOT/evidence"

          test -f "$INPUT_DEB"
          mkdir -p "$EVIDENCE"

          test "$(dpkg-deb -f "$INPUT_DEB" Package)" = "com.vcampro.loadprobe"
          test "$(dpkg-deb -f "$INPUT_DEB" Version)" = "0.0.2~roothide2"
          test "$(dpkg-deb -f "$INPUT_DEB" Architecture)" = "iphoneos-arm64"

          dpkg-deb -f "$INPUT_DEB" | tee "$EVIDENCE/input-control.txt"
          dpkg-deb -c "$INPUT_DEB" | tee "$EVIDENCE/input-inventory.txt"

          for file in             VCAMProLoadProbe.dylib             VCAMProLoadProbe.plist             VCAMProLoadWitness.dylib             VCAMProLoadWitness.plist; do
            grep -Fq "./var/jb/usr/lib/TweakInject/$file" "$EVIDENCE/input-inventory.txt"
          done

      - name: Fetch pinned official RootHidePatcher
        shell: bash
        run: |
          set -euo pipefail

          PATCHER_SHA=80c16e08da33fecd27c0ff35777f37afd171868b
          ROOT="build/roothide-mediaserverd-load-proof-002"

          git clone --quiet https://github.com/roothide/RootHidePatcher.git "$ROOT/RootHidePatcher"
          git -C "$ROOT/RootHidePatcher" checkout --quiet "$PATCHER_SHA"
          test "$(git -C "$ROOT/RootHidePatcher" rev-parse HEAD)" = "$PATCHER_SHA"

          echo "ROOTHIDE_PATCHER_SHA=$PATCHER_SHA" |
            tee "$ROOT/evidence/roothide-patcher.txt"

      - name: Convert to final RootHide package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/build/roothide-mediaserverd-load-proof-002"
          INPUT_DEB="$ROOT/input/com.vcampro.loadprobe_0.0.2~roothide2_iphoneos-arm64.deb"
          FINAL_DIR="$ROOT/final"
          FINAL_DEB="$FINAL_DIR/VCAM-PRO-RootHide-Mediaserverd-Load-Proof-002-Remediation-A.deb"
          PATCHER="$ROOT/RootHidePatcher/patch.sh"

          mkdir -p "$FINAL_DIR"
          sudo env "PATH=$PATH" bash "$PATCHER" "$INPUT_DEB" "$FINAL_DEB"

          test -f "$FINAL_DEB"
          shasum -a 256 "$FINAL_DEB" | tee "$FINAL_DEB.sha256"

      - name: Inspect final package and separated filters
        shell: bash
        run: |
          set -euo pipefail

          ROOT="build/roothide-mediaserverd-load-proof-002"
          FINAL_DEB="$ROOT/final/VCAM-PRO-RootHide-Mediaserverd-Load-Proof-002-Remediation-A.deb"
          EVIDENCE="$ROOT/evidence"
          EXTRACTED="$ROOT/extracted-final"
          TWEAK="$EXTRACTED/usr/lib/TweakInject"

          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED" "$EVIDENCE"
          dpkg-deb -R "$FINAL_DEB" "$EXTRACTED"

          dpkg-deb -f "$FINAL_DEB" | tee "$EVIDENCE/final-control.txt"
          dpkg-deb -c "$FINAL_DEB" | tee "$EVIDENCE/final-inventory.txt"

          test "$(dpkg-deb -f "$FINAL_DEB" Package)" = "com.vcampro.loadprobe"
          test "$(dpkg-deb -f "$FINAL_DEB" Version)" = "0.0.2~roothide2"
          test "$(dpkg-deb -f "$FINAL_DEB" Architecture)" = "iphoneos-arm64e"
          test ! -e "$EXTRACTED/var/jb"

          for file in             VCAMProLoadProbe.dylib             VCAMProLoadProbe.plist             VCAMProLoadWitness.dylib             VCAMProLoadWitness.plist; do
            test -f "$TWEAK/$file"
          done

          FILES="$(
            dpkg-deb -c "$FINAL_DEB" |
              awk '$1 ~ /^-/ {print $6}' |
              sort
          )"
          EXPECTED="$(
            printf '%s\n'               './usr/lib/TweakInject/VCAMProLoadProbe.dylib'               './usr/lib/TweakInject/VCAMProLoadProbe.plist'               './usr/lib/TweakInject/VCAMProLoadWitness.dylib'               './usr/lib/TweakInject/VCAMProLoadWitness.plist' |
              sort
          )"
          test "$FILES" = "$EXPECTED"

          if grep -Fq './usr/lib/TweakInject/VCAMPro.dylib' "$EVIDENCE/final-inventory.txt"; then
            echo "Production VCAMPro.dylib is forbidden in the diagnostic package."
            exit 1
          fi

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = Path(
              "build/roothide-mediaserverd-load-proof-002/"
              "extracted-final/usr/lib/TweakInject"
          )

          with (root / "VCAMProLoadProbe.plist").open("rb") as f:
              emitter = plistlib.load(f)
          with (root / "VCAMProLoadWitness.plist").open("rb") as f:
              witness = plistlib.load(f)

          if emitter != {"Filter": {"Executables": ["mediaserverd"]}}:
              raise SystemExit(f"Unexpected final emitter filter: {emitter!r}")
          if witness != {"Filter": {"Executables": ["SpringBoard"]}}:
              raise SystemExit(f"Unexpected final witness filter: {witness!r}")

          print("MEDIASERVERD_EMITTER_FILTER=PASS")
          print("SPRINGBOARD_WITNESS_FILTER=PASS")
          print("NO_BROAD_FILTER=PASS")
          PY

          plutil -p "$TWEAK/VCAMProLoadProbe.plist" |
            tee "$EVIDENCE/final-emitter-filter.txt"
          plutil -p "$TWEAK/VCAMProLoadWitness.plist" |
            tee "$EVIDENCE/final-witness-filter.txt"

          echo "ROOTHIDE_PACKAGE_ARCH=PASS"
          echo "ELLEKIT_TWEAKINJECT_LAYOUT=PASS"

      - name: Inspect final emitter Mach-O
        shell: bash
        run: |
          set -euo pipefail

          ROOT="build/roothide-mediaserverd-load-proof-002"
          DYLIB="$ROOT/extracted-final/usr/lib/TweakInject/VCAMProLoadProbe.dylib"
          EVIDENCE="$ROOT/evidence"

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/emitter-arch.txt"
          grep -q 'arm64' "$EVIDENCE/emitter-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/emitter-arch.txt"; then
            echo "A9 emitter must contain arm64 code only."
            exit 1
          fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/emitter-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/emitter-install-name.txt"
          xcrun otool -L "$DYLIB" | tee "$EVIDENCE/emitter-linked-libraries.txt"
          xcrun nm -u "$DYLIB" | tee "$EVIDENCE/emitter-undefined.txt" || true
          strings "$DYLIB" | tee "$EVIDENCE/emitter-strings.txt" >/dev/null

          grep -q 'minos 15.0' "$EVIDENCE/emitter-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/emitter-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/emitter-load-commands.txt"
          grep -q '@loader_path/VCAMProLoadProbe.dylib' "$EVIDENCE/emitter-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/emitter-entitlements.txt"

          grep -Fq '0.0.2~roothide2' "$EVIDENCE/emitter-strings.txt"
          grep -Fq 'com.vcampro.probe.mediaserverd-load.002.roothide2' "$EVIDENCE/emitter-strings.txt"
          grep -Fq 'mediaserverd' "$EVIDENCE/emitter-strings.txt"
          grep -q 'notify_register_check' "$EVIDENCE/emitter-undefined.txt"
          grep -q 'notify_set_state' "$EVIDENCE/emitter-undefined.txt"
          grep -q 'notify_post' "$EVIDENCE/emitter-undefined.txt"
          grep -q 'notify_cancel' "$EVIDENCE/emitter-undefined.txt"

          if grep -Ei 'Foundation|UIKit|AVFoundation|CoreMedia|CoreVideo|VideoToolbox|Photos' "$EVIDENCE/emitter-linked-libraries.txt"; then
            echo "Emitter linked a forbidden UI/camera framework."
            exit 1
          fi

          if grep -E '(^|[[:space:]_])(mkdir|open|dprintf|fsync)([[:space:]]|$)' "$EVIDENCE/emitter-undefined.txt"; then
            echo "Emitter still has filesystem proof calls."
            exit 1
          fi

          if grep -Ei 'MSHookFunction|MSHookMessageEx|method_exchangeImplementations|rebind_symbols|AVCapture|CMSampleBuffer|CVPixelBuffer|VTDecompression|IOSurface|ReferenceCameraHook|MediaserverdRuntime|CameraConsumerAdapter'               "$EVIDENCE/emitter-strings.txt" "$EVIDENCE/emitter-undefined.txt"; then
            echo "Forbidden hook/camera/frame symbol found in emitter."
            exit 1
          fi

          echo "PROCESS_GUARD=PASS"
          echo "STATEFUL_DARWIN_SIGNAL=PASS"
          echo "VERSIONED_SIGNAL=PASS"
          echo "EMITTER_NO_UIKIT=PASS"
          echo "MEDIASERVERD_FILESYSTEM_PROOF_DEPENDENCY=REMOVED"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ROOTHIDE_RPATH=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"

      - name: Inspect final SpringBoard witness Mach-O
        shell: bash
        run: |
          set -euo pipefail

          ROOT="build/roothide-mediaserverd-load-proof-002"
          DYLIB="$ROOT/extracted-final/usr/lib/TweakInject/VCAMProLoadWitness.dylib"
          EVIDENCE="$ROOT/evidence"

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/witness-arch.txt"
          grep -q 'arm64' "$EVIDENCE/witness-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/witness-arch.txt"; then
            echo "A9 witness must contain arm64 code only."
            exit 1
          fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/witness-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/witness-install-name.txt"
          xcrun otool -L "$DYLIB" | tee "$EVIDENCE/witness-linked-libraries.txt"
          xcrun nm -u "$DYLIB" | tee "$EVIDENCE/witness-undefined.txt" || true
          strings "$DYLIB" | tee "$EVIDENCE/witness-strings.txt" >/dev/null

          grep -q 'minos 15.0' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/VCAMProLoadWitness.dylib' "$EVIDENCE/witness-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/witness-entitlements.txt"

          grep -Fq '0.0.2~roothide2' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'com.vcampro.probe.mediaserverd-load.002.roothide2' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'SpringBoard' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'VCAM MEDIASERVERD LOAD PASS' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'process=mediaserverd' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'constructor=PASS' "$EVIDENCE/witness-strings.txt"
          grep -q 'notify_register_dispatch' "$EVIDENCE/witness-undefined.txt"
          grep -q 'notify_get_state' "$EVIDENCE/witness-undefined.txt"

          if grep -Ei 'CoreGraphics|AVFoundation|CoreMedia|CoreVideo|VideoToolbox|Photos' "$EVIDENCE/witness-linked-libraries.txt"; then
            echo "Witness linked a framework outside the UIKit/Foundation proof boundary."
            exit 1
          fi

          if grep -Ei 'MSHookFunction|MSHookMessageEx|method_exchangeImplementations|rebind_symbols|AVCapture|CMSampleBuffer|CVPixelBuffer|VTDecompression|IOSurface|ReferenceCameraHook|MediaserverdRuntime|CameraConsumerAdapter'               "$EVIDENCE/witness-strings.txt" "$EVIDENCE/witness-undefined.txt"; then
            echo "Forbidden hook/camera/frame symbol found in witness."
            exit 1
          fi

          echo "WITNESS_PROCESS_GUARD=PASS"
          echo "WITNESS_VISIBLE_PROOF=PASS"
          echo "STARTUP_ORDER_INDEPENDENT_PROOF=PASS"
          echo "NO_CAMERA_FRAMEWORKS=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ROOTHIDE_RPATH=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"

      - name: Validate final RootHide-safe maintainer script
        shell: bash
        run: |
          set -euo pipefail

          ROOT="build/roothide-mediaserverd-load-proof-002"
          SCRIPT="$ROOT/extracted-final/DEBIAN/postinst"
          EVIDENCE="$ROOT/evidence"

          test -f "$SCRIPT"
          cat "$SCRIPT" | tee "$EVIDENCE/postinst.txt"

          grep -Eq 'rm -f (/rootfs)?/var/mobile/Library/VCAMProMediaserverdProbe/witness-proof\.txt \|\| true' "$SCRIPT"

          if grep -Eqi 'load-proof\.txt|killall|pkill|launchctl|ldrestart|sbreload|userspace|reboot|SpringBoard|sudo|NewTerm|password|rm[[:space:]]+-rf|SharedControl|VCAMPro/Media' "$SCRIPT"; then
            echo "Forbidden maintainer-script side effect found."
            exit 1
          fi

          echo "MAINTAINER_SCRIPTS_ROOTSAFE=PASS"

      - name: Final static acceptance
        shell: bash
        run: |
          set -euo pipefail

          STARTING_HEAD=98d063af35cd7d50629b4442648f6416df50b0c0
          ROOT="build/roothide-mediaserverd-load-proof-002"
          FINAL_DEB="$ROOT/final/VCAM-PRO-RootHide-Mediaserverd-Load-Proof-002-Remediation-A.deb"
          EVIDENCE="$ROOT/evidence"

          test -f "$FINAL_DEB"
          test -f "$FINAL_DEB.sha256"
          test -z "$(git diff --name-only "$STARTING_HEAD"..HEAD -- src product)"

          cat "$FINAL_DEB.sha256" | tee "$EVIDENCE/final-sha256.txt"
          git rev-parse HEAD | tee "$EVIDENCE/exact-head.txt"

          echo "PROCESS_GUARD=PASS"
          echo "STATEFUL_DARWIN_SIGNAL=PASS"
          echo "VERSIONED_SIGNAL=PASS"
          echo "FRESHNESS_VALIDATION=PASS"
          echo "STARTUP_ORDER_INDEPENDENT_PROOF=PASS"
          echo "WITNESS_PROCESS_GUARD=PASS"
          echo "WITNESS_VISIBLE_PROOF=PASS"
          echo "MEDIASERVERD_FILESYSTEM_PROOF_DEPENDENCY=REMOVED"
          echo "MEDIASERVERD_EMITTER_FILTER=PASS"
          echo "SPRINGBOARD_WITNESS_FILTER=PASS"
          echo "NO_BROAD_FILTER=PASS"
          echo "NO_HOOKS=PASS"
          echo "NO_CAMERA_APIS=PASS"
          echo "NO_FRAME_ACCESS=PASS"
          echo "NO_FRAME_SUBSTITUTION=PASS"
          echo "ROOTHIDE_PACKAGE_ARCH=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
