name: Frame Engine Stage B CI

on:
  push:
    branches:
      - builder/frame-engine-stage-b-001
    paths:
      - "src/media_engine/**"
      - "tests/media_engine/**"
      - "src/frame_engine/**"
      - "tests/frame_engine/**"
      - ".github/workflows/frame-engine-stage-b-ci.yml"
  pull_request:
    paths:
      - "src/media_engine/**"
      - "tests/media_engine/**"
      - "src/frame_engine/**"
      - "tests/frame_engine/**"
      - ".github/workflows/frame-engine-stage-b-ci.yml"

permissions:
  contents: read

jobs:
  stage-b:
    name: Stage B local-video-reader
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun clang++ --version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-path)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Source negative checks
        run: |
          set -euo pipefail

          stage_a_banned='AVAssetReader|AVCapture|VideoToolbox|VTDecompression|MSHookFunction|MSHookMessageEx|%hook|mediaserverd|socket|NSURLSession|UIImagePicker|CVPixelBufferPool'
          if grep -RInE "$stage_a_banned" src/frame_engine; then
            echo "Stage A source boundary regression."
            exit 1
          fi

          stage_b_banned='AVCapture|Photos|UIKit|VideoToolbox|VTDecompressionSession|VTPixelTransferSession|VTPixelRotationSession|MSHookFunction|MSHookMessageEx|%hook|mediaserverd|NSURLSession|(^|[^A-Za-z])socket([^A-Za-z]|$)|Network.framework|AVMediaTypeAudio|AVAssetReaderAudioMixOutput'
          if grep -RInE "$stage_b_banned" src/media_engine; then
            echo "Forbidden Stage B production token found."
            exit 1
          fi

          grep -q 'AVAssetReaderStatusCompleted' src/media_engine/LocalVideoReader.mm
          grep -q 'AVAssetReaderStatusFailed' src/media_engine/LocalVideoReader.mm
          grep -q 'AVAssetReaderStatusCancelled' src/media_engine/LocalVideoReader.mm
          grep -q 'presentationTimestamp = kCMTimeInvalid' src/media_engine/LocalVideoReader.mm

      - name: Build Stage A host regression
        run: |
          set -euo pipefail
          mkdir -p build/host
          xcrun --sdk macosx clang++             -std=c++17             -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             tests/frame_engine/frame_engine_stage_a_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/frame_engine_stage_a_tests

      - name: Run Stage A host regression
        run: |
          set -euo pipefail
          build/host/frame_engine_stage_a_tests | tee build/host/stage-a-test-summary.txt
          grep -q 'Tests run: 13, failures: 0' build/host/stage-a-test-summary.txt

      - name: Build Stage B host tests
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17             -fobjc-arc             -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             tests/media_engine/local_video_reader_stage_b_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/local_video_reader_stage_b_tests

      - name: Run Stage B host tests
        run: |
          set -euo pipefail
          build/host/local_video_reader_stage_b_tests | tee build/host/stage-b-test-summary.txt
          grep -q 'Stage B tests run: 10, failures: 0' build/host/stage-b-test-summary.txt

      - name: Compile iOS 15 arm64 production objects
        run: |
          set -euo pipefail
          mkdir -p build/ios
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"

          "$CXX"             -std=c++17             -arch arm64             -isysroot "$SDKROOT"             -miphoneos-version-min=15.0             -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine             -c src/frame_engine/PreparedFrame.cpp             -o build/ios/PreparedFrame.o

          "$CXX"             -std=c++17             -arch arm64             -isysroot "$SDKROOT"             -miphoneos-version-min=15.0             -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine             -c src/frame_engine/FrameEngineState.cpp             -o build/ios/FrameEngineState.o

          "$CXX"             -std=c++17             -fobjc-arc             -arch arm64             -isysroot "$SDKROOT"             -miphoneos-version-min=15.0             -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine             -Isrc/media_engine             -c src/media_engine/LocalVideoReader.mm             -o build/ios/LocalVideoReader.o

          xcrun libtool -static             -o build/ios/libVCAMFrameEngineStageB.a             build/ios/PreparedFrame.o             build/ios/FrameEngineState.o             build/ios/LocalVideoReader.o

      - name: Inspect iOS archive
        run: |
          set -euo pipefail

          file build/ios/PreparedFrame.o
          file build/ios/FrameEngineState.o
          file build/ios/LocalVideoReader.o
          file build/ios/libVCAMFrameEngineStageB.a

          xcrun lipo -info build/ios/libVCAMFrameEngineStageB.a
          xcrun otool -l build/ios/LocalVideoReader.o             | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'

          xcrun nm -u build/ios/libVCAMFrameEngineStageB.a             | tee build/ios/undefined-symbols.txt

          forbidden_symbols='AVCapture|PHPhoto|UIImage|VTDecompression|VTPixelTransfer|VTPixelRotation|MSHookFunction|MSHookMessageEx|NSURLSession|nw_|socket'
          if xcrun nm -u build/ios/libVCAMFrameEngineStageB.a               | grep -E "$forbidden_symbols"; then
            echo "Forbidden production symbol found."
            exit 1
          fi

          if ! xcrun nm -u build/ios/libVCAMFrameEngineStageB.a               | grep -q 'AVAssetReader'; then
            echo "Expected AVAssetReader symbol not found."
            exit 1
          fi

          if ! xcrun lipo -info build/ios/libVCAMFrameEngineStageB.a               | grep -q 'arm64'; then
            echo "arm64 archive proof failed."
            exit 1
          fi

          if xcrun lipo -info build/ios/libVCAMFrameEngineStageB.a               | grep -q 'arm64e'; then
            echo "arm64e must not be present."
            exit 1
          fi

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-frame-engine-stage-b-static
          path: |
            build/ios/libVCAMFrameEngineStageB.a
            build/ios/undefined-symbols.txt
            build/host/stage-a-test-summary.txt
            build/host/stage-b-test-summary.txt
          if-no-files-found: error
          retention-days: 14
