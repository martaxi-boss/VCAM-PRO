name: VCAM PRO Photo Multi Geometry Stability 001

on:
  push:
    branches:
      - builder/canonical-hook-continuation-001
    paths:
      - "src/product/MediaserverdRuntime.*"
      - "src/product/CameraConsumerAdapter.*"
      - "src/media_engine/InternalGalleryMediaSession.*"
      - "src/media_engine/FramePipelinePump*"
      - "src/media_engine/FrameTransformer.*"
      - "src/frame_engine/ReadyFrameQueue.*"
      - "tests/**"
      - "product/photo_multi_geometry_stability_001/**"
      - "docs/research/PHOTO_MULTI_GEOMETRY_STABILITY_001.md"
      - "docs/CANONICAL_PROJECT_STATE.md"
      - ".github/workflows/photo-multi-geometry-stability-001-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcampro-photo-multi-geometry-stability-001
  cancel-in-progress: true

jobs:
  pre-fix-reproduction:
    name: Historical pre-fix multi-geometry reproduction
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact pre-fix evidence head
        uses: actions/checkout@v4
        with:
          ref: 7fff0911feab0d754721ae5322256999cd7a5ac9
          fetch-depth: 0

      - name: Reproduce session churn and geometry aliasing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7fff0911feab0d754721ae5322256999cd7a5ac9"
          mkdir -p build/photo-multi-geometry-prefx

          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread \
            -Wno-deprecated-declarations -Wno-unused-function \
            -DVCAM_TESTING=1 \
            -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/FrameEngineState.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/frame_engine/FrameTimelineScheduler.cpp \
            src/frame_engine/MonotonicHostClock.cpp \
            src/media_engine/LocalVideoReader.mm \
            src/media_engine/LocalPhotoReader.mm \
            src/media_engine/FrameNormalizer.cpp \
            src/media_engine/FrameTransformer.mm \
            src/media_engine/FramePipelinePump.cpp \
            src/media_engine/FramePipelinePumpTimed.cpp \
            src/media_engine/ProducerWakeupController.cpp \
            src/media_engine/ProducerWakeupDriver.mm \
            src/media_engine/InternalGalleryMediaSession.mm \
            src/product/ControlStateCache.cpp \
            src/product/VirtualBlackFrame.mm \
            src/product/CameraConsumerAdapter.cpp \
            src/product/SharedControlStore.mm \
            src/product/SharedMediaStager.mm \
            src/product/ProductControlOwner.mm \
            src/product/MediaserverdRuntime.mm \
            tests/product/photo_multi_geometry_prefx_tests.mm \
            -framework Accelerate -framework Foundation -framework AVFoundation \
            -framework CoreFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework ImageIO \
            -o build/photo-multi-geometry-prefx/repro

          build/photo-multi-geometry-prefx/repro \
            | tee build/photo-multi-geometry-prefx/repro.txt

          for marker in \
            PRE_FIX_MULTI_GEOMETRY_REPRODUCED=PASS \
            PRE_FIX_SESSION_CHURN_REPRODUCED=PASS \
            PRE_FIX_REDECODE_REPRODUCED=PASS \
            PRE_FIX_GLOBAL_GEOMETRY_ALIASING_REPRODUCED=PASS; do
            grep -Fq "$marker" build/photo-multi-geometry-prefx/repro.txt
          done

      - name: Upload historical pre-fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: photo-multi-geometry-prefx-evidence
          path: build/photo-multi-geometry-prefx/repro.txt
          if-no-files-found: error
          retention-days: 14

  fixed-multi-geometry:
    name: Fixed photo multi-geometry product composition
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact-head and source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f66d0b271e6dc4bdec53cea8ac709dffc363e4fa HEAD

          test "$(git rev-parse HEAD:src/product/ReferenceCameraHook.mm)" = "b66050e4a04dd2d24d8a4f8e62e5ce8fd585d03b"
          test "$(git rev-parse HEAD:src/media_engine/LocalPhotoReader.mm)" = "3746777d17fd95fa757c7161dfe683af449a0bc6"
          test "$(git rev-parse HEAD:src/media_engine/LocalVideoReader.mm)" = "18519e18bb3d17e75a119aa4e82fe42f21471d46"
          test "$(git rev-parse HEAD:product/VCAMPro.plist)" = "97d481d36351e6ce2478cf36b7f064e167349ccc"

      - name: CameraConsumerAdapter bounded variant tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/photo-multi-geometry
          xcrun --sdk macosx clang++ \
            -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Isrc/frame_engine -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/product/ControlStateCache.cpp \
            src/product/CameraConsumerAdapter.cpp \
            tests/product/camera_consumer_adapter_tests.cpp \
            -framework CoreFoundation -framework CoreMedia -framework CoreVideo \
            -o build/photo-multi-geometry/camera-consumer

          build/photo-multi-geometry/camera-consumer \
            | tee build/photo-multi-geometry/camera-consumer.txt

          grep -Fq 'failures: 0' build/photo-multi-geometry/camera-consumer.txt
          grep -Fq '[PASS] static photo variants bounded and evict safely' build/photo-multi-geometry/camera-consumer.txt
          grep -Fq '[PASS] supported no-black uses in-place ownership guard' build/photo-multi-geometry/camera-consumer.txt

      - name: Real product A-B-A-B and range coverage
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread \
            -Wno-deprecated-declarations -Wno-unused-function \
            -DVCAM_TESTING=1 \
            -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/FrameEngineState.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/frame_engine/FrameTimelineScheduler.cpp \
            src/frame_engine/MonotonicHostClock.cpp \
            src/media_engine/LocalVideoReader.mm \
            src/media_engine/LocalPhotoReader.mm \
            src/media_engine/FrameNormalizer.cpp \
            src/media_engine/FrameTransformer.mm \
            src/media_engine/FramePipelinePump.cpp \
            src/media_engine/FramePipelinePumpTimed.cpp \
            src/media_engine/ProducerWakeupController.cpp \
            src/media_engine/ProducerWakeupDriver.mm \
            src/media_engine/InternalGalleryMediaSession.mm \
            src/product/ControlStateCache.cpp \
            src/product/VirtualBlackFrame.mm \
            src/product/CameraConsumerAdapter.cpp \
            src/product/SharedControlStore.mm \
            src/product/SharedMediaStager.mm \
            src/product/ProductControlOwner.mm \
            src/product/MediaserverdRuntime.mm \
            tests/product/photo_multi_geometry_stability_tests.mm \
            -framework Accelerate -framework Foundation -framework AVFoundation \
            -framework CoreFoundation -framework CoreGraphics -framework CoreMedia \
            -framework CoreVideo -framework ImageIO \
            -o build/photo-multi-geometry/stability

          build/photo-multi-geometry/stability \
            | tee build/photo-multi-geometry/stability.txt

          for marker in \
            PHOTO_A_VISIBLE=PASS \
            PHOTO_B_VISIBLE_AFTER_PREPARED=PASS \
            RETURN_TO_A_REMAINS_PHOTO=PASS \
            RETURN_TO_B_REMAINS_PHOTO=PASS \
            PHOTO_SOURCE_PERSISTS_ACROSS_GEOMETRIES=PASS \
            NO_SESSION_DESELECTION_ON_GEOMETRY_SWITCH=PASS \
            NO_REDECODE_ON_CACHED_GEOMETRY_RETURN=PASS \
            GEOMETRY_EVENT_IDENTITY_PRESERVED=PASS \
            NO_GLOBAL_GEOMETRY_ALIASING=PASS \
            PHOTO_VARIANT_CACHE_BOUNDED=PASS \
            PHOTO_VARIANT_EVICTION_SAFE=PASS \
            VCAM_ON_ORIGINAL_DECISIONS=ZERO \
            BLACK_USED_ONLY_WHILE_VARIANT_NOT_READY=PASS \
            PHOTO_LOGICAL_SESSION_CREATION_COUNT=1 \
            PHOTO_SOURCE_DECODE_COUNT=1 \
            PHOTO_VARIANT_CACHE_CAPACITY=4; do
            grep -Fq "$marker" build/photo-multi-geometry/stability.txt
          done

      - name: Static callback performance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("src/product/CameraConsumerAdapter.cpp").read_text()
          start = text.index("CameraDecision CameraConsumerAdapter::decide")
          end = text.index("CameraDecision\nCameraConsumerAdapter::\nblackOrEmergencyOriginal", start)
          callback = text[start:end]

          forbidden = [
              "AVAsset",
              "CGImageSource",
              "FrameTransformer",
              "CVPixelBufferCreate",
              "CVPixelBufferPoolCreate",
              "dispatch_sync",
              "sleep(",
              "wait(",
          ]
          found = [token for token in forbidden if token in callback]
          if found:
              raise SystemExit(f"Heavy callback work found: {found}")
          PY

          {
            echo "NO_CALLBACK_FILE_IO=PASS"
            echo "NO_CALLBACK_DECODE=PASS"
            echo "NO_CALLBACK_TRANSFORM=PASS"
            echo "NO_CALLBACK_VARIANT_ALLOCATION=PASS"
            echo "NO_CALLBACK_SYNCHRONOUS_WAIT=PASS"
          } | tee build/photo-multi-geometry/callback-contract.txt

      - name: Upload current multi-geometry evidence
        uses: actions/upload-artifact@v4
        with:
          name: photo-multi-geometry-current-evidence
          path: build/photo-multi-geometry/**
          if-no-files-found: error
          retention-days: 14


  terminal-regression-package:
    name: Exact-head full regression and RootHide candidate
    needs:
      - pre-fix-reproduction
      - fixed-multi-geometry
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout IOS-15-USB exact read-only reference
        uses: actions/checkout@v4
        with:
          repository: martaxi-boss/IOS-15-USB
          ref: a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d
          path: reference/IOS-15-USB
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout MotionCam exact read-only reference
        uses: actions/checkout@v4
        with:
          repository: martaxi-boss/MotionCam-iOS
          ref: 5ede3a1973a01cb13fe7f3ab562b47513feec1b1
          path: reference/MotionCam-iOS
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout IOS-16 optional read-only reference
        uses: actions/checkout@v4
        with:
          repository: martaxi-boss/IOS-16-USB-4k
          ref: cc20d787070c67565173d4a46c218e2549cecc93
          path: reference/IOS-16-USB-4k
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout RootHidePatcher exact pin
        uses: actions/checkout@v4
        with:
          repository: roothide/RootHidePatcher
          ref: 80c16e08da33fecd27c0ff35777f37afd171868b
          path: reference/RootHidePatcher
          persist-credentials: false
          fetch-depth: 1

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus
          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          echo "$GNU_PATH" >> "$GITHUB_PATH"
          mkdir -p build/photo-multi-geometry-terminal

      - name: Exact-head references and source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f66d0b271e6dc4bdec53cea8ac709dffc363e4fa HEAD

          test "$(git -C reference/IOS-15-USB rev-parse HEAD)" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git -C reference/MotionCam-iOS rev-parse HEAD)" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git -C reference/IOS-16-USB-4k rev-parse HEAD)" = "cc20d787070c67565173d4a46c218e2549cecc93"
          test "$(git -C reference/RootHidePatcher rev-parse HEAD)" = "80c16e08da33fecd27c0ff35777f37afd171868b"

          test "$(git rev-parse HEAD:src/product/ReferenceCameraHook.mm)" = "$(git rev-parse f66d0b271e6dc4bdec53cea8ac709dffc363e4fa:src/product/ReferenceCameraHook.mm)"
          test "$(git rev-parse HEAD:src/media_engine/LocalPhotoReader.mm)" = "$(git rev-parse f66d0b271e6dc4bdec53cea8ac709dffc363e4fa:src/media_engine/LocalPhotoReader.mm)"
          test "$(git rev-parse HEAD:src/media_engine/LocalVideoReader.mm)" = "$(git rev-parse f66d0b271e6dc4bdec53cea8ac709dffc363e4fa:src/media_engine/LocalVideoReader.mm)"
          test "$(git rev-parse HEAD:product/VCAMPro.plist)" = "$(git rev-parse f66d0b271e6dc4bdec53cea8ac709dffc363e4fa:product/VCAMPro.plist)"

          grep -R -m1 -F 'frameQueue' reference/IOS-15-USB >/dev/null
          grep -R -m1 -F 'lastObject' reference/IOS-15-USB >/dev/null
          grep -Fq 'StillImageKey' docs/research/IOS15_USB_STILL_CAPTURE_PARITY_001.md
          grep -Fq 'persistent latest virtual visual source' docs/research/PHOTO_MULTI_GEOMETRY_STABILITY_001.md

          grep -Fq 'UIImagePickerController' reference/MotionCam-iOS/Tweak.xm
          grep -Fq 'AVAssetReader' reference/MotionCam-iOS/MediaManager.m
          grep -Fq 'MOTIONCAM_RELEVANCE=NO_NEW_LOCAL_MEDIA_LIFECYCLE_DEFECT_ESTABLISHED' docs/research/PHOTO_MULTI_GEOMETRY_STABILITY_001.md

          {
            echo "PRE_FIX_MULTI_GEOMETRY_REPRODUCED=PASS"
            echo "IOS15_REFERENCE_INSPECTED=YES"
            echo "IOS15_PERSISTENT_VISUAL_SOURCE_SEMANTIC=PASS"
            echo "MOTIONCAM_RELEVANCE_LOCAL_MEDIA_ALREADY_PROVEN=PASS"
            echo "REFERENCE_CAMERA_HOOK_CHANGED=NO"
            echo "LOCAL_PHOTO_READER_CHANGED=NO"
            echo "LOCAL_VIDEO_READER_CHANGED=NO"
          } | tee build/photo-multi-geometry-terminal/reference-markers.txt

      - name: Frame Engine regression matrix
        shell: bash
        run: |
          set -euo pipefail
          cp tools/run_frame_regressions.sh build/photo-multi-geometry-terminal/run_frame_regressions.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/photo-multi-geometry-terminal/run_frame_regressions.sh")
          text = path.read_text()
          text = text.replace(
              "Stage E1 transformer tests run: 27, failures: 0",
              "Stage E1 transformer tests run: 29, failures: 0",
          )
          path.write_text(text)
          PY
          chmod +x build/photo-multi-geometry-terminal/run_frame_regressions.sh
          build/photo-multi-geometry-terminal/run_frame_regressions.sh

      - name: Internal Gallery PHOTO and VIDEO regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/internal_gallery_integration_tests.mm             -framework Accelerate -framework Foundation -framework AVFoundation             -framework CoreFoundation -framework CoreGraphics -framework CoreMedia             -framework CoreVideo -framework ImageIO             -o build/photo-multi-geometry-terminal/internal-gallery

          build/photo-multi-geometry-terminal/internal-gallery             | tee build/photo-multi-geometry-terminal/internal-gallery.txt
          grep -Fq 'failures: 0' build/photo-multi-geometry-terminal/internal-gallery.txt

      - name: Full product lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/VirtualBlackFrame.mm             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/full_product_integration_tests.mm             -framework Accelerate -framework Foundation -framework AVFoundation             -framework CoreFoundation -framework CoreGraphics -framework CoreMedia             -framework CoreVideo -framework ImageIO             -o build/photo-multi-geometry-terminal/full-product

          build/photo-multi-geometry-terminal/full-product             | tee build/photo-multi-geometry-terminal/full-product.txt
          grep -Fq 'failures: 0' build/photo-multi-geometry-terminal/full-product.txt

      - name: Existing E2E PHOTO VIDEO PAN PINCH regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations -Wno-unused-function             -DVCAM_TESTING=1             -DVCAM_REFERENCE_CAMERA_HOOK_OUTPUT_OWNERSHIP_TEST=1             -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/VirtualBlackFrame.mm             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             src/product/MediaserverdRuntime.mm             src/product/ReferenceCameraHook.mm             tests/product/product_composition_e2e_tests.mm             -framework Accelerate -framework Foundation -framework AVFoundation             -framework CoreFoundation -framework CoreGraphics -framework CoreMedia             -framework CoreVideo -framework ImageIO             -o build/photo-multi-geometry-terminal/product-composition

          build/photo-multi-geometry-terminal/product-composition             | tee build/photo-multi-geometry-terminal/product-composition.txt

          grep -Fq 'PHOTO_STATIC_SOURCE_PERSISTS=PASS' build/photo-multi-geometry-terminal/product-composition.txt
          grep -Fq 'PHOTO_TRANSFORM_PRODUCT_COMPOSITION=PASS' build/photo-multi-geometry-terminal/product-composition.txt
          grep -Fq 'VIDEO_PLAY_PAUSE_RESUME_LOOP=PASS' build/photo-multi-geometry-terminal/product-composition.txt

          {
            echo "OFF_REAL_REGRESSION=PASS"
            echo "ON_NO_MEDIA_BLACK_REGRESSION=PASS"
            echo "PHOTO_STATIC_REUSE_REGRESSION=PASS"
            echo "VIDEO_SEMANTICS_UNCHANGED=PASS"
            echo "PAN_REGRESSION=PASS"
            echo "PINCH_REGRESSION=PASS"
            echo "ROTATION_DISABLED=PASS"
          } | tee build/photo-multi-geometry-terminal/product-regression-markers.txt

      - name: Still ownership regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations -Wno-unused-function             -DVCAM_REFERENCE_CAMERA_HOOK_OUTPUT_OWNERSHIP_TEST=1             -Isrc/frame_engine -Isrc/product             src/product/ReferenceCameraHook.mm             tests/product/reference_camera_hook_output_ownership_tests.mm             -framework CoreFoundation -framework CoreMedia -framework CoreVideo             -o build/photo-multi-geometry-terminal/hook-ownership

          build/photo-multi-geometry-terminal/hook-ownership             | tee build/photo-multi-geometry-terminal/hook-ownership.txt
          grep -Fq 'failures: 0' build/photo-multi-geometry-terminal/hook-ownership.txt
          grep -Fq 'STILL_CAPTURE_VIRTUAL_OWNERSHIP=PASS' build/photo-multi-geometry-terminal/hook-ownership.txt
          grep -Fq 'FLASH_DOES_NOT_EXPOSE_ORIGINAL_CODE_PATH=PASS' build/photo-multi-geometry-terminal/hook-ownership.txt
          echo "STILL_OWNERSHIP_REGRESSION=PASS" | tee build/photo-multi-geometry-terminal/still-marker.txt

      - name: Re-run exact-head multi-geometry composition
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations -Wno-unused-function             -DVCAM_TESTING=1             -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/VirtualBlackFrame.mm             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             src/product/MediaserverdRuntime.mm             tests/product/photo_multi_geometry_stability_tests.mm             -framework Accelerate -framework Foundation -framework AVFoundation             -framework CoreFoundation -framework CoreGraphics -framework CoreMedia             -framework CoreVideo -framework ImageIO             -o build/photo-multi-geometry-terminal/stability

          build/photo-multi-geometry-terminal/stability             | tee build/photo-multi-geometry-terminal/stability.txt

          for marker in             GEOMETRY_EVENT_IDENTITY_PRESERVED=PASS             NO_GLOBAL_GEOMETRY_ALIASING=PASS             PHOTO_A_VISIBLE=PASS             PHOTO_B_VISIBLE_AFTER_PREPARED=PASS             RETURN_TO_A_REMAINS_PHOTO=PASS             RETURN_TO_B_REMAINS_PHOTO=PASS             PHOTO_SOURCE_PERSISTS_ACROSS_GEOMETRIES=PASS             NO_SESSION_DESELECTION_ON_GEOMETRY_SWITCH=PASS             NO_REDECODE_ON_CACHED_GEOMETRY_RETURN=PASS             PHOTO_VARIANT_CACHE_BOUNDED=PASS             PHOTO_VARIANT_EVICTION_SAFE=PASS             VCAM_ON_ORIGINAL_DECISIONS=ZERO             BLACK_USED_ONLY_WHILE_VARIANT_NOT_READY=PASS             PHOTO_LOGICAL_SESSION_CREATION_COUNT=1             PHOTO_SOURCE_DECODE_COUNT=1             PHOTO_VARIANT_CACHE_CAPACITY=4; do
            grep -Fq "$marker" build/photo-multi-geometry-terminal/stability.txt
          done

      - name: Static callback performance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("src/product/CameraConsumerAdapter.cpp").read_text()
          start = text.index("CameraDecision CameraConsumerAdapter::decide")
          end = text.index("CameraDecision\nCameraConsumerAdapter::\nblackOrEmergencyOriginal", start)
          callback = text[start:end]
          forbidden = [
              "AVAsset",
              "CGImageSource",
              "FrameTransformer",
              "CVPixelBufferCreate",
              "CVPixelBufferPoolCreate",
