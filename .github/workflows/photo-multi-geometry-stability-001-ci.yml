          FIXED="$(find build/photo-multi-geometry-terminal/fixed -type f -name 'stability.txt' | head -n 1)"
          test -n "$PRE"
          test -n "$FIXED"

          for marker in             PRE_FIX_MULTI_GEOMETRY_REPRODUCED=PASS             PRE_FIX_SESSION_CHURN_REPRODUCED=PASS             PRE_FIX_REDECODE_REPRODUCED=PASS             PRE_FIX_GLOBAL_GEOMETRY_ALIASING_REPRODUCED=PASS; do
