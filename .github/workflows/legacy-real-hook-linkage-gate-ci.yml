name: VCAM PRO Legacy-Equivalent Real Hook Linkage Gate 001

on:
  push:
    branches:
      - builder/legacy-real-hook-linkage-gate-001
    paths:
      - "product/legacy_real_hook_linkage_gate/**"
      - ".github/workflows/legacy-real-hook-linkage-gate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcampro-legacy-real-hook-linkage-gate-001
  cancel-in-progress: true

jobs:
  validate:
    name: Real production hook static linkage validation
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate inert real-hook analysis dylib
        shell: bash
        run: sh product/legacy_real_hook_linkage_gate/ci_build_and_validate.sh

      - name: Upload static linkage evidence
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-legacy-real-hook-linkage-gate-001
          path: |
            build/legacy-real-hook-linkage-gate-001/ios/VCAMProLegacyRealHookLinkageGate.dylib
            build/legacy-real-hook-linkage-gate-001/evidence/**
            build/legacy-real-hook-linkage-gate-001/roothide-final-layout-model/**
          if-no-files-found: error
          retention-days: 14
