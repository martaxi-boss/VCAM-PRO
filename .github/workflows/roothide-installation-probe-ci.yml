          if-no-files-found: error
          retention-days: 14
 "$EVIDENCE/final-inventory.txt"

          echo "ROOTHIDE_PACKAGE_ARCH=PASS"
          echo "PAYLOAD_MODES_OWNERSHIP=PASS"
