            exit 1
          fi

          if grep -RInE 'MediaserverdRuntime|ReferenceCameraHook|CameraConsumerAdapter|CMSampleBufferGetImageBuffer|MSHookFunction|CVPixelBuffer|mediaserverd' probes/roothide_installation_probe; then
            echo "Camera/runtime source reference found in diagnostic probe."
            exit 1
          fi

          echo "FINAL_PATCHED_PLIST_INSPECTED=PASS"
          echo "SPRINGBOARD_ONLY_FILTER=PASS"
          echo "NO_MEDIASERVERD_FILTER=PASS"
          echo "NO_REFERENCE_CAMERA_HOOK=PASS"
