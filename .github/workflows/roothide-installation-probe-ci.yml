          grep -q 'pid=%d' "$EVIDENCE/dylib-strings.txt"
          grep -q 'constructor=PASS' "$EVIDENCE/dylib-strings.txt"
          grep -q 'SpringBoard' "$EVIDENCE/dylib-strings.txt"
          grep -q 'getprogname' "$EVIDENCE/dylib-undefined.txt"
          grep -q 'UIAlertController' "$EVIDENCE/dylib-undefined.txt"

          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ROOTHIDE_RPATH=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"
          echo "SPRINGBOARD_PROCESS_GUARD=PASS"
          echo "PERSISTENT_CONSTRUCTOR_PROOF=PASS"
          echo "EXISTING_WINDOW_VISIBLE_PROOF=PASS"
          echo "SECOND_VISIBLE_FALLBACK=PASS"

