          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/dylib-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/dylib-load-commands.txt"

          if grep -q 'path /var/jb' "$EVIDENCE/dylib-load-commands.txt"; then
            echo "Fixed /var/jb RPATH remains."
            exit 1
          fi

          grep -q '@loader_path/VCAMRootHideProbe.dylib' "$EVIDENCE/dylib-install-name.txt"

