name: VCAM PRO Build Remediation A Safe Validation

on:
  push:
    branches:
      - validation/full-camera-build-remediation-a-001

permissions:
  contents: read

jobs:
  validate:
    name: Exact-head safe validation
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout immutable product target
        uses: actions/checkout@v4
        with:
          ref: 11ebb083280cd94813d570953fbfa4cadf033081
          fetch-depth: 0

      - name: Verify exact target and prepare evidence
        run: |
          set -euo pipefail
          mkdir -p build/validation build/validation-evidence
          test "$(git rev-parse HEAD)" = "11ebb083280cd94813d570953fbfa4cadf033081"
          echo "11ebb083280cd94813d570953fbfa4cadf033081" | tee build/validation-evidence/target-sha.txt
          sw_vers | tee build/validation-evidence/macos.txt
          xcodebuild -version | tee build/validation-evidence/xcode.txt
          xcrun clang++ --version | tee build/validation-evidence/clang.txt

      - name: Compile corrected SpringBoard UI source for iOS 15 arm64
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"
          COMMON="-std=c++17 -arch arm64 -isysroot $SDKROOT -miphoneos-version-min=15.0 -Wall -Wextra -Werror -Werror=unguarded-availability-new -pedantic -Wno-deprecated-declarations"
          printf '%s\n' "$CXX $COMMON -fobjc-arc -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product -c src/product/SpringBoardControlHost.mm -o build/validation/SpringBoardControlHost.o"             | tee build/validation-evidence/springboard-compiler-command.txt

          "$CXX" $COMMON -fobjc-arc             -Isrc/frame_engine             -Isrc/media_engine             -Isrc/control             -Isrc/product             -c src/product/SpringBoardControlHost.mm             -o build/validation/SpringBoardControlHost.o

          xcrun lipo -info build/validation/SpringBoardControlHost.o             | tee build/validation-evidence/springboard-architecture.txt
          grep -q 'arm64' build/validation-evidence/springboard-architecture.txt
          if grep -q 'arm64e' build/validation-evidence/springboard-architecture.txt; then
            exit 1
          fi

          xcrun otool -l build/validation/SpringBoardControlHost.o             | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'             | tee build/validation-evidence/springboard-minos.txt
          grep -q 'minos 15.0' build/validation-evidence/springboard-minos.txt

          echo "SPRINGBOARD_UI_IOS15_ARM64_COMPILE=PASS"             | tee build/validation-evidence/springboard-result.txt

      - name: Frame Engine A through F2 regressions
        run: |
          set -euo pipefail
          tools/run_frame_regressions.sh
          mkdir -p build/validation-evidence/frame-regressions
          cp build/regressions/*.txt build/validation-evidence/frame-regressions/
          echo "FRAME_ENGINE_A_TO_F2_REGRESSIONS=PASS"             | tee build/validation-evidence/frame-engine-result.txt

      - name: Internal Gallery 20-case host regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/internal_gallery_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/validation/internal-gallery

          build/validation/internal-gallery             | tee build/validation-evidence/internal-gallery.txt
          grep -q 'Internal gallery tests run: 20, failures: 0'             build/validation-evidence/internal-gallery.txt

      - name: Camera Consumer Adapter host tests
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             tests/product/camera_consumer_adapter_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/validation/camera-consumer

          build/validation/camera-consumer             | tee build/validation-evidence/camera-consumer.txt
          grep -q 'Camera consumer tests run: 13, failures: 0'             build/validation-evidence/camera-consumer.txt

      - name: Full Product Integration host tests
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/full_product_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/validation/full-product

          build/validation/full-product             | tee build/validation-evidence/full-product.txt
          grep -q 'Product integration tests run: 8, failures: 0'             build/validation-evidence/full-product.txt

      - name: Login bypass OBS and network negative boundaries
        run: |
          set -euo pipefail

          auth_forbidden='VCam Login|Client Login|VCAM ACCOUNT|/api/login|vcampro\.online|auth_token|logged_in|bypass_active|license bypass|fake authentication'
          if grep -RInEi "$auth_forbidden" src product/VCAMPro.plist product/package; then
            echo "Forbidden login/auth/bypass production concept found."
            exit 1
          fi

          network_forbidden='GET /vcam\.mjpg|obs-websocket|NSURLSession|Network\.framework|CFNetwork|NWConnection|nw_connection|MJPEG|portal API'
          if grep -RInEi "$network_forbidden" src product/VCAMPro.plist product/package; then
            echo "Forbidden network/OBS production dependency found."
            exit 1
          fi

          if grep -RInE '(^|[^A-Za-z])OBS([^A-Za-z]|$)' src product/VCAMPro.plist product/package; then
            echo "Forbidden OBS production dependency found."
            exit 1
          fi

          if grep -RInE '(^|[^A-Za-z])socket[[:space:]]*\(|\bnw_[A-Za-z0-9_]+' src/product src/control; then
            echo "Network socket API found."
            exit 1
          fi

          echo "LOGIN_LAYER=ABSENT" | tee build/validation-evidence/boundaries.txt
          echo "LOGIN_BYPASS=ABSENT" | tee -a build/validation-evidence/boundaries.txt
          echo "OBS_DEPENDENCY=ABSENT" | tee -a build/validation-evidence/boundaries.txt
          echo "NETWORK_MEDIA_FEED=ABSENT" | tee -a build/validation-evidence/boundaries.txt

      - name: Prohibited production outputs remain absent
        run: |
          set -euo pipefail
          test ! -e build/full-camera-gallery/ios/VCAMPro.dylib
          test "$(find . -type f -name 'com.vcampro.camera_0.1.0_iphoneos-arm64.deb' | wc -l | tr -d ' ')" -eq 0
          echo "PRODUCTION_DYLIB_BUILT=NO" | tee build/validation-evidence/prohibited-outputs.txt
          echo "DEB_BUILT=NO" | tee -a build/validation-evidence/prohibited-outputs.txt
          echo "DEVICE_ACTION=NO" | tee -a build/validation-evidence/prohibited-outputs.txt
          echo "MERGE_PERFORMED=NO" | tee -a build/validation-evidence/prohibited-outputs.txt

      - name: Upload text-only validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-camera-build-remediation-a-safe-validation
          path: |
            build/validation-evidence/**
          if-no-files-found: error
          retention-days: 14
