name: VCAM PRO RootHide mediaserverd Production Runtime Gate 001

on:
  push:
    branches:
      - builder/roothide-mediaserverd-runtime-gate-001
    paths:
      - "product/runtime_gate/**"
      - ".github/workflows/roothide-mediaserverd-runtime-gate-001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Production runtime start gate
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base, frozen evidence and mutation lock
        shell: bash
        run: |
          set -euo pipefail

          BASE=de81ab56cc8393961753226515d760fdf7f5ab93
          LOAD_PROBE=78b88bb36094ae1d0b4f6369e4d6ff03e9df9e67
          PR19_HEAD=2475bd51953b536c32d12e37475fd32eaf7c4a67

          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/builder/roothide-mediaserverd-load-proof-002 | awk '{print $1}')" = "$LOAD_PROBE"
          test "$(git ls-remote origin refs/heads/builder/shared-media-root-containment-hardening-001 | awk '{print $1}')" = "$PR19_HEAD"

          changed="$(git diff --name-only "$BASE"..HEAD)"
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              product/runtime_gate/*|.github/workflows/roothide-mediaserverd-runtime-gate-001.yml)
                ;;
              *)
                echo "Unauthorized changed file: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"

          git diff --quiet "$BASE"..HEAD -- src
          git diff --quiet "$BASE"..HEAD --             product/VCAMPro.RootHideIntegration.plist             product/build_roothide_integration_input.sh             product/roothide_integration

          test "$(git ls-remote https://github.com/martaxi-boss/MotionCam-iOS.git refs/heads/main | awk '{print $1}')" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-15-USB.git refs/heads/main | awk '{print $1}')" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-16-USB-4k.git refs/heads/main | awk '{print $1}')" = "cc20d787070c67565173d4a46c218e2549cecc93"

          echo "ROOT_HIDE_PACKAGING_UNCHANGED=PASS"
          echo "SPRINGBOARD_CONTROL_UNCHANGED=PASS"
          echo "FLOATING_CONTROL_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "SHARED_CONTROL_SEMANTICS_UNCHANGED=PASS"
          echo "SHARED_MEDIA_SEMANTICS_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"
          echo "PR19_MODIFIED=NO"
          echo "LOAD_PROBE_BRANCH_MODIFIED=NO"
          echo "REFERENCE_REPOS_MODIFIED=NO"

      - name: Validate runtime gate source architecture
        shell: bash
        run: |
          set -euo pipefail

          GATE=product/runtime_gate
          BUILD="$GATE/build_runtime_gate_input.sh"
          STUB="$GATE/ReferenceCameraHookRuntimeGateStub.mm"
          STATE="$GATE/RuntimeGateProofState.h"
          WITNESS="$GATE/RuntimeGateWitness.mm"

          grep -Fq 'src/product/VCAMProEntry.mm' "$BUILD"
          grep -Fq 'src/product/MediaserverdRuntime.mm' "$BUILD"
          grep -Fq 'src/product/CameraConsumerAdapter.cpp' "$BUILD"
          grep -Fq 'src/product/ControlStateCache.cpp' "$BUILD"
          grep -Fq 'src/product/SharedControlStore.mm' "$BUILD"
          grep -Fq 'src/product/SharedMediaStager.mm' "$BUILD"
          grep -Fq 'product/runtime_gate/ReferenceCameraHookRuntimeGateStub.mm' "$BUILD"

          if grep -Fq 'src/product/ReferenceCameraHook.mm' "$BUILD"; then
            echo "Real ReferenceCameraHook must not be compiled."
            exit 1
          fi
          if grep -Fq 'CydiaSubstrate' "$BUILD"; then
            echo "Runtime gate must not link CydiaSubstrate."
            exit 1
          fi

          grep -Fq 'ProcessIs("mediaserverd")' src/product/VCAMProEntry.mm
          grep -Fq 'runtime.start()' src/product/VCAMProEntry.mm
          grep -Fq 'InstallReferenceCameraHook()' src/product/VCAMProEntry.mm

          python3 - <<'PY'
          from pathlib import Path
          src = Path("src/product/VCAMProEntry.mm").read_text()
          start = src.index("if (runtime.start())")
          install = src.index("InstallReferenceCameraHook()", start)
          if install <= start:
              raise SystemExit("Runtime start must dominate gate-stub call")
          print("RUNTIME_START_FAIL_OPEN=PASS")
          PY

          grep -Fq 'bool InstallReferenceCameraHook()' "$STUB"
          grep -Fq 'PublishRuntimeStartProof();' "$STUB"
          grep -Fq 'return false;' "$STUB"
          grep -Fq '"mediaserverd"' "$STUB"
          grep -Fq 'notify_register_check' "$STUB"
          grep -Fq 'notify_set_state' "$STUB"
          grep -Fq 'notify_post' "$STUB"
          grep -Fq 'runtime.start=PASS' "$STUB"
          grep -Fq 'reference-hook=DISABLED' "$STUB"
          grep -Fq 'frame-substitution=INACTIVE' "$STUB"

          if grep -E 'MSHookFunction|CMSampleBuffer|CVPixelBuffer|AVCapture|IOSurface|observeRealCameraBuffer|decideCameraBuffer|HookedCMSampleBufferGetImageBuffer' "$STUB"; then
            echo "Camera/frame interception leaked into gate stub."
            exit 1
          fi

          grep -Fq '"com.vcampro.gate.mediaserverd-runtime.001"' "$STATE"
          grep -Fq '"0.1.0+roothide4~runtimegate1"' "$STATE"
          grep -Fq 'VCAM_RUNTIME_GATE_FLAG_RUNTIME_START_PASS' "$STATE"
          grep -Fq 'VCAM_RUNTIME_GATE_FLAG_REFERENCE_HOOK_DISABLED' "$STATE"
          grep -Fq 'VCAM_RUNTIME_GATE_FRESHNESS_SECONDS 180U' "$STATE"

          grep -Fq '"SpringBoard"' "$WITNESS"
          grep -Fq 'notify_register_dispatch' "$WITNESS"
          grep -Fq 'notify_get_state' "$WITNESS"
          grep -Fq 'ValidateTokenState(token);' "$WITNESS"
          grep -Fq 'VCAM MEDIASERVERD RUNTIME PASS' "$WITNESS"
          grep -Fq 'runtime.start=PASS' "$WITNESS"
          grep -Fq 'reference-hook=DISABLED' "$WITNESS"
          grep -Fq 'frame-substitution=INACTIVE' "$WITNESS"
          grep -Fq 'dispatch_get_main_queue()' "$WITNESS"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          gate = Path("product/runtime_gate")
          with (gate / "VCAMPro.RuntimeGate.plist").open("rb") as f:
              product = plistlib.load(f)
          with (gate / "VCAMProRuntimeWitness.plist").open("rb") as f:
              witness = plistlib.load(f)

          if product != {"Filter": {"Executables": ["SpringBoard", "mediaserverd"]}}:
              raise SystemExit(f"Unexpected runtime gate filter: {product!r}")
          if witness != {"Filter": {"Executables": ["SpringBoard"]}}:
              raise SystemExit(f"Unexpected witness filter: {witness!r}")

          source = (gate / "RuntimeGateWitness.mm").read_text()
          reg = source.index("notify_register_dispatch")
          immediate = source.index("ValidateTokenState(token);", reg)
          callback = source.index("ValidateTokenState(", reg)
          if immediate <= reg or callback < 0:
              raise SystemExit("Startup-order independent witness missing")

          entry = Path("src/product/VCAMProEntry.mm").read_text()
          if "runtime.start()" not in entry or "InstallReferenceCameraHook()" not in entry:
              raise SystemExit("Production entry flow missing")

          print("EXACT_RUNTIME_GATE_FILTER=PASS")
          print("RUNTIME_START_PROOF_CHANNEL=PASS")
          print("RUNTIME_WITNESS_PROCESS_GUARD=PASS")
          print("RUNTIME_WITNESS_VISIBLE_PROOF=PASS")
          PY

          real_calls="$(grep -RIl 'runtime\.observeRealCameraBuffer' src/product || true)"
          test "$real_calls" = "src/product/ReferenceCameraHook.mm"
          decision_calls="$(grep -RIl 'runtime\.decideCameraBuffer' src/product || true)"
          test "$decision_calls" = "src/product/ReferenceCameraHook.mm"

          if grep -RInE 'observeRealCameraBuffer|decideCameraBuffer|CMSampleBufferGetImageBuffer|MSHookFunction|HookedCMSampleBufferGetImageBuffer' product/runtime_gate; then
            echo "Gate harness introduced camera/frame callsite."
            exit 1
          fi

          echo "PRODUCTION_MEDIASERVERD_RUNTIME_COMPILED=PASS"
          echo "PRODUCTION_VCAM_ENTRY_COMPILED=PASS"
          echo "REAL_REFERENCE_CAMERA_HOOK_OMITTED=PASS"
          echo "MSHOOKFUNCTION_ABSENT=PASS"
          echo "CAMERA_INTERCEPTION_INACTIVE=PASS"
          echo "REAL_CAMERA_BUFFER_OBSERVATION_INACTIVE=PASS"
          echo "FRAME_SUBSTITUTION_INACTIVE=PASS"

      - name: Run deterministic runtime-gate state tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/runtime-gate-state
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Iproduct/runtime_gate             product/runtime_gate/runtime_gate_state_tests.cpp             -o build/runtime-gate-state/tests
          build/runtime-gate-state/tests | tee build/runtime-gate-state/results.txt
          grep -q 'RUNTIME_START_PROOF_CHANNEL=PASS' build/runtime-gate-state/results.txt
          grep -q 'RUNTIME_START_PASS_FLAG=PASS' build/runtime-gate-state/results.txt
          grep -q 'REFERENCE_HOOK_DISABLED_FLAG=PASS' build/runtime-gate-state/results.txt
          grep -q 'FRESHNESS_VALIDATION=PASS' build/runtime-gate-state/results.txt

      - name: Run accepted production regression suites
        shell: bash
        run: |
          set -euo pipefail
          sh product/runtime_gate/run_required_regressions.sh

      - name: Install RootHide packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus
          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          export PATH="$GNU_PATH:$PATH"
          echo "$GNU_PATH" >> "$GITHUB_PATH"
          command -v ldid
          dpkg-deb --version

      - name: Build arm64 runtime-gate input package
        shell: bash
        run: |
          set -euo pipefail
          sh product/runtime_gate/build_runtime_gate_input.sh

          ROOT=build/roothide-mediaserverd-runtime-gate-001
          INPUT="$ROOT/input/com.vcampro.camera_0.1.0+roothide4~runtimegate1_iphoneos-arm64.deb"
          mkdir -p "$ROOT/evidence"
          test -f "$INPUT"
          test "$(dpkg-deb -f "$INPUT" Package)" = "com.vcampro.camera"
          test "$(dpkg-deb -f "$INPUT" Version)" = "0.1.0+roothide4~runtimegate1"
          test "$(dpkg-deb -f "$INPUT" Architecture)" = "iphoneos-arm64"
          dpkg-deb -f "$INPUT" | tee "$ROOT/evidence/input-control.txt"
          dpkg-deb -c "$INPUT" | tee "$ROOT/evidence/input-inventory.txt"

      - name: Fetch pinned official RootHidePatcher
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/roothide-mediaserverd-runtime-gate-001"
          PATCHER_SHA=80c16e08da33fecd27c0ff35777f37afd171868b
          git clone --quiet https://github.com/roothide/RootHidePatcher.git "$ROOT/RootHidePatcher"
          git -C "$ROOT/RootHidePatcher" checkout --quiet "$PATCHER_SHA"
          test "$(git -C "$ROOT/RootHidePatcher" rev-parse HEAD)" = "$PATCHER_SHA"
          echo "ROOTHIDE_PATCHER_SHA=$PATCHER_SHA" | tee "$ROOT/evidence/roothide-patcher.txt"

      - name: Convert to final RootHide runtime-gate package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/build/roothide-mediaserverd-runtime-gate-001"
          INPUT="$ROOT/input/com.vcampro.camera_0.1.0+roothide4~runtimegate1_iphoneos-arm64.deb"
          FINAL_DIR="$ROOT/final"
          FINAL="$FINAL_DIR/VCAM-PRO-RootHide-Mediaserverd-Runtime-Gate-001.deb"
          mkdir -p "$FINAL_DIR"
          sudo env "PATH=$PATH" bash "$ROOT/RootHidePatcher/patch.sh" "$INPUT" "$FINAL"
          test -f "$FINAL"
          shasum -a 256 "$FINAL" | tee "$FINAL.sha256"

      - name: Inspect final package and filters
        shell: bash
        run: |
          set -euo pipefail

          ROOT=build/roothide-mediaserverd-runtime-gate-001
          FINAL="$ROOT/final/VCAM-PRO-RootHide-Mediaserverd-Runtime-Gate-001.deb"
          EXTRACTED="$ROOT/extracted-final"
          EVIDENCE="$ROOT/evidence"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED" "$EVIDENCE"
          dpkg-deb -R "$FINAL" "$EXTRACTED"

          test "$(dpkg-deb -f "$FINAL" Package)" = "com.vcampro.camera"
          test "$(dpkg-deb -f "$FINAL" Version)" = "0.1.0+roothide4~runtimegate1"
          test "$(dpkg-deb -f "$FINAL" Architecture)" = "iphoneos-arm64e"

          dpkg-deb -f "$FINAL" | tee "$EVIDENCE/final-control.txt"
          dpkg-deb -c "$FINAL" | tee "$EVIDENCE/final-inventory.txt"

          TWEAK="$EXTRACTED/usr/lib/TweakInject"
          for file in VCAMPro.dylib VCAMPro.plist VCAMProRuntimeWitness.dylib VCAMProRuntimeWitness.plist; do
            test -f "$TWEAK/$file"
          done

          FILES="$(dpkg-deb -c "$FINAL" | awk '$1 ~ /^-/ {print $6}' | sort)"
          EXPECTED="$(printf '%s\n'             './usr/lib/TweakInject/VCAMPro.dylib'             './usr/lib/TweakInject/VCAMPro.plist'             './usr/lib/TweakInject/VCAMProRuntimeWitness.dylib'             './usr/lib/TweakInject/VCAMProRuntimeWitness.plist' | sort)"
          test "$FILES" = "$EXPECTED"

          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("build/roothide-mediaserverd-runtime-gate-001/extracted-final/usr/lib/TweakInject")
          with (root / "VCAMPro.plist").open("rb") as f:
              product = plistlib.load(f)
          with (root / "VCAMProRuntimeWitness.plist").open("rb") as f:
              witness = plistlib.load(f)
          if product != {"Filter": {"Executables": ["SpringBoard", "mediaserverd"]}}:
              raise SystemExit(f"Unexpected final product filter: {product!r}")
          if witness != {"Filter": {"Executables": ["SpringBoard"]}}:
              raise SystemExit(f"Unexpected final witness filter: {witness!r}")
          print("EXACT_RUNTIME_GATE_FILTER=PASS")
          PY

          if find "$EXTRACTED" -type f | grep -E 'com\.vcampro\.control\.plist|/VCAMPro/Media/'; then
            echo "Runtime-gate package must not mutate control/media state."
            exit 1
          fi

          SCRIPT="$EXTRACTED/DEBIAN/postinst"
          test -f "$SCRIPT"
          cat "$SCRIPT" | tee "$EVIDENCE/postinst.txt"
          if grep -Eqi 'killall|pkill|launchctl|ldrestart|sbreload|reboot|userspace|SpringBoard|mediaserverd|SharedControl|control\.plist|VCAMPro/Media|selected media|enable VCAM|sudo|NewTerm|password' "$SCRIPT"; then
            echo "Forbidden maintainer-script side effect."
            exit 1
          fi

          echo "ROOTHIDE_PACKAGE_ARCH=PASS"
          echo "ELLEKIT_TWEAKINJECT_LAYOUT=PASS"
          echo "MAINTAINER_SCRIPTS_ROOTSAFE=PASS"
          echo "CONTROL_STATE_UNTOUCHED=PASS"
          echo "SHARED_MEDIA_STATE_UNTOUCHED=PASS"

      - name: Audit final VCAMPro production gate dylib
        shell: bash
        run: |
          set -euo pipefail

          ROOT=build/roothide-mediaserverd-runtime-gate-001
          DYLIB="$ROOT/extracted-final/usr/lib/TweakInject/VCAMPro.dylib"
          EVIDENCE="$ROOT/evidence"

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/product-arch.txt"
          grep -q 'architecture: arm64' "$EVIDENCE/product-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/product-arch.txt"; then
            echo "A9 product gate must be arm64 only."
            exit 1
          fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/product-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/product-install-name.txt"
          xcrun otool -L "$DYLIB" | tee "$EVIDENCE/product-linked-libraries.txt"
          xcrun nm -a "$DYLIB" | c++filt | tee "$EVIDENCE/product-symbols.txt" >/dev/null
          xcrun nm -u "$DYLIB" | tee "$EVIDENCE/product-undefined.txt" || true
          strings "$DYLIB" | tee "$EVIDENCE/product-strings.txt" >/dev/null

          grep -q 'minos 15.0' "$EVIDENCE/product-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/product-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/product-load-commands.txt"
          grep -q '@loader_path/VCAMPro.dylib' "$EVIDENCE/product-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/product-entitlements.txt"

          grep -q 'MediaserverdRuntime::start()' "$EVIDENCE/product-symbols.txt"
          grep -q 'VCAMProInitialize' "$EVIDENCE/product-symbols.txt"
          grep -Fq 'com.vcampro.mediaserverd.control' "$EVIDENCE/product-strings.txt"
          grep -Fq 'com.vcampro.gate.mediaserverd-runtime.001' "$EVIDENCE/product-strings.txt"
          grep -Fq 'runtime.start=PASS' "$EVIDENCE/product-strings.txt"
          grep -Fq 'reference-hook=DISABLED' "$EVIDENCE/product-strings.txt"
          grep -Fq 'frame-substitution=INACTIVE' "$EVIDENCE/product-strings.txt"

          if grep -E 'MSHookFunction|CMSampleBufferGetImageBuffer|HookedCMSampleBufferGetImageBuffer|\[VCAM PRO\] Hooking CMSampleBufferGetImageBuffer'               "$EVIDENCE/product-symbols.txt" "$EVIDENCE/product-undefined.txt" "$EVIDENCE/product-strings.txt"; then
            echo "Real ReferenceCameraHook leaked into final product gate."
            exit 1
          fi

          if grep -Fq 'CydiaSubstrate.framework' "$EVIDENCE/product-linked-libraries.txt"; then
            echo "Runtime gate unexpectedly links CydiaSubstrate."
            exit 1
          fi

          echo "PRODUCTION_MEDIASERVERD_RUNTIME_COMPILED=PASS"
          echo "PRODUCTION_VCAM_ENTRY_COMPILED=PASS"
          echo "REAL_REFERENCE_CAMERA_HOOK_OMITTED=PASS"
          echo "MSHOOKFUNCTION_ABSENT=PASS"
          echo "CAMERA_INTERCEPTION_INACTIVE=PASS"
          echo "REAL_CAMERA_BUFFER_OBSERVATION_INACTIVE=PASS"
          echo "FRAME_SUBSTITUTION_INACTIVE=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ROOTHIDE_RPATH=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"

      - name: Audit final SpringBoard runtime witness
        shell: bash
        run: |
          set -euo pipefail

          ROOT=build/roothide-mediaserverd-runtime-gate-001
          DYLIB="$ROOT/extracted-final/usr/lib/TweakInject/VCAMProRuntimeWitness.dylib"
          EVIDENCE="$ROOT/evidence"

          xcrun lipo -info "$DYLIB" | tee "$EVIDENCE/witness-arch.txt"
          grep -q 'architecture: arm64' "$EVIDENCE/witness-arch.txt"
          if grep -q 'arm64e' "$EVIDENCE/witness-arch.txt"; then
            exit 1
          fi

          xcrun otool -l "$DYLIB" > "$EVIDENCE/witness-load-commands.txt"
          xcrun otool -D "$DYLIB" > "$EVIDENCE/witness-install-name.txt"
          xcrun otool -L "$DYLIB" | tee "$EVIDENCE/witness-linked-libraries.txt"
          xcrun nm -u "$DYLIB" | tee "$EVIDENCE/witness-undefined.txt" || true
          strings "$DYLIB" | tee "$EVIDENCE/witness-strings.txt" >/dev/null

          grep -q 'minos 15.0' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/.jbroot/Library/Frameworks' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/.jbroot/usr/lib' "$EVIDENCE/witness-load-commands.txt"
          grep -q '@loader_path/VCAMProRuntimeWitness.dylib' "$EVIDENCE/witness-install-name.txt"
          xcrun otool -l "$DYLIB" | grep -q 'LC_CODE_SIGNATURE'
          ldid -e "$DYLIB" > "$EVIDENCE/witness-entitlements.txt"

          grep -Fq 'com.vcampro.gate.mediaserverd-runtime.001' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'VCAM MEDIASERVERD RUNTIME PASS' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'runtime.start=PASS' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'reference-hook=DISABLED' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'frame-substitution=INACTIVE' "$EVIDENCE/witness-strings.txt"
          grep -Fq 'SpringBoard' "$EVIDENCE/witness-strings.txt"
          grep -q '_notify_register_dispatch' "$EVIDENCE/witness-undefined.txt"
          grep -q '_notify_get_state' "$EVIDENCE/witness-undefined.txt"

          if grep -Ei 'AVFoundation|CoreMedia|CoreVideo|VideoToolbox|Photos' "$EVIDENCE/witness-linked-libraries.txt"; then
            echo "Witness linked camera/media framework."
            exit 1
          fi

          echo "RUNTIME_WITNESS_PROCESS_GUARD=PASS"
          echo "RUNTIME_WITNESS_VISIBLE_PROOF=PASS"
          echo "STARTUP_ORDER_INDEPENDENT_PROOF=PASS"
          echo "MACHO_ARM64_A9_COMPATIBLE=PASS"
          echo "IOS_MIN_VERSION=15.0"
          echo "ROOTHIDE_RPATH=PASS"
          echo "ROOTHIDE_INSTALL_NAME=PASS"
          echo "DYLIB_SIGNING=PASS"

      - name: Final static acceptance
        shell: bash
        run: |
          set -euo pipefail

          BASE=de81ab56cc8393961753226515d760fdf7f5ab93
          ROOT=build/roothide-mediaserverd-runtime-gate-001
          FINAL="$ROOT/final/VCAM-PRO-RootHide-Mediaserverd-Runtime-Gate-001.deb"

          test -f "$FINAL"
          test -f "$FINAL.sha256"
          git diff --quiet "$BASE"..HEAD -- src
          git diff --quiet "$BASE"..HEAD --             product/VCAMPro.RootHideIntegration.plist             product/build_roothide_integration_input.sh             product/roothide_integration

          cat "$FINAL.sha256" | tee "$ROOT/evidence/final-sha256.txt"
          git rev-parse HEAD | tee "$ROOT/evidence/exact-head.txt"

          echo "PRODUCTION_MEDIASERVERD_RUNTIME_COMPILED=PASS"
          echo "PRODUCTION_VCAM_ENTRY_COMPILED=PASS"
          echo "EXACT_RUNTIME_GATE_FILTER=PASS"
          echo "RUNTIME_START_PROOF_CHANNEL=PASS"
          echo "RUNTIME_WITNESS_PROCESS_GUARD=PASS"
          echo "RUNTIME_WITNESS_VISIBLE_PROOF=PASS"
          echo "REAL_REFERENCE_CAMERA_HOOK_OMITTED=PASS"
          echo "MSHOOKFUNCTION_ABSENT=PASS"
          echo "CAMERA_INTERCEPTION_INACTIVE=PASS"
          echo "REAL_CAMERA_BUFFER_OBSERVATION_INACTIVE=PASS"
          echo "FRAME_SUBSTITUTION_INACTIVE=PASS"
          echo "RUNTIME_START_FAIL_OPEN=PASS"
          echo "ROOT_HIDE_PACKAGING_UNCHANGED=PASS"
          echo "SPRINGBOARD_CONTROL_UNCHANGED=PASS"
          echo "FLOATING_CONTROL_UNCHANGED=PASS"
          echo "FRAME_ENGINE_UNCHANGED=PASS"
          echo "LOCAL_GALLERY_UNCHANGED=PASS"
          echo "SHARED_CONTROL_SEMANTICS_UNCHANGED=PASS"
          echo "SHARED_MEDIA_SEMANTICS_UNCHANGED=PASS"
          echo "FAIL_OPEN_UNCHANGED=PASS"
          echo "PR19_MODIFIED=NO"
          echo "LOAD_PROBE_BRANCH_MODIFIED=NO"
          echo "REFERENCE_REPOS_MODIFIED=NO"
          echo "MERGE_PERFORMED=NO"
          echo "RELEASE_PERFORMED=NO"
          echo "DEPLOY_PERFORMED=NO"
          echo "DEVICE_ACTION=NO"

      - name: Upload production runtime gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-roothide-mediaserverd-production-runtime-gate-001
