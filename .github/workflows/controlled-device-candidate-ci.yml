name: VCAM PRO Controlled Device Candidate CI

on:
  push:
    branches:
      - builder/controlled-device-candidate-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  controlled-candidate:
    name: SpringBoard-only controlled iOS15 candidate
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout controlled candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry source branch and frozen references
        run: |
          set -euo pipefail
          mkdir -p build/controlled-evidence

          target=11ebb083280cd94813d570953fbfa4cadf033081
          git merge-base --is-ancestor "$target" HEAD

          source_sha="$(git ls-remote origin refs/heads/builder/full-camera-gallery-test-deb-001 | awk '{print $1}')"
          test "$source_sha" = "$target"

          test "$(git ls-remote https://github.com/martaxi-boss/MotionCam-iOS.git refs/heads/main | awk '{print $1}')" = "5ede3a1973a01cb13fe7f3ab562b47513feec1b1"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-15-USB.git refs/heads/main | awk '{print $1}')" = "a908bccbcddb4efc072bb1bc8fbeb6ee89b1af9d"
          test "$(git ls-remote https://github.com/martaxi-boss/IOS-16-USB-4k.git refs/heads/main | awk '{print $1}')" = "cc20d787070c67565173d4a46c218e2549cecc93"

          echo "START_SHA=$target" | tee build/controlled-evidence/ancestry.txt
          echo "HEAD_SHA=$(git rev-parse HEAD)" | tee -a build/controlled-evidence/ancestry.txt
          echo "SOURCE_BRANCH_UNCHANGED=PASS" | tee -a build/controlled-evidence/ancestry.txt
          echo "REFERENCES_FROZEN=PASS" | tee -a build/controlled-evidence/ancestry.txt

      - name: Verify controlled build input boundary
        run: |
          set -euo pipefail

          test -f controlled/build_controlled.sh
          test -f controlled/VCAMProControlled.plist
          test -f src/controlled/VCAMProControlledEntry.mm

          for forbidden in ReferenceCameraHook.mm MediaserverdRuntime.mm VCAMProEntry.mm CameraConsumerAdapter.cpp; do
            if grep -F "$forbidden" controlled/build_controlled.sh; then
              echo "Forbidden global-camera input present: $forbidden"
              exit 1
            fi
          done

          grep -q 'SpringBoardControlHost.mm' controlled/build_controlled.sh
          grep -q 'ControlledRuntime.mm' controlled/build_controlled.sh
          grep -q 'ControlledPreviewView.mm' controlled/build_controlled.sh
          grep -q 'VCAMProControlledEntry.mm' controlled/build_controlled.sh

          if grep -RInE 'MSHookFunction|CMSampleBufferGetImageBuffer|mediaserverd'               src/controlled controlled; then
            echo "Controlled source boundary violation."
            exit 1
          fi

          echo "GLOBAL_CAMERA_BUILD_INPUTS=ABSENT"             | tee build/controlled-evidence/input-boundary.txt
          echo "MEDIASERVERD_BUILD_INPUT=ABSENT"             | tee -a build/controlled-evidence/input-boundary.txt

      - name: Frame Engine A through F2 regressions
        run: |
          set -euo pipefail
          tools/run_frame_regressions.sh
          mkdir -p build/controlled-evidence/frame-regressions
          cp build/regressions/*.txt build/controlled-evidence/frame-regressions/
          echo "FRAME_ENGINE_A_F2=PASS"             | tee build/controlled-evidence/frame-engine.txt

      - name: Internal Gallery 20-case regression
        run: |
          set -euo pipefail
          mkdir -p build/controlled-host-tests

          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/internal_gallery_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/controlled-host-tests/internal-gallery

          build/controlled-host-tests/internal-gallery             | tee build/controlled-evidence/internal-gallery.txt

          grep -q 'Internal gallery tests run: 20, failures: 0'             build/controlled-evidence/internal-gallery.txt

          echo "INTERNAL_GALLERY=PASS"             | tee -a build/controlled-evidence/internal-gallery.txt

      - name: Controlled preview 12-case regression
        run: |
          set -euo pipefail

          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/controlled             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/controlled/ControlledFrameConsumer.cpp             tests/controlled/controlled_preview_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/controlled-host-tests/controlled-preview

          build/controlled-host-tests/controlled-preview             | tee build/controlled-evidence/controlled-preview.txt

          grep -q 'Controlled preview tests run: 12, failures: 0'             build/controlled-evidence/controlled-preview.txt

          echo "CONTROLLED_PREVIEW=PASS"             | tee -a build/controlled-evidence/controlled-preview.txt

      - name: Existing safe control product host regression
        run: |
          set -euo pipefail

          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/full_product_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/controlled-host-tests/safe-product

          build/controlled-host-tests/safe-product             | tee build/controlled-evidence/safe-product.txt

          grep -q 'Product integration tests run: 8, failures: 0'             build/controlled-evidence/safe-product.txt

      - name: Build controlled iOS15 arm64 dylib and package
        run: |
          set -euo pipefail

          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg

          controlled/build_controlled.sh             build/controlled-device-candidate

      - name: Inspect controlled dylib safety boundary
        run: |
          set -euo pipefail

          dylib=build/controlled-device-candidate/ios/VCAMProControlled.dylib
          evidence=build/controlled-device-candidate/evidence

          xcrun lipo -info "$dylib"             | tee "$evidence/dylib-architecture.txt"
          grep -q 'arm64' "$evidence/dylib-architecture.txt"
          if grep -q 'arm64e' "$evidence/dylib-architecture.txt"; then
            exit 1
          fi

          xcrun otool -l "$dylib"             | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'             | tee "$evidence/dylib-minos.txt"
          grep -q 'minos 15.0' "$evidence/dylib-minos.txt"

          xcrun otool -L "$dylib"             | tee "$evidence/dylib-loads.txt"

          if grep -E 'CFNetwork|Network\.framework' "$evidence/dylib-loads.txt"; then
            echo "Network framework linked by controlled target."
            exit 1
          fi

          xcrun nm -u "$dylib"             | tee "$evidence/dylib-undefined.txt"

          if grep -q '_MSHookFunction' "$evidence/dylib-undefined.txt"; then
            echo "Substrate camera hook symbol leaked into controlled dylib."
            exit 1
          fi

          strings "$dylib"             > "$evidence/dylib-strings.txt"

          binary_forbidden='CMSampleBufferGetImageBuffer|MSHookFunction|mediaserverd|VCam Login|Client Login|VCAM ACCOUNT|/api/login|vcampro\.online|auth_token|logged_in|bypass_active|GET /vcam\.mjpg|obs-websocket|MJPEG|Gate.?1|proofrunner|witness|coordinator'
          if grep -Ei "$binary_forbidden" "$evidence/dylib-strings.txt"; then
            echo "Forbidden controlled dylib string found."
            exit 1
          fi

          if grep -Ei '(^|[^A-Za-z])OBS([^A-Za-z]|$)' "$evidence/dylib-strings.txt"; then
            echo "OBS string found in controlled dylib."
            exit 1
          fi

          echo "GLOBAL_CAMERA_SUBSTITUTION=ABSENT"             | tee "$evidence/safety-boundary.txt"
          echo "MEDIASERVERD_TARGET=ABSENT"             | tee -a "$evidence/safety-boundary.txt"
          echo "THIRD_PARTY_CAMERA_REPLACEMENT=ABSENT"             | tee -a "$evidence/safety-boundary.txt"
          echo "IOS15_ARM64=PASS"             | tee -a "$evidence/safety-boundary.txt"

      - name: Inspect SpringBoard-only injection plist
        run: |
          set -euo pipefail

          plist=controlled/VCAMProControlled.plist
          evidence=build/controlled-device-candidate/evidence

          plutil -lint "$plist"
          plutil -p "$plist"             | tee "$evidence/injection-plist.txt"

          grep -q 'com.apple.springboard' "$evidence/injection-plist.txt"
          grep -q '"SpringBoard"' "$evidence/injection-plist.txt"

          if grep -qi 'mediaserverd' "$evidence/injection-plist.txt"; then
            exit 1
          fi

          if grep -E 'com\.apple\.(UIKit|mediaserverd)' "$evidence/injection-plist.txt"; then
            exit 1
          fi

          echo "SPRINGBOARD_ONLY_FILTER=PASS"             | tee -a "$evidence/injection-plist.txt"

      - name: Validate repeat-safe maintainer script
        run: |
          set -euo pipefail

          script=controlled/package/DEBIAN/postinst

          if grep -E 'kill|killall|pkill|launchctl|ldrestart|respring|mediaserverd|reboot|userspace|ssh|curl|wget' "$script"; then
            echo "Forbidden maintainer-script behavior."
            exit 1
          fi

          sandbox="$(mktemp -d)"
          VCAM_TEST_ROOT_PREFIX="$sandbox/var/jb" sh "$script"
          VCAM_TEST_ROOT_PREFIX="$sandbox/var/jb" sh "$script"

          test -d "$sandbox/var/jb/var/mobile/Library/VCAMPro/Media"
          test "$(stat -f '%Lp' "$sandbox/var/jb/var/mobile/Library/VCAMPro/Media")" = "755"

          rm -rf "$sandbox"

          echo "MAINTAINER_SCRIPT_REPEAT_SAFE=PASS"             | tee build/controlled-device-candidate/evidence/postinst.txt

      - name: Inspect single rootless controlled deb
        run: |
          set -euo pipefail

          out=build/controlled-device-candidate
          deb="$out/final/com.vcampro.controlledtest_0.1.0_iphoneos-arm64.deb"
          evidence="$out/evidence"

          test -f "$deb"
          test "$(find "$out/final" -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" -eq 1

          test "$(dpkg-deb -f "$deb" Package)" = "com.vcampro.controlledtest"
          test "$(dpkg-deb -f "$deb" Version)" = "0.1.0"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Depends)" = "mobilesubstrate, firmware (>= 15.0)"

          {
            echo "Package: $(dpkg-deb -f "$deb" Package)"
            echo "Version: $(dpkg-deb -f "$deb" Version)"
            echo "Architecture: $(dpkg-deb -f "$deb" Architecture)"
            echo "Depends: $(dpkg-deb -f "$deb" Depends)"
          } | tee "$evidence/package-metadata.txt"

          dpkg-deb -c "$deb"             | tee "$evidence/package-tree.txt"

          grep -q './var/jb/Library/MobileSubstrate/DynamicLibraries/VCAMProControlled.dylib' "$evidence/package-tree.txt"
          grep -q './var/jb/Library/MobileSubstrate/DynamicLibraries/VCAMProControlled.plist' "$evidence/package-tree.txt"
          grep -q './var/jb/var/mobile/Library/VCAMPro/Media/' "$evidence/package-tree.txt"

          if grep -Fq './Library/MobileSubstrate/' "$evidence/package-tree.txt"; then
            echo "Rootful payload found."
            exit 1
          fi

          if grep -Ei 'ReferenceCameraHook|MediaserverdRuntime|Gate.?1|proofrunner|witness|coordinator' "$evidence/package-tree.txt"; then
            echo "Forbidden payload found."
            exit 1
          fi

          unpack="$(mktemp -d)"
          dpkg-deb -x "$deb" "$unpack"

          packaged_plist="$unpack/var/jb/Library/MobileSubstrate/DynamicLibraries/VCAMProControlled.plist"
          plutil -p "$packaged_plist"             | tee "$evidence/packaged-plist.txt"

          if grep -qi 'mediaserverd' "$evidence/packaged-plist.txt"; then
            exit 1
          fi

          packaged_dylib="$unpack/var/jb/Library/MobileSubstrate/DynamicLibraries/VCAMProControlled.dylib"
          strings "$packaged_dylib" > "$evidence/packaged-dylib-strings.txt"

          package_forbidden='CMSampleBufferGetImageBuffer|MSHookFunction|mediaserverd|VCam Login|Client Login|VCAM ACCOUNT|/api/login|vcampro\.online|GET /vcam\.mjpg|obs-websocket|MJPEG|Gate.?1|proofrunner|witness|coordinator'
          if grep -Ei "$package_forbidden" "$evidence/packaged-dylib-strings.txt"; then
            exit 1
          fi

          rm -rf "$unpack"

          cat "$deb.sha256"             | tee "$evidence/deb-sha256.txt"

          echo "ROOTLESS_DEB=PASS"             | tee -a "$evidence/package-metadata.txt"

      - name: Consolidate validation evidence
        run: |
          set -euo pipefail

          evidence=build/controlled-device-candidate/evidence

          cp build/controlled-evidence/*.txt "$evidence/" || true
          mkdir -p "$evidence/frame-regressions"
          cp build/controlled-evidence/frame-regressions/*.txt "$evidence/frame-regressions/" || true

          echo "DEVICE_ACTION=NO"             | tee "$evidence/runtime-boundary.txt"
          echo "MERGE_PERFORMED=NO"             | tee -a "$evidence/runtime-boundary.txt"
          echo "RUNTIME_DEVICE_CERTIFICATION=PENDING"             | tee -a "$evidence/runtime-boundary.txt"

      - name: Upload controlled candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-controlled-device-candidate-001
          path: |
            build/controlled-device-candidate/final/com.vcampro.controlledtest_0.1.0_iphoneos-arm64.deb
            build/controlled-device-candidate/final/com.vcampro.controlledtest_0.1.0_iphoneos-arm64.deb.sha256
            build/controlled-device-candidate/evidence/**
          if-no-files-found: error
          retention-days: 14
