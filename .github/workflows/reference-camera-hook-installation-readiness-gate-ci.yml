name: VCAM PRO Reference Camera Hook Installation Readiness Gate 001

on:
  push:
    branches:
      - builder/reference-camera-hook-installation-readiness-gate-001
    paths:
      - "product/hook_installation_readiness_gate/**"
      - ".github/workflows/reference-camera-hook-installation-readiness-gate-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcampro-reference-hook-installation-readiness-gate-001
  cancel-in-progress: true

jobs:
  validate:
    name: Reference hook installation readiness without activation
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run static validation and compile-only proof
        shell: bash
        run: sh product/hook_installation_readiness_gate/ci_static_validate.sh

      - name: Install RootHide packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus
          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          echo "$GNU_PATH" >> "$GITHUB_PATH"

      - name: Build and audit RootHide gate package
        shell: bash
        run: sh product/hook_installation_readiness_gate/ci_build_package_and_audit.sh

      - name: Upload readiness gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-reference-camera-hook-installation-readiness-gate-001
          path: |
            build/reference-camera-hook-installation-readiness-gate-001/final/VCAM-PRO-RootHide-Reference-Hook-Installation-Readiness-Gate-001.deb
            build/reference-camera-hook-installation-readiness-gate-001/final/VCAM-PRO-RootHide-Reference-Hook-Installation-Readiness-Gate-001.deb.sha256
            build/reference-camera-hook-installation-readiness-gate-001/evidence/
            build/hook-installation-readiness-state/results.txt
            build/reference-hook-compile-only/
            build/runtime-gate-regressions/
          if-no-files-found: error
          retention-days: 14
