name: VCAM PRO Post Photo Local Media Pre-Fix 001

on:
  push:
    branches:
      - builder/canonical-hook-continuation-001
    paths:
      - "src/product/MediaserverdRuntime.*"
      - "tests/product/post_photo_local_media_prefx_tests.mm"
      - ".github/workflows/post-photo-local-media-prefx-001-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-fix:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout exact current head
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          START=4951d227ac8ea4425e969adeb46259293d1b7d6a
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$START" HEAD
          test "$(git rev-parse main)" = "d476caacc4f557843f9551533c2fcbe7c5d40baa"

      - name: Static picker and orientation-gap evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          picker = Path("src/control/InternalGalleryViewController.mm").read_text()
          runtime = Path("src/product/MediaserverdRuntime.mm").read_text()
          transformer = Path("src/media_engine/FrameTransformer.mm").read_text()
          hook = Path("src/product/ReferenceCameraHook.mm").read_text()

          assert "hasItemConformingToTypeIdentifier:" in picker
          assert "UTTypeMovie.identifier" in picker
          assert "ProductMediaKind::Video" in picker
          assert "loopSwitch.enabled" in picker
          assert "snapshot.mediaKind ==" in picker
          assert "GeometryKey(" in runtime
          assert "UprightIdentityTransform" in runtime
          assert "ParseRotation(geometry.preferredTransform)" in transformer

          orientation_attachment_tokens = [
              "kCGImagePropertyOrientation",
              "kCMSampleAttachmentKey_DisplayImmediately",
              "CMCopyDictionaryOfAttachments",
              "CVBufferGetAttachment",
          ]
          attachment_orientation = any(
              token in hook or token in runtime
              for token in orientation_attachment_tokens
          )

          print("VIDEO_PICKER_SOURCE_PATH_AUDITED=PASS")
          print("VIDEO_LOOP_UI_SOURCE_CONDITION_AUDITED=PASS")
          print("SOURCE_PREFERRED_TRANSFORM_STATUS=IMPLEMENTED")
          print("DESTINATION_ORIENTATION_SEMANTICS_STATUS=MISSING_FROM_GEOMETRY_IDENTITY")
          print(
              "BUFFER_ORIENTATION_ATTACHMENT_STATUS=" +
              ("PRESENT_REQUIRES_AUDIT" if attachment_orientation
               else "NO_RELIABLE_ORIENTATION_ATTACHMENT_SOURCE_IN_CURRENT_HOOK")
          )
          print("ORIENTATION_CROP_ORDER_STATUS=SOURCE_ROTATION_BEFORE_CENTER_CROP")
          PY

      - name: Build and run pre-fix product composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/post-photo-prefx

          xcrun --sdk macosx clang++ \
            -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread \
            -Wno-deprecated-declarations -Wno-unused-function \
            -DVCAM_TESTING=1 \
            -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product \
            src/frame_engine/PreparedFrame.cpp \
            src/frame_engine/FrameEngineState.cpp \
            src/frame_engine/ReadyFrameQueue.cpp \
            src/frame_engine/FrameTimelineScheduler.cpp \
            src/frame_engine/MonotonicHostClock.cpp \
            src/media_engine/LocalVideoReader.mm \
            src/media_engine/LocalPhotoReader.mm \
            src/media_engine/FrameNormalizer.cpp \
            src/media_engine/FrameTransformer.mm \
            src/media_engine/FramePipelinePump.cpp \
            src/media_engine/FramePipelinePumpTimed.cpp \
            src/media_engine/ProducerWakeupController.cpp \
            src/media_engine/ProducerWakeupDriver.mm \
            src/media_engine/InternalGalleryMediaSession.mm \
            src/product/ControlStateCache.cpp \
            src/product/VirtualBlackFrame.mm \
            src/product/CameraConsumerAdapter.cpp \
            src/product/SharedControlStore.mm \
            src/product/SharedMediaStager.mm \
            src/product/ProductControlOwner.mm \
            src/product/MediaserverdRuntime.mm \
            tests/product/post_photo_local_media_prefx_tests.mm \
            -framework Accelerate \
            -framework Foundation \
            -framework AVFoundation \
            -framework CoreFoundation \
            -framework CoreGraphics \
            -framework CoreMedia \
            -framework CoreVideo \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            -o build/post-photo-prefx/prefx

          build/post-photo-prefx/prefx |
            tee build/post-photo-prefx/result.txt

          for marker in \
            VIDEO_PICKER_CLASSIFICATION=PASS \
            VIDEO_LOAD_REPRESENTATION_KIND=VIDEO \
            VIDEO_STAGING=PASS \
            VIDEO_CONTROL_COMMIT=PASS \
            VIDEO_MEDIA_KIND=VIDEO \
            VIDEO_PLAYBACK_INTENT_AFTER_SELECTION=PLAYING \
            VIDEO_LOOP_UI_ENABLED_WHEN_VIDEO_SNAPSHOT_ACTIVE=PASS \
            VIDEO_LOOP_OFF_DOES_NOT_BLOCK_START=PASS \
            VIDEO_REQUIRES_LOOP_TO_START=NO \
            PRE_FIX_VIDEO_TIMELINE_RESTART_OR_DISCONTINUITY=YES \
            PRE_FIX_VIDEO_GEOMETRY_CHURN_REPRODUCED=YES \
            PHOTO_PREPARED_MEDIA_DECISIONS_CONTINUOUS=PASS \
            PHOTO_STABLE_BLACK_DECISION_DELTA=0 \
            PHOTO_STABLE_GUARD_DECISION_DELTA=0 \
            PHOTO_STABLE_ORIGINAL_DECISION_DELTA=0 \
            PHOTO_MICROFLASH_NOT_OWNERSHIP_FALLBACK=PASS \
            PHOTO_DROPOUT_PRESENT=NO \
            POST_PHOTO_LOCAL_MEDIA_PRE_FIX_PROOF=PASS; do
            grep -Fq "$marker" build/post-photo-prefx/result.txt
          done

          grep -Eq \
            'PRE_FIX_VIDEO_SESSION_REBUILD_COUNT=[1-9][0-9]*' \
            build/post-photo-prefx/result.txt

          grep -Eq \
            'PRE_FIX_VIDEO_READER_REOPEN_COUNT=[1-9][0-9]*' \
            build/post-photo-prefx/result.txt

          grep -Eq \
            'PRE_FIX_VIDEO_AVASSETREADER_RESTART_COUNT=[1-9][0-9]*' \
            build/post-photo-prefx/result.txt

      - name: Upload pre-fix evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-photo-local-media-prefx-001
          path: build/post-photo-prefx/**
          if-no-files-found: error
          retention-days: 14
