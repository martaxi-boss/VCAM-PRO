name: VCAM PRO First Local Photo Substitution Diagnostic Remediation A

on:
  push:
    branches:
      - builder/canonical-hook-continuation-001
    paths:
      - "product/first_local_photo_virtual_substitution_001/**"
      - "src/product/MediaserverdRuntime.mm"
      - "docs/CANONICAL_PROJECT_STATE.md"
      - ".github/workflows/first-local-photo-virtual-substitution-001-ci.yml"

permissions:
  contents: read

concurrency:
  group: vcampro-first-local-photo-virtual-substitution-001
  cancel-in-progress: true

jobs:
  certify:
    name: Certify first local photo substitution diagnostic remediation A
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          brew unlink ldid >/dev/null 2>&1 || true
          brew install dpkg gnu-sed findutils coreutils ldid-procursus
          GNU_PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix findutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin"
          echo "$GNU_PATH" >> "$GITHUB_PATH"

      - name: Frame Engine A through F2 regression matrix
        shell: bash
        run: |
          set -euo pipefail
          tools/run_frame_regressions.sh

      - name: Internal Gallery and LocalPhotoReader integration regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/first-photo-substitution-tests
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/internal_gallery_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/first-photo-substitution-tests/internal-gallery
          build/first-photo-substitution-tests/internal-gallery | tee build/first-photo-substitution-tests/internal-gallery.txt
          grep -q 'Internal gallery tests run: 20, failures: 0' build/first-photo-substitution-tests/internal-gallery.txt

      - name: Camera consumer ON OFF virtual and fail-open regressions
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             tests/product/camera_consumer_adapter_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/first-photo-substitution-tests/camera-consumer
          build/first-photo-substitution-tests/camera-consumer | tee build/first-photo-substitution-tests/camera-consumer.txt
          grep -q 'Camera consumer tests run: 13, failures: 0' build/first-photo-substitution-tests/camera-consumer.txt
          grep -Fq '[PASS] default OFF returns original' build/first-photo-substitution-tests/camera-consumer.txt
          grep -Fq '[PASS] eligible frame selects virtual' build/first-photo-substitution-tests/camera-consumer.txt
          grep -Fq '[PASS] disable during active production' build/first-photo-substitution-tests/camera-consumer.txt
          {
            echo 'VCAM_OFF_ORIGINAL_PATH_REGRESSION=PASS'
            echo 'VCAM_ON_VIRTUAL_DECISION_PATH=PASS'
            echo 'VCAM_DISABLE_AFTER_VIRTUAL_RETURNS_ORIGINAL=PASS'
          } | tee build/first-photo-substitution-tests/on-off-markers.txt

      - name: Full Product Control and media lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/control -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/frame_engine/MonotonicHostClock.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/media_engine/ProducerWakeupController.cpp             src/media_engine/ProducerWakeupDriver.mm             src/media_engine/InternalGalleryMediaSession.mm             src/product/ControlStateCache.cpp             src/product/CameraConsumerAdapter.cpp             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/full_product_integration_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/first-photo-substitution-tests/full-product
          build/first-photo-substitution-tests/full-product | tee build/first-photo-substitution-tests/full-product.txt
          grep -q 'Product integration tests run: 8, failures: 0' build/first-photo-substitution-tests/full-product.txt

      - name: SharedMediaStager ownership and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine -Isrc/product             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/LocalPhotoReader.mm             src/product/SharedControlStore.mm             src/product/SharedMediaStager.mm             src/product/ProductControlOwner.mm             tests/product/local_media_storage_recovery_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -framework ImageIO             -o build/first-photo-substitution-tests/storage-recovery
          build/first-photo-substitution-tests/storage-recovery | tee build/first-photo-substitution-tests/storage-recovery.txt
          grep -q 'Storage recovery tests run: 15, failures: 0' build/first-photo-substitution-tests/storage-recovery.txt

      - name: SharedControlStore propagation and fail-open tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic -pthread             -Isrc/product             src/product/SharedControlStore.mm             tests/product/shared_control_store_fail_open_tests.mm             -framework Foundation             -o build/first-photo-substitution-tests/shared-control-store
          build/first-photo-substitution-tests/shared-control-store | tee build/first-photo-substitution-tests/shared-control-store.txt
          grep -q 'Shared control store hardening tests run: 16, failures: 0' build/first-photo-substitution-tests/shared-control-store.txt
          grep -q 'PASS valid snapshot round trip' build/first-photo-substitution-tests/shared-control-store.txt
          grep -q 'PASS observer corruption fail open' build/first-photo-substitution-tests/shared-control-store.txt

      - name: Build, RootHide patch, and audit substitution diagnostic package
        shell: bash
        run: sh product/first_local_photo_virtual_substitution_001/ci_build_package_and_audit.sh

      - name: Upload certified package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: vcampro-first-local-photo-substitution-diagnostic-remediation-a
          path: |
            build/first-local-photo-virtual-substitution-001/final/VCAM-PRO-RootHide-First-Local-Photo-Substitution-Diagnostic-Remediation-A.deb
            build/first-local-photo-virtual-substitution-001/final/VCAM-PRO-RootHide-First-Local-Photo-Substitution-Diagnostic-Remediation-A.deb.sha256
            build/first-local-photo-virtual-substitution-001/evidence/**
            build/first-photo-substitution-diagnostic-state/results.txt
            build/first-photo-substitution-tests/*.txt
            build/regressions/*.txt
          if-no-files-found: error
          retention-days: 14
