name: Frame Engine Stage F2 CI

on:
  push:
    branches:
      - builder/frame-engine-stage-f2-wakeup-driver-001
    paths:
      - "src/frame_engine/**"
      - "src/media_engine/**"
      - "tests/frame_engine/**"
      - "tests/media_engine/**"
      - ".github/workflows/frame-engine-stage-f2-ci.yml"
      - "docs/proofs/FRAME_ENGINE_STAGE_F2_001.md"
  pull_request:
    paths:
      - "src/frame_engine/**"
      - "src/media_engine/**"
      - "tests/frame_engine/**"
      - "tests/media_engine/**"
      - ".github/workflows/frame-engine-stage-f2-ci.yml"
      - "docs/proofs/FRAME_ENGINE_STAGE_F2_001.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  stage-f2:
    name: Stage F2 producer wakeup driver
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun clang++ --version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-path)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build/host build/ios

      - name: Stage F2 architecture boundaries
        run: |
          set -euo pipefail

          test -f src/frame_engine/MonotonicHostClock.cpp
          test -f src/media_engine/ProducerWakeupController.cpp
          test -f src/media_engine/ProducerWakeupDriver.mm

          grep -q 'mach_absolute_time'             src/frame_engine/MonotonicHostClock.cpp
          grep -q 'mach_timebase_info'             src/frame_engine/MonotonicHostClock.cpp
          grep -q 'DISPATCH_SOURCE_TYPE_TIMER'             src/media_engine/ProducerWakeupDriver.mm
          grep -q 'dispatch_source_set_timer'             src/media_engine/ProducerWakeupDriver.mm
          grep -q 'DISPATCH_QUEUE_SERIAL'             src/media_engine/ProducerWakeupDriver.mm

          # Exactly one production binding to the accepted F1 timed pump.
          test "$(grep -Fc 'return pump_.pumpOnceAtHostTime('             src/media_engine/ProducerWakeupDriver.mm)" -eq 1

          if grep -RInE 'sleep|usleep|dispatch_after|NSThread.*sleep|while[[:space:]]*\('               src/frame_engine/MonotonicHostClock.*               src/media_engine/ProducerWakeupController.*               src/media_engine/ProducerWakeupDriver.*; then
            echo "Forbidden Stage F2 busy-wait/blocking primitive found."
            exit 1
          fi

          if grep -RInE 'gettimeofday|CFAbsoluteTime|NSDate|system_clock|CLOCK_REALTIME'               src/frame_engine/MonotonicHostClock.*               src/media_engine/ProducerWakeupDriver.*; then
            echo "Wall-clock pacing dependency found."
            exit 1
          fi

          if grep -RInE 'sleep|usleep|dispatch_after|NSThread.*sleep'               tests/media_engine/producer_wakeup_driver_stage_f2_tests.cpp; then
            echo "F2 deterministic tests use a real delay."
            exit 1
          fi

          # F2 is additive: accepted F1 semantics remain byte-for-byte intact.
          git diff --exit-code             26f9aa9eaee850daa589c47cae519cfa71306286             --             src/frame_engine/FrameTimelineScheduler.h             src/frame_engine/FrameTimelineScheduler.cpp             src/media_engine/FramePipelinePumpTimed.cpp             src/frame_engine/ReadyFrameQueue.h             src/frame_engine/ReadyFrameQueue.cpp

          consumer_forbidden='ProducerWakeup|MonotonicHostClock|FrameTimelineScheduler|FramePipelinePump|LocalVideoReader|AVAssetReader|AVFoundation|Accelerate|vImage|FrameTransformer|mach_absolute_time|mach_timebase_info|dispatch_|sleep|usleep|MSHookFunction|MSHookMessageEx|mediaserverd|NSURLSession|Network.framework'
          if grep -RInE "$consumer_forbidden"               src/frame_engine/PreparedFrame.*               src/frame_engine/ReadyFrameQueue.*; then
            echo "Consumer fast path acquired a producer dependency."
            exit 1
          fi

          product_forbidden='UIKit|UIImage|PHPhoto|Photos.framework|MSHookFunction|MSHookMessageEx|%hook|NSURLSession|Network.framework'
          if grep -RInE "$product_forbidden"               src/frame_engine src/media_engine; then
            echo "Forbidden Frame Engine dependency found."
            exit 1
          fi

          if grep -RInE '(^|[^A-Za-z])socket[[:space:]]*\(|\bnw_[A-Za-z0-9_]+'               src/frame_engine src/media_engine; then
            echo "Forbidden network dependency found."
            exit 1
          fi

      - name: Build and run Stage F2 deterministic driver tests
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine -Isrc/media_engine             src/media_engine/ProducerWakeupController.cpp             tests/media_engine/producer_wakeup_driver_stage_f2_tests.cpp             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_f2_driver_tests

          build/host/stage_f2_driver_tests             | tee build/host/stage-f2-driver-summary.txt
          grep -q 'Stage F2 driver tests run: 19, failures: 0'             build/host/stage-f2-driver-summary.txt

      - name: Stage F1 scheduler regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameTimelineScheduler.cpp             tests/frame_engine/frame_timeline_scheduler_stage_f1_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_f1_scheduler_tests

          build/host/stage_f1_scheduler_tests             | tee build/host/stage-f1-scheduler-summary.txt
          grep -q 'Stage F1 scheduler tests run: 13, failures: 0'             build/host/stage-f1-scheduler-summary.txt

      - name: Stage F1 timed pipeline regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/frame_engine/FrameTimelineScheduler.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             src/media_engine/FramePipelinePumpTimed.cpp             tests/media_engine/frame_pipeline_stage_f1_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_f1_pipeline_tests

          build/host/stage_f1_pipeline_tests             | tee build/host/stage-f1-pipeline-summary.txt
          grep -q 'Stage F1 timed pipeline tests run: 12, failures: 0'             build/host/stage-f1-pipeline-summary.txt

      - name: Stage A regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             tests/frame_engine/frame_engine_stage_a_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_a_tests
          build/host/stage_a_tests | tee build/host/stage-a-summary.txt
          grep -q 'Tests run: 13, failures: 0' build/host/stage-a-summary.txt

      - name: Stage B regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             tests/media_engine/local_video_reader_stage_b_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/stage_b_tests
          build/host/stage_b_tests | tee build/host/stage-b-summary.txt
          grep -q 'Stage B tests run: 10, failures: 0' build/host/stage-b-summary.txt

      - name: Stage C1 regressions
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/ready_frame_queue_stage_c1_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_c1_queue_tests
          build/host/stage_c1_queue_tests             | tee build/host/stage-c1-queue-summary.txt
          grep -q 'Stage C1 queue tests run: 18, failures: 0'             build/host/stage-c1-queue-summary.txt

          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/media_engine/FrameNormalizer.cpp             tests/media_engine/frame_normalizer_stage_c1_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/stage_c1_normalizer_tests
          build/host/stage_c1_normalizer_tests             | tee build/host/stage-c1-normalizer-summary.txt
          grep -q 'Stage C1 normalizer tests run: 17, failures: 0'             build/host/stage-c1-normalizer-summary.txt

      - name: Stage D1 regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_d1_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/stage_d1_tests
          build/host/stage_d1_tests | tee build/host/stage-d1-summary.txt
          grep -q 'Stage D1 tests run: 19, failures: 0'             build/host/stage-d1-summary.txt

      - name: Stage D2 regressions
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/consumer_fast_path_stage_d2_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/d2_consumer_tests
          build/host/d2_consumer_tests             | tee build/host/d2-consumer-summary.txt
          grep -q 'Stage D2 consumer tests run: 5, failures: 0'             build/host/d2-consumer-summary.txt

          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/ready_frame_queue_stage_d2_stress_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/d2_queue_stress
          build/host/d2_queue_stress             | tee build/host/d2-queue-stress-summary.txt
          grep -q 'Stage D2 queue stress tests run: 8, failures: 0'             build/host/d2-queue-stress-summary.txt

          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations -pthread             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_d2_stress_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/d2_pipeline_stress
          build/host/d2_pipeline_stress             | tee build/host/d2-pipeline-summary.txt
          grep -q 'Stage D2 pipeline stress tests run: 5, failures: 0'             build/host/d2-pipeline-summary.txt

      - name: Stage E1 regressions
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             tests/media_engine/frame_transformer_stage_e1_tests.mm             -framework Accelerate             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_e1_transformer_tests
          build/host/stage_e1_transformer_tests             | tee build/host/stage-e1-transformer-summary.txt
          grep -q 'Stage E1 transformer tests run: 27, failures: 0'             build/host/stage-e1-transformer-summary.txt

          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_e1_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_e1_pipeline_tests
          build/host/stage_e1_pipeline_tests             | tee build/host/stage-e1-pipeline-summary.txt
          grep -q 'Stage E1 pipeline tests run: 3, failures: 0'             build/host/stage-e1-pipeline-summary.txt

      - name: Compile iOS 15 arm64 Stage F2
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"
          COMMON="-std=c++17 -arch arm64 -isysroot $SDKROOT -miphoneos-version-min=15.0 -Wall -Wextra -Werror -Werror=unguarded-availability-new -pedantic"

          "$CXX" $COMMON             -Isrc/frame_engine -Isrc/media_engine             -c src/frame_engine/MonotonicHostClock.cpp             -o build/ios/MonotonicHostClock.o

          "$CXX" $COMMON             -Isrc/frame_engine -Isrc/media_engine             -c src/media_engine/ProducerWakeupController.cpp             -o build/ios/ProducerWakeupController.o

          "$CXX" $COMMON -fobjc-arc             -Isrc/frame_engine -Isrc/media_engine             -c src/media_engine/ProducerWakeupDriver.mm             -o build/ios/ProducerWakeupDriver.o

          xcrun libtool -static             -o build/ios/libVCAMProducerWakeupStageF2.a             build/ios/MonotonicHostClock.o             build/ios/ProducerWakeupController.o             build/ios/ProducerWakeupDriver.o

          "$CXX" $COMMON -Isrc/frame_engine             -c src/frame_engine/PreparedFrame.cpp             -o build/ios/PreparedFrame.o
          "$CXX" $COMMON -Isrc/frame_engine             -c src/frame_engine/ReadyFrameQueue.cpp             -o build/ios/ReadyFrameQueue.o

          xcrun libtool -static             -o build/ios/libVCAMConsumerFastPathF2.a             build/ios/PreparedFrame.o             build/ios/ReadyFrameQueue.o

      - name: Inspect iOS 15 F2 and consumer boundaries
        run: |
          set -euo pipefail

          xcrun lipo -info build/ios/libVCAMProducerWakeupStageF2.a             | tee build/ios/f2-architecture.txt
          grep -q 'arm64' build/ios/f2-architecture.txt
          if grep -q 'arm64e' build/ios/f2-architecture.txt; then
            exit 1
          fi

          : > build/ios/f2-minos.txt
          for object in               MonotonicHostClock.o               ProducerWakeupController.o               ProducerWakeupDriver.o; do
            xcrun otool -l "build/ios/$object"               | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'               | tee -a build/ios/f2-minos.txt
          done
          test "$(grep -c 'minos 15.0' build/ios/f2-minos.txt)" -ge 3

          xcrun nm -u build/ios/libVCAMProducerWakeupStageF2.a             | tee build/ios/f2-undefined-symbols.txt

          grep -q '_mach_absolute_time'             build/ios/f2-undefined-symbols.txt
          grep -q '_mach_timebase_info'             build/ios/f2-undefined-symbols.txt
          grep -q '_dispatch_source_create'             build/ios/f2-undefined-symbols.txt
          grep -q '_dispatch_source_set_timer'             build/ios/f2-undefined-symbols.txt

          f2_forbidden='UIKit|UIImage|PHPhoto|MSHookFunction|MSHookMessageEx|mediaserverd|NSURLSession|_socket|_nw_|gettimeofday|CFAbsoluteTime'
          if grep -E "$f2_forbidden"               build/ios/f2-undefined-symbols.txt; then
            echo "Forbidden F2 production dependency found."
            exit 1
          fi

          xcrun lipo -info build/ios/libVCAMConsumerFastPathF2.a             | tee build/ios/consumer-architecture.txt
          grep -q 'arm64' build/ios/consumer-architecture.txt
          if grep -q 'arm64e' build/ios/consumer-architecture.txt; then
            exit 1
          fi

          : > build/ios/consumer-minos.txt
          for object in build/ios/PreparedFrame.o build/ios/ReadyFrameQueue.o; do
            xcrun otool -l "$object"               | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'               | tee -a build/ios/consumer-minos.txt
          done
          test "$(grep -c 'minos 15.0' build/ios/consumer-minos.txt)" -ge 2

          xcrun nm -u build/ios/libVCAMConsumerFastPathF2.a             | tee build/ios/consumer-undefined-symbols.txt

          consumer_forbidden='ProducerWakeup|MonotonicHostClock|FrameTimelineScheduler|FramePipelinePump|LocalVideoReader|AVAssetReader|AVFoundation|Accelerate|vImage|FrameTransformer|mach_absolute_time|mach_timebase_info|dispatch_|sleep|usleep|VideoToolbox|VTPixel|AVCapture|MSHookFunction|MSHookMessageEx|mediaserverd|NSURLSession|_socket|_nw_'
          if grep -E "$consumer_forbidden"               build/ios/consumer-undefined-symbols.txt; then
            echo "Forbidden consumer dependency found."
            exit 1
          fi

      - name: Upload Stage F2 validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcam-frame-engine-stage-f2-validation
          path: |
            build/host/stage-f2-driver-summary.txt
            build/host/stage-f1-scheduler-summary.txt
            build/host/stage-f1-pipeline-summary.txt
            build/host/stage-a-summary.txt
            build/host/stage-b-summary.txt
            build/host/stage-c1-queue-summary.txt
            build/host/stage-c1-normalizer-summary.txt
            build/host/stage-d1-summary.txt
            build/host/d2-consumer-summary.txt
            build/host/d2-queue-stress-summary.txt
            build/host/d2-pipeline-summary.txt
            build/host/stage-e1-transformer-summary.txt
            build/host/stage-e1-pipeline-summary.txt
            build/ios/libVCAMProducerWakeupStageF2.a
            build/ios/f2-architecture.txt
            build/ios/f2-minos.txt
            build/ios/f2-undefined-symbols.txt
            build/ios/libVCAMConsumerFastPathF2.a
            build/ios/consumer-architecture.txt
            build/ios/consumer-minos.txt
            build/ios/consumer-undefined-symbols.txt
          if-no-files-found: error
          retention-days: 14
