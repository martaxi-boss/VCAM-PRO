name: VCAM PRO Final Repository Hygiene 002

on:
  push:
    branches:
      - builder/canonical-hook-continuation-001
    paths:
      - .github/workflows/final-repository-hygiene-002.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  final-repository-hygiene:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_BRANCH: builder/canonical-hook-continuation-001
      PRE_HYGIENE_HEAD: 8a7aaee7912c1e646bfa4d09a1a6da4c5ec480c7
      FROZEN_MAIN: d476caacc4f557843f9551533c2fcbe7c5d40baa
      WORKFLOW_PATH: .github/workflows/final-repository-hygiene-002.yml
    steps:
      - name: Checkout canonical workstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: builder/canonical-hook-continuation-001

      - name: Preflight, preserve tags, delete obsolete branches, reconcile canonical state
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "VCAM PRO Repository Hygiene"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          EXEC_HEAD="$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "$CANONICAL_BRANCH"

          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

          test "$(git rev-parse refs/remotes/origin/main)" = "$FROZEN_MAIN"
          git merge-base --is-ancestor "$PRE_HYGIENE_HEAD" "$EXEC_HEAD"

          mapfile -t CHANGED_SINCE_BASE < <(git diff --name-only "$PRE_HYGIENE_HEAD..$EXEC_HEAD")
          if [ "${#CHANGED_SINCE_BASE[@]}" -ne 1 ] || [ "${CHANGED_SINCE_BASE[0]}" != "$WORKFLOW_PATH" ]; then
            echo "STALE_EXECUTION_PACKET: unrelated canonical changes since pre-hygiene head"
            printf '%s\n' "${CHANGED_SINCE_BASE[@]}"
            exit 20
          fi

          OPEN_PRS="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')"
          test "$OPEN_PRS" = "0"

          cat > /tmp/obsolete.tsv <<'EOF'
          builder/central-injection-research-001 6f92ee853e1a93b1a19856b84a658a46e802c3b3
          builder/controlled-device-candidate-001 b29391853ab11c33fc506fafffc7bbf7f0ee00d6
          builder/floating-control-drag-001 de81ab56cc8393961753226515d760fdf7f5ab93
          builder/frame-engine-contract-001 8b951caf10c5527a37f34f141dca76da7a7af839
          builder/frame-engine-stage-a-001 04edadbb09a3d13ad4f778c8de232b69c8b4182a
          builder/frame-engine-stage-b-001 9d979097b932fdede9ce9c85d9947edf5ee0b274
          builder/frame-engine-stage-c1-001 ebe6e3b8ded9ec5de426fce01b3dfda9f757419a
          builder/frame-engine-stage-d1-001 c866bf6741d0bc39fe78335aea22f9725a1688a7
          builder/frame-engine-stage-d2-001 55d7627c53d72f749334de863c5dbcd22dede216
          builder/frame-engine-stage-e1-transform-001 4abc76afa063977b0009f70c77e7f3dda1f3480d
          builder/frame-engine-stage-f1-timeline-001 26f9aa9eaee850daa589c47cae519cfa71306286
          builder/frame-engine-stage-f2-wakeup-driver-001 31b768989b6623afd0d2edc7e9bf304cc6a54172
          builder/full-camera-gallery-test-deb-001 11ebb083280cd94813d570953fbfa4cadf033081
          builder/gate1-automated-device-proof-runner-001 b36ad8268fb672324f0f8cbfa46c4e3b67d4570c
          builder/hook-provider-self-test-gate-001-remediation-a 4c8f192c9573e99d38540519c1c685df0384db0f
          builder/hook-provider-self-test-gate-001 3674949a81639bdf804462ba956ddb836543d37f
          builder/internal-gallery-integration-001 d8928c5d4b5cd471fba15058dbb03e2b6fc56a5c
          builder/legacy-hook-structural-parity-audit-001 ff2df5125e2e6f131b3b79ccb311a41105f950df
          builder/legacy-real-hook-linkage-gate-001 2895d40391a344dd5325affa05bda2cb0b1612bf
          builder/legacy-real-hook-runtime-activation-gate-001 5295f9a3f7bf279ef5dd34f72c0bbc11a2b1ead5
          builder/legacy-real-hook-runtime-activation-visible-witness-remediation-001 dd06f7176d2937c2a4c37a349620a1fb5f78f4fe
          builder/local-media-selection-race-remediation-001 07784d78688f183b2b9d152ae014a3b2ad0189db
          builder/local-media-storage-recovery-001 99b552f564d5e85f5a98d2acd240e724af3e1f85
          builder/mediaserverd-load-probe-build-001 b45cc68324c04bb72ffd99e6c7a4f2cfde7e7d5d
          builder/reference-baseline-device-policy-005 db5a6fe366b541bf1cca3a8fe486754a41f3486f
          builder/reference-camera-hook-installation-readiness-gate-001 ade6887fa6214ac1cd26b56f13e0d4f64e07e1d4
          builder/reference-camera-hook-reachability-gate-001 829f6d7581619c491308b0288af97d42bfb6955d
          builder/roothide-installation-probe-001 1b2b86c6484b4a408a0d2947f3bb4b3f990b36bc
          builder/roothide-mediaserverd-load-proof-002 78b88bb36094ae1d0b4f6369e4d6ff03e9df9e67
          builder/roothide-mediaserverd-runtime-gate-001 eb463efd7a01e9160b5acb0e3541f3e016f47015
          builder/roothide-product-packaging-integration-001 bd3d6d99275d6a94aa0eaa949534ca2b7268717a
          builder/shared-control-store-fail-open-hardening-001 63fcdf09e8ed7f01cc220dcfb372afe447b25120
          builder/shared-media-root-containment-hardening-001 2475bd51953b536c32d12e37475fd32eaf7c4a67
          validation/full-camera-build-remediation-a-001 5b582ef91bf7559c2b2f581732b89560806ecd02
          EOF

          cat > /tmp/tags.tsv <<'EOF'
          checkpoint/hookready1-device-safe ade6887fa6214ac1cd26b56f13e0d4f64e07e1d4
          evidence/legacy-hook-parity-001 ff2df5125e2e6f131b3b79ccb311a41105f950df
          evidence/real-hook-linkage-001 2895d40391a344dd5325affa05bda2cb0b1612bf
          evidence/real-hook-activation-001 5295f9a3f7bf279ef5dd34f72c0bbc11a2b1ead5
          evidence/real-hook-visible-witness-001 dd06f7176d2937c2a4c37a349620a1fb5f78f4fe
          archive/controlled-device-candidate-001 b29391853ab11c33fc506fafffc7bbf7f0ee00d6
          archive/gate1-automated-device-proof-runner-001 b36ad8268fb672324f0f8cbfa46c4e3b67d4570c
          archive/reference-baseline-device-policy-005 db5a6fe366b541bf1cca3a8fe486754a41f3486f
          archive/roothide-installation-probe-001 1b2b86c6484b4a408a0d2947f3bb4b3f990b36bc
          archive/roothide-mediaserverd-load-proof-002 78b88bb36094ae1d0b4f6369e4d6ff03e9df9e67
          archive/full-camera-build-remediation-a-001 5b582ef91bf7559c2b2f581732b89560806ecd02
          EOF

          declare -A EXPECTED_HEADS
          while read -r branch sha; do EXPECTED_HEADS["$branch"]="$sha"; done < /tmp/obsolete.tsv

          mapfile -t REMOTE_HEAD_LINES < <(git ls-remote --heads origin)
          declare -A LIVE_HEADS
          for line in "${REMOTE_HEAD_LINES[@]}"; do
            sha="${line%%$'\t'*}"
            ref="${line#*$'\t'}"
            name="${ref#refs/heads/}"
            LIVE_HEADS["$name"]="$sha"
          done

          for branch in "${!LIVE_HEADS[@]}"; do
            if [ "$branch" = "main" ]; then
              test "${LIVE_HEADS[$branch]}" = "$FROZEN_MAIN"
            elif [ "$branch" = "$CANONICAL_BRANCH" ]; then
              test "${LIVE_HEADS[$branch]}" = "$EXEC_HEAD"
            elif [ -n "${EXPECTED_HEADS[$branch]+x}" ]; then
              test "${LIVE_HEADS[$branch]}" = "${EXPECTED_HEADS[$branch]}"
            else
              echo "STALE_EXECUTION_PACKET: unexpected branch $branch"
              exit 21
            fi
          done

          for branch in "${!EXPECTED_HEADS[@]}"; do
            if [ -n "${LIVE_HEADS[$branch]+x}" ]; then
              test "${LIVE_HEADS[$branch]}" = "${EXPECTED_HEADS[$branch]}"
            fi
          done

          declare -A REQUIRED_TAGS
          while read -r tag sha; do REQUIRED_TAGS["$tag"]="$sha"; done < /tmp/tags.tsv

          mapfile -t REMOTE_TAG_BASES < <(git ls-remote --tags origin | awk '$2 !~ /\^\{\}$/ {print $2}')
          for ref in "${REMOTE_TAG_BASES[@]}"; do
            tag="${ref#refs/tags/}"
            if [ -z "${REQUIRED_TAGS[$tag]+x}" ]; then
              echo "STALE_EXECUTION_PACKET: unexpected remote tag $tag"
              exit 22
            fi
          done

          PRESENT_REQUIRED_TAGS=0
          for tag in "${!REQUIRED_TAGS[@]}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              PRESENT_REQUIRED_TAGS=$((PRESENT_REQUIRED_TAGS + 1))
            fi
          done

          BRANCH_COUNT="${#LIVE_HEADS[@]}"
          if [ "$PRESENT_REQUIRED_TAGS" -eq 0 ]; then
            test "$BRANCH_COUNT" -eq 36
            for branch in "${!EXPECTED_HEADS[@]}"; do
              test -n "${LIVE_HEADS[$branch]+x}"
            done
          fi

          TAG_MESSAGE='VCAM PRO historical checkpoint preserved during FINAL REPOSITORY HYGIENE 002.'
          CREATED_TAGS=()
          while read -r tag expected; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
              test "$(git cat-file -t "refs/tags/$tag")" = "tag"
              test "$(git rev-parse "refs/tags/$tag^{}")" = "$expected"
            else
              git cat-file -e "$expected^{commit}"
              git tag -a "$tag" "$expected" -m "$TAG_MESSAGE"
              CREATED_TAGS+=("$tag")
            fi
          done < /tmp/tags.tsv

          if [ "${#CREATED_TAGS[@]}" -gt 0 ]; then
            refs=()
            for tag in "${CREATED_TAGS[@]}"; do refs+=("refs/tags/$tag:refs/tags/$tag"); done
            git push origin "${refs[@]}"
          fi

          git fetch --force --tags origin
          while read -r tag expected; do
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
            test "$(git cat-file -t "refs/tags/$tag")" = "tag"
            test "$(git rev-parse "refs/tags/$tag^{}")" = "$expected"
            peeled="$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk '{print $1}')"
            test "$peeled" = "$expected"
          done < /tmp/tags.tsv

          DELETED=0
          while read -r branch expected; do
            current="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$current" ]; then
              continue
            fi
            if [ "$current" != "$expected" ]; then
              echo "STALE_EXECUTION_PACKET: moved branch $branch expected=$expected live=$current"
              exit 23
            fi
            git push origin --delete "$branch"
            DELETED=$((DELETED + 1))
          done < /tmp/obsolete.tsv

          mapfile -t FINAL_HEAD_LINES < <(git ls-remote --heads origin)
          test "${#FINAL_HEAD_LINES[@]}" -eq 2
          printf '%s\n' "${FINAL_HEAD_LINES[@]}" | grep -F $'refs/heads/main'
          printf '%s\n' "${FINAL_HEAD_LINES[@]}" | grep -F $'refs/heads/builder/canonical-hook-continuation-001'
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$FROZEN_MAIN"
          test "$(git ls-remote --heads origin "refs/heads/$CANONICAL_BRANCH" | awk '{print $1}')" = "$EXEC_HEAD"
          test -z "$(git ls-remote --heads origin refs/heads/builder/hook-provider-self-test-gate-001)"
          test -z "$(git ls-remote --heads origin refs/heads/builder/hook-provider-self-test-gate-001-remediation-a)"

          OPEN_PRS_AFTER="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')"
          test "$OPEN_PRS_AFTER" = "0"

          cat > docs/CANONICAL_PROJECT_STATE.md <<'EOF'
          # VCAM PRO Canonical Project State

          REPOSITORY_HYGIENE=COMPLETE
          SAFE_DEVICE_BASELINE=ade6887fa6214ac1cd26b56f13e0d4f64e07e1d4
          CANONICAL_FORWARD_BRANCH=builder/canonical-hook-continuation-001
          MAIN_FROZEN_FOR_NOW=d476caacc4f557843f9551533c2fcbe7c5d40baa
          PRESERVED_CHECKPOINT_TAGS=checkpoint/hookready1-device-safe evidence/legacy-hook-parity-001 evidence/real-hook-linkage-001 evidence/real-hook-activation-001 evidence/real-hook-visible-witness-001 archive/controlled-device-candidate-001 archive/gate1-automated-device-proof-runner-001 archive/reference-baseline-device-policy-005 archive/roothide-installation-probe-001 archive/roothide-mediaserverd-load-proof-002 archive/full-camera-build-remediation-a-001
          ABANDONED_DUMMY_BRANCHES=REMOVED
          PROOF_METHOD=DEB_SILEO_VISIBLE_BANNER
          REAL_HOOK_STATUS=SOURCE_AND_STATIC_LINKAGE_PROVEN; REAL_INSTALLATION_NOT_YET_DEVICE_PROVEN
          NEXT_PHASE=REAL_HOOK_DEVICE_PROOF
          REMOTE_DESKTOP_COMMANDER=NOT_USED_NOT_REQUIRED
          EOF

          rm "$WORKFLOW_PATH"
          git add docs/CANONICAL_PROJECT_STATE.md "$WORKFLOW_PATH"
          git diff --cached --name-only | sort > /tmp/final-files.txt
          printf '%s\n' "$WORKFLOW_PATH" docs/CANONICAL_PROJECT_STATE.md | sort > /tmp/expected-final-files.txt
          diff -u /tmp/expected-final-files.txt /tmp/final-files.txt

          git commit -m "docs: finalize canonical repository hygiene"
          FINAL_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXEC_HEAD"
          git push origin "HEAD:refs/heads/$CANONICAL_BRANCH"

          test "$(git ls-remote --heads origin "refs/heads/$CANONICAL_BRANCH" | awk '{print $1}')" = "$FINAL_HEAD"
          test "$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')" = "$FROZEN_MAIN"
          test -z "$(git ls-tree -r --name-only "$FINAL_HEAD" -- "$WORKFLOW_PATH")"

          mapfile -t VERIFY_HEADS < <(git ls-remote --heads origin)
          test "${#VERIFY_HEADS[@]}" -eq 2

          OPEN_PRS_FINAL="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')"
          test "$OPEN_PRS_FINAL" = "0"

          while read -r tag expected; do
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git cat-file -t "refs/tags/$tag")" = "tag"
            test "$(git rev-parse "refs/tags/$tag^{}")" = "$expected"
          done < /tmp/tags.tsv

          mapfile -t FINAL_DIFF < <(git diff --name-only "$PRE_HYGIENE_HEAD..$FINAL_HEAD")
          if [ "${#FINAL_DIFF[@]}" -ne 1 ] || [ "${FINAL_DIFF[0]}" != "docs/CANONICAL_PROJECT_STATE.md" ]; then
            echo "Final canonical diff contains unauthorized paths"
            printf '%s\n' "${FINAL_DIFF[@]}"
            exit 24
          fi

          echo "FINAL_REPOSITORY_HYGIENE=PASS"
          echo "CANONICAL_REPOSITORY_ALIGNMENT=PASS"
          echo "PRE_CLEANUP_BRANCH_COUNT=36"
          echo "POST_CLEANUP_BRANCH_COUNT=2"
          echo "BRANCH_DELETE_COUNT=34"
          echo "CANONICAL_FINAL_HEAD=$FINAL_HEAD"
          echo "CANONICAL_FINAL_PARENT=$EXEC_HEAD"
