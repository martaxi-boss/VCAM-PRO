name: Frame Engine Stage E1 CI

on:
  push:
    branches:
      - builder/frame-engine-stage-e1-transform-001
    paths:
      - "src/frame_engine/**"
      - "src/media_engine/**"
      - "tests/frame_engine/**"
      - "tests/media_engine/**"
      - ".github/workflows/frame-engine-stage-e1-ci.yml"
      - "docs/proofs/FRAME_ENGINE_STAGE_E1_001.md"
  pull_request:
    paths:
      - "src/frame_engine/**"
      - "src/media_engine/**"
      - "tests/frame_engine/**"
      - "tests/media_engine/**"
      - ".github/workflows/frame-engine-stage-e1-ci.yml"
      - "docs/proofs/FRAME_ENGINE_STAGE_E1_001.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-e1:
    name: Stage E1 iOS15 vImage transform
    runs-on: macos-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun clang++ --version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-path)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Record iOS16 VideoToolbox provenance
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          TRANSFER="$SDKROOT/System/Library/Frameworks/VideoToolbox.framework/Headers/VTPixelTransferSession.h"
          ROTATION="$SDKROOT/System/Library/Frameworks/VideoToolbox.framework/Headers/VTPixelRotationSession.h"

          grep -n 'OpaqueVTPixelTransferSession.*ios(16.0)' "$TRANSFER"             | tee "$RUNNER_TEMP/vt-transfer-provenance.txt"
          grep -n 'OpaqueVTPixelRotationSession.*ios(16.0)' "$ROTATION"             | tee "$RUNNER_TEMP/vt-rotation-provenance.txt"

          echo "VTPixelTransferSession=PUBLIC_IOS_16_PLUS"
          echo "VTPixelRotationSession=PUBLIC_IOS_16_PLUS"

      - name: Exact public vImage iOS15 API probe
        run: |
          set -euo pipefail
          mkdir -p build/host build/ios
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"
          COMMON="-std=c++17 -arch arm64 -isysroot $SDKROOT -miphoneos-version-min=15.0 -Wall -Wextra -Werror -Werror=unguarded-availability-new"

          cat > "$RUNNER_TEMP/vimage_ios15_probe.mm" <<'EOF'
          #include <Accelerate/Accelerate.h>
          #include <CoreVideo/CoreVideo.h>

          int main() {
              auto p01 = &CVPixelBufferPoolCreate;
              auto p02 = &CVPixelBufferPoolCreatePixelBuffer;
              auto p03 = &vImageScale_Planar8;
              auto p04 = &vImageScale_CbCr8;
              auto p05 = &vImageRotate90_Planar8;
              auto p06 = &vImageRotate90_Planar16U;
              auto p07 = &vImageConvert_420Yp8_CbCr8ToARGB8888;
              auto p08 = &vImageConvert_ARGB8888To420Yp8_CbCr8;
              auto p09 = &vImageConvert_YpCbCrToARGB_GenerateConversion;
              auto p10 = &vImageConvert_ARGBToYpCbCr_GenerateConversion;
              (void)p01; (void)p02; (void)p03; (void)p04; (void)p05;
              (void)p06; (void)p07; (void)p08; (void)p09; (void)p10;
              return 0;
          }
          EOF

          "$CXX" $COMMON "$RUNNER_TEMP/vimage_ios15_probe.mm"             -framework Accelerate -framework CoreVideo             -o "$RUNNER_TEMP/vimage_ios15_probe"             > build/ios/vimage-ios15-probe.log 2>&1
          cat build/ios/vimage-ios15-probe.log

          file "$RUNNER_TEMP/vimage_ios15_probe"             | tee build/ios/vimage-ios15-architecture.txt
          grep -q 'arm64' build/ios/vimage-ios15-architecture.txt

          xcrun otool -l "$RUNNER_TEMP/vimage_ios15_probe"             | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'             | tee build/ios/vimage-ios15-minos.txt
          grep -q 'minos 15.0' build/ios/vimage-ios15-minos.txt

          echo "VIMAGE_IOS15_API_PROBE=PASS"             | tee build/ios/vimage-ios15-result.txt

      - name: Production boundary checks
        run: |
          set -euo pipefail

          grep -q 'CVPixelBufferPoolCreate' src/media_engine/FrameTransformer.mm
          grep -q 'CVPixelBufferPoolCreatePixelBuffer' src/media_engine/FrameTransformer.mm
          grep -q 'kCVPixelBufferIOSurfacePropertiesKey' src/media_engine/FrameTransformer.mm
          grep -q 'vImageScale_Planar8' src/media_engine/FrameTransformer.mm
          grep -q 'vImageScale_CbCr8' src/media_engine/FrameTransformer.mm
          grep -q 'vImageRotate90_Planar8' src/media_engine/FrameTransformer.mm
          grep -q 'vImageRotate90_Planar16U' src/media_engine/FrameTransformer.mm
          grep -q 'vImageConvert_420Yp8_CbCr8ToARGB8888' src/media_engine/FrameTransformer.mm
          grep -q 'vImageConvert_ARGB8888To420Yp8_CbCr8' src/media_engine/FrameTransformer.mm

          forbidden='UIKit|UIImage|PHPhoto|Photos.framework|MSHookFunction|MSHookMessageEx|%hook|fishhook|mediaserverd|NSURLSession|Network.framework|VTPixelTransfer|VTPixelRotation'
          if grep -RInE "$forbidden" src/frame_engine src/media_engine; then
            echo "Forbidden Stage E1 production token found."
            exit 1
          fi

          if grep -RInE '(^|[^A-Za-z])socket[[:space:]]*\(|\bnw_[A-Za-z0-9_]+'               src/frame_engine src/media_engine; then
            echo "Forbidden Stage E1 network token found."
            exit 1
          fi

          if grep -RInE 'Accelerate|vImage|FrameTransformer|AVAssetReader|AVFoundation|VideoToolbox'               src/frame_engine/PreparedFrame.* src/frame_engine/ReadyFrameQueue.*; then
            echo "Consumer fast-path source acquired a producer dependency."
            exit 1
          fi

      - name: Build and run Stage E1 transformer tests
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             tests/media_engine/frame_transformer_stage_e1_tests.mm             -framework Accelerate             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_e1_transformer_tests

          build/host/stage_e1_transformer_tests             | tee build/host/stage-e1-transformer-summary.txt
          grep -q 'Stage E1 transformer tests run: 27, failures: 0'             build/host/stage-e1-transformer-summary.txt

      - name: Build and run Stage E1 pipeline tests
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FrameTransformer.mm             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_e1_tests.mm             -framework Accelerate             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreGraphics             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_e1_pipeline_tests

          build/host/stage_e1_pipeline_tests             | tee build/host/stage-e1-pipeline-summary.txt
          grep -q 'Stage E1 pipeline tests run: 3, failures: 0'             build/host/stage-e1-pipeline-summary.txt

      - name: Stage A regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             tests/frame_engine/frame_engine_stage_a_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_a_tests
          build/host/stage_a_tests | tee build/host/stage-a-summary.txt
          grep -q 'Tests run: 13, failures: 0' build/host/stage-a-summary.txt

      - name: Stage B regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/media_engine/LocalVideoReader.mm             tests/media_engine/local_video_reader_stage_b_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/stage_b_tests
          build/host/stage_b_tests | tee build/host/stage-b-summary.txt
          grep -q 'Stage B tests run: 10, failures: 0' build/host/stage-b-summary.txt

      - name: Stage C1 regressions
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/ready_frame_queue_stage_c1_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/stage_c1_queue_tests
          build/host/stage_c1_queue_tests             | tee build/host/stage-c1-queue-summary.txt
          grep -q 'Stage C1 queue tests run: 18, failures: 0'             build/host/stage-c1-queue-summary.txt

          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/media_engine/FrameNormalizer.cpp             tests/media_engine/frame_normalizer_stage_c1_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/stage_c1_normalizer_tests
          build/host/stage_c1_normalizer_tests             | tee build/host/stage-c1-normalizer-summary.txt
          grep -q 'Stage C1 normalizer tests run: 17, failures: 0'             build/host/stage-c1-normalizer-summary.txt

      - name: Stage D1 regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_d1_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/stage_d1_tests
          build/host/stage_d1_tests | tee build/host/stage-d1-summary.txt
          grep -q 'Stage D1 tests run: 19, failures: 0'             build/host/stage-d1-summary.txt

      - name: Stage D2 consumer regression and isolation
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/consumer_fast_path_stage_d2_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/d2_consumer_tests
          build/host/d2_consumer_tests             | tee build/host/d2-consumer-summary.txt
          grep -q 'Stage D2 consumer tests run: 5, failures: 0'             build/host/d2-consumer-summary.txt

          if otool -L build/host/d2_consumer_tests               | grep -Eq 'AVFoundation|Accelerate|VideoToolbox'; then
            echo "Consumer host slice unexpectedly depends on producer frameworks."
            exit 1
          fi

      - name: Stage D2 queue and concurrency regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/ready_frame_queue_stage_d2_stress_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/d2_queue_stress
          build/host/d2_queue_stress             | tee build/host/d2-queue-stress-summary.txt
          grep -q 'Stage D2 queue stress tests run: 8, failures: 0'             build/host/d2-queue-stress-summary.txt

      - name: Stage D2 pipeline regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations -pthread             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_d2_stress_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/d2_pipeline_stress
          build/host/d2_pipeline_stress             | tee build/host/d2-pipeline-summary.txt
          grep -q 'Stage D2 pipeline stress tests run: 5, failures: 0'             build/host/d2-pipeline-summary.txt
          grep -q '\[PASS\] 720p30 host smoke'             build/host/d2-pipeline-summary.txt

      - name: ASan and UBSan queue ownership regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -fsanitize=address,undefined -fno-omit-frame-pointer             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/ready_frame_queue_stage_d2_stress_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/d2_queue_asan_ubsan
          ASAN_OPTIONS=halt_on_error=1           UBSAN_OPTIONS=halt_on_error=1             build/host/d2_queue_asan_ubsan             > build/host/asan-ubsan-queue-summary.txt 2>&1
          cat build/host/asan-ubsan-queue-summary.txt
          grep -q 'Stage D2 queue stress tests run: 8, failures: 0'             build/host/asan-ubsan-queue-summary.txt

      - name: ASan and UBSan pipeline regression
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang++             -std=c++17 -fobjc-arc -Wall -Wextra -Werror -pedantic             -Wno-deprecated-declarations -pthread             -fsanitize=address,undefined -fno-omit-frame-pointer             -Isrc/frame_engine -Isrc/media_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/FrameEngineState.cpp             src/frame_engine/ReadyFrameQueue.cpp             src/media_engine/LocalVideoReader.mm             src/media_engine/FrameNormalizer.cpp             src/media_engine/FramePipelinePump.cpp             tests/media_engine/frame_pipeline_stage_d2_stress_tests.mm             -framework Foundation             -framework AVFoundation             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -framework CoreGraphics             -o build/host/d2_pipeline_asan_ubsan
          ASAN_OPTIONS=halt_on_error=1           UBSAN_OPTIONS=halt_on_error=1             build/host/d2_pipeline_asan_ubsan             > build/host/asan-ubsan-pipeline-summary.txt 2>&1
          cat build/host/asan-ubsan-pipeline-summary.txt
          grep -q 'Stage D2 pipeline stress tests run: 5, failures: 0'             build/host/asan-ubsan-pipeline-summary.txt

      - name: ThreadSanitizer queue regression
        run: |
          set -euo pipefail
          set +e
          xcrun --sdk macosx clang++             -std=c++17 -Wall -Wextra -Werror -pedantic -pthread             -fsanitize=thread -fno-omit-frame-pointer             -Isrc/frame_engine             src/frame_engine/PreparedFrame.cpp             src/frame_engine/ReadyFrameQueue.cpp             tests/frame_engine/ready_frame_queue_stage_d2_stress_tests.cpp             -framework CoreFoundation             -framework CoreMedia             -framework CoreVideo             -o build/host/d2_queue_tsan             > build/host/tsan-build-summary.txt 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "UNSUPPORTED BY CURRENT HOST TOOLCHAIN"               | tee build/host/tsan-result-summary.txt
            cat build/host/tsan-build-summary.txt
            exit 0
          fi

          set +e
          build/host/d2_queue_tsan             > build/host/tsan-runtime-summary.txt 2>&1
          run_status=$?
          set -e

          cat build/host/tsan-runtime-summary.txt
          if [ "$run_status" -ne 0 ]; then
            if grep -Eiq                 'ThreadSanitizer:.*(unsupported|not supported|failed to mmap|unexpected memory mapping)'                 build/host/tsan-runtime-summary.txt; then
              echo "UNSUPPORTED BY CURRENT HOST TOOLCHAIN"                 | tee build/host/tsan-result-summary.txt
              exit 0
            fi
            echo "TSAN FAILURE" | tee build/host/tsan-result-summary.txt
            exit "$run_status"
          fi

          grep -q 'Stage D2 queue stress tests run: 8, failures: 0'             build/host/tsan-runtime-summary.txt
          echo "PASS" | tee build/host/tsan-result-summary.txt

      - name: Compile iOS 15 arm64 Stage E1
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          CXX="$(xcrun --sdk iphoneos -f clang++)"
          COMMON="-std=c++17 -arch arm64 -isysroot $SDKROOT -miphoneos-version-min=15.0 -Wall -Wextra -Werror -Werror=unguarded-availability-new -pedantic"

          "$CXX" $COMMON -Isrc/frame_engine             -c src/frame_engine/PreparedFrame.cpp             -o build/ios/PreparedFrame.o
          "$CXX" $COMMON -Isrc/frame_engine             -c src/frame_engine/ReadyFrameQueue.cpp             -o build/ios/ReadyFrameQueue.o

          xcrun libtool -static             -o build/ios/libVCAMConsumerFastPathE1.a             build/ios/PreparedFrame.o             build/ios/ReadyFrameQueue.o

          "$CXX" $COMMON -Isrc/frame_engine             -c src/frame_engine/FrameEngineState.cpp             -o build/ios/FrameEngineState.o
          "$CXX" $COMMON -fobjc-arc -Wno-deprecated-declarations             -Isrc/frame_engine -Isrc/media_engine             -c src/media_engine/LocalVideoReader.mm             -o build/ios/LocalVideoReader.o
          "$CXX" $COMMON             -Isrc/frame_engine -Isrc/media_engine             -c src/media_engine/FrameNormalizer.cpp             -o build/ios/FrameNormalizer.o
          "$CXX" $COMMON             -Isrc/frame_engine -Isrc/media_engine             -c src/media_engine/FrameTransformer.mm             -o build/ios/FrameTransformer.o
          "$CXX" $COMMON             -Isrc/frame_engine -Isrc/media_engine             -c src/media_engine/FramePipelinePump.cpp             -o build/ios/FramePipelinePump.o

          xcrun libtool -static             -o build/ios/libVCAMFrameEngineStageE1.a             build/ios/PreparedFrame.o             build/ios/FrameEngineState.o             build/ios/ReadyFrameQueue.o             build/ios/LocalVideoReader.o             build/ios/FrameNormalizer.o             build/ios/FrameTransformer.o             build/ios/FramePipelinePump.o

      - name: Inspect consumer fast path
        run: |
          set -euo pipefail
          file build/ios/libVCAMConsumerFastPathE1.a             | tee build/ios/consumer-file.txt
          xcrun lipo -info build/ios/libVCAMConsumerFastPathE1.a             | tee build/ios/consumer-architecture.txt
          grep -q 'arm64' build/ios/consumer-architecture.txt
          if grep -q 'arm64e' build/ios/consumer-architecture.txt; then
            exit 1
          fi

          : > build/ios/consumer-minos.txt
          for object in build/ios/PreparedFrame.o build/ios/ReadyFrameQueue.o; do
            xcrun otool -l "$object"               | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'               | tee -a build/ios/consumer-minos.txt
          done
          test "$(grep -c 'minos 15.0' build/ios/consumer-minos.txt)" -ge 2

          xcrun nm -u build/ios/libVCAMConsumerFastPathE1.a             | tee build/ios/consumer-undefined-symbols.txt

          consumer_forbidden='AVAssetReader|AVFoundation|Accelerate|vImage|FrameTransformer|VideoToolbox|VTPixel|AVCapture|MSHookFunction|MSHookMessageEx|mediaserverd|NSURLSession|_socket|_nw_'
          if grep -E "$consumer_forbidden"               build/ios/consumer-undefined-symbols.txt; then
            echo "Forbidden consumer dependency found."
            exit 1
          fi

      - name: Inspect full producer engine
        run: |
          set -euo pipefail
          : > build/ios/engine-minos.txt
          for object in               PreparedFrame.o               FrameEngineState.o               ReadyFrameQueue.o               LocalVideoReader.o               FrameNormalizer.o               FrameTransformer.o               FramePipelinePump.o; do
            file "build/ios/$object"
            xcrun otool -l "build/ios/$object"               | grep -A 6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS'               | tee -a build/ios/engine-minos.txt
          done

          test "$(grep -c 'minos 15.0' build/ios/engine-minos.txt)" -ge 7

          xcrun lipo -info build/ios/libVCAMFrameEngineStageE1.a             | tee build/ios/engine-architecture.txt
          grep -q 'arm64' build/ios/engine-architecture.txt
          if grep -q 'arm64e' build/ios/engine-architecture.txt; then
            exit 1
          fi

          xcrun nm -u build/ios/libVCAMFrameEngineStageE1.a             | tee build/ios/engine-undefined-symbols.txt

          grep -q '_CVPixelBufferPoolCreate'             build/ios/engine-undefined-symbols.txt
          grep -q '_CVPixelBufferPoolCreatePixelBuffer'             build/ios/engine-undefined-symbols.txt
          grep -q '_vImageScale_Planar8'             build/ios/engine-undefined-symbols.txt
          grep -q '_vImageScale_CbCr8'             build/ios/engine-undefined-symbols.txt
          grep -q '_vImageRotate90_Planar8'             build/ios/engine-undefined-symbols.txt
          grep -q '_vImageRotate90_Planar16U'             build/ios/engine-undefined-symbols.txt
          grep -q '_vImageConvert_420Yp8_CbCr8ToARGB8888'             build/ios/engine-undefined-symbols.txt
          grep -q '_vImageConvert_ARGB8888To420Yp8_CbCr8'             build/ios/engine-undefined-symbols.txt

          engine_forbidden='UIKit|UIImage|PHPhoto|MSHookFunction|MSHookMessageEx|AVCapture|VTPixelTransfer|VTPixelRotation|NSURLSession|_socket|_nw_'
          if grep -E "$engine_forbidden"               build/ios/engine-undefined-symbols.txt; then
            echo "Forbidden Stage E1 producer dependency found."
            exit 1
          fi

      - name: Upload Stage E1 validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcam-frame-engine-stage-e1-validation
          path: |
            build/ios/vimage-ios15-probe.log
            build/ios/vimage-ios15-architecture.txt
            build/ios/vimage-ios15-minos.txt
            build/ios/vimage-ios15-result.txt
            build/ios/libVCAMConsumerFastPathE1.a
            build/ios/consumer-file.txt
            build/ios/consumer-architecture.txt
            build/ios/consumer-minos.txt
            build/ios/consumer-undefined-symbols.txt
            build/ios/libVCAMFrameEngineStageE1.a
            build/ios/engine-architecture.txt
            build/ios/engine-minos.txt
            build/ios/engine-undefined-symbols.txt
            build/host/stage-e1-transformer-summary.txt
            build/host/stage-e1-pipeline-summary.txt
            build/host/stage-a-summary.txt
            build/host/stage-b-summary.txt
            build/host/stage-c1-queue-summary.txt
            build/host/stage-c1-normalizer-summary.txt
            build/host/stage-d1-summary.txt
            build/host/d2-consumer-summary.txt
            build/host/d2-queue-stress-summary.txt
            build/host/d2-pipeline-summary.txt
            build/host/asan-ubsan-queue-summary.txt
            build/host/asan-ubsan-pipeline-summary.txt
            build/host/tsan-build-summary.txt
            build/host/tsan-runtime-summary.txt
            build/host/tsan-result-summary.txt
            ${{ runner.temp }}/vt-transfer-provenance.txt
            ${{ runner.temp }}/vt-rotation-provenance.txt
          if-no-files-found: warn
          retention-days: 14
